    {
      "id": "m12",
      "title": "Malware obfuscation & packing",
      "concept": "\n  <p>Malware authors actively try to make static analysis harder through <b>obfuscation</b>:</p>\n  <ul>\n    <li><b>Packing</b> — compressing/encrypting the actual malicious code, wrapped in a small \"unpacker\" stub that decodes and runs the real payload only in memory at runtime, hiding the true code from a static file scan</li>\n    <li><b>String encryption</b> — hiding recognizable text (like C2 domain names) that would otherwise be an easy static-analysis giveaway</li>\n    <li><b>Polymorphism</b> — the malware modifies its own code slightly with each new infection, so every copy has a different file hash, defeating simple hash-based signature detection</li>\n  </ul>\n  <div class=\"callout\">This is a direct, ongoing arms race: as detection techniques improve, obfuscation techniques evolve to evade them, and vice versa — a genuinely never-ending cycle rather than a problem that gets permanently \"solved.\"</div>",
      "check": {
        "type": "quiz",
        "q": "Why does polymorphic malware defeat simple hash-based signature detection?",
        "opts": [
          "It doesn't defeat it, hash detection still works fine",
          "Each infection modifies the code slightly, producing a different file hash every time, so no single static hash value can catch all variants",
          "Polymorphic malware has no executable code",
          "It only affects encrypted files"
        ],
        "correct": 1,
        "explain": "Hash-based detection relies on an exact match — if the malware changes its own bytes on each infection, its hash changes too, breaking that matching approach entirely."
      },
      "xp": 26,
      "credits": 11
    },
    {
      "id": "m13",
      "title": "Botnets: malware at scale",
      "concept": "\n  <p>Recall botnets from the DDoS lesson — worth a closer look at how they actually function as coordinated systems, not just \"a lot of infected devices.\"</p>\n  <p>A botnet typically has this basic structure:</p>\n  <pre>Attacker → C2 server → thousands of infected \"bot\" devices</pre>\n  <p>The attacker (or often, the operator who rents access to others as a criminal service) sends instructions to the C2 infrastructure, which relays commands out to every infected device — launch a DDoS, send spam, mine cryptocurrency, harvest credentials — often without any individual device owner ever noticing their device is compromised and participating at all.</p>\n  <div class=\"callout warn\">Many real botnets specifically target IoT devices (routers, cameras, DVRs) precisely because those devices are frequently never patched, use weak default credentials, and run unattended for years — an ideal, low-effort combination for building a large, durable botnet.</div>",
      "check": {
        "type": "quiz",
        "q": "Why are IoT devices (routers, cameras) a particularly attractive target for building large botnets?",
        "opts": [
          "IoT devices have no network connectivity, so they can't be part of botnets",
          "They're frequently unpatched, use weak default credentials, and run unattended for years — an easy, durable combination for attackers to exploit at scale",
          "IoT devices are always more powerful than regular computers",
          "Botnets can only be built from IoT devices, never traditional computers"
        ],
        "correct": 1,
        "explain": "The specific combination of poor patching, weak defaults, and long unattended uptime makes IoT devices unusually easy and durable targets for large-scale botnet recruitment."
      },
      "xp": 24,
      "credits": 10
    },
    {
      "id": "m14",
      "title": "Supply chain attacks on software",
      "concept": "\n  <p>Rather than attacking a target directly, a <b>software supply chain attack</b> compromises something upstream that the target trusts and incorporates — a shared library, a build tool, an update mechanism — turning one successful compromise into access to every downstream user who trusts that source.</p>\n  <p>This is a devastating attack pattern precisely because it exploits legitimate trust relationships: a company diligently verifying and trusting their vendor's signed software update has no obvious way to know that update pipeline itself was compromised upstream, since everything about the delivery looks completely legitimate and expected.</p>\n  <div class=\"callout warn\">This connects directly to earlier lessons: it's why patch management (Foundations), vendor risk management (GRC), and mobile app supply chain risk (Mobile Security) all specifically call out this exact pattern — it's one of the most consistently effective and hard-to-fully-defend-against real-world attack categories precisely because it abuses legitimate trust rather than bypassing it.</div>",
      "check": {
        "type": "quiz",
        "q": "Why are software supply chain attacks considered especially dangerous and hard to fully defend against?",
        "opts": [
          "They're actually quite rare and low-impact in practice",
          "They exploit legitimate trust relationships (a vendor's signed update, a trusted library) so the compromise looks completely normal and expected to the victim",
          "They only affect open-source software, never commercial products",
          "They're easily detected by any basic antivirus"
        ],
        "correct": 1,
        "explain": "The core difficulty is that supply chain attacks don't need to bypass trust — they weaponize trust the victim already legitimately extends, making the compromise appear entirely normal."
      },
      "xp": 26,
      "credits": 11
    },
    {
      "id": "m15",
      "title": "Threat intelligence & threat actor attribution",
      "concept": "\n  <p><b>Threat intelligence</b> is the practice of gathering and analyzing information about active threats — who's attacking, how, and why — to inform defensive priorities, extending the IOC-sharing concept into a broader, more strategic discipline.</p>\n  <p><b>Attribution</b> (figuring out WHO is behind an attack) is notoriously difficult and often only probabilistic, based on patterns like:</p>\n  <ul>\n    <li>Reused tools, infrastructure, or code patterns matching a previously identified group</li>\n    <li>Operational timing suggesting a specific timezone/working pattern</li>\n    <li>Target selection consistent with a particular group's known historical motives</li>\n  </ul>\n  <div class=\"callout warn\">Attribution should be treated with real epistemic humility — sophisticated attackers deliberately plant false flags (deliberately using another group's known tools/techniques) specifically to mislead attribution efforts, so confident, definitive claims about \"who did it\" deserve real scrutiny rather than automatic trust.</div>",
      "check": {
        "type": "quiz",
        "q": "Why should confident claims about who is behind a specific cyberattack be treated with some skepticism?",
        "opts": [
          "Attribution is always 100% certain and never disputed",

          "Threat actors never reuse tools or infrastructure",
          "Attribution is a solved, purely technical problem with no ambiguity"
        ],
        "correct": 1,
        "explain": "Deliberate false-flag operations are a documented, real technique — which is exactly why attribution claims warrant genuine scrutiny rather than automatic acceptance."
      },

  "mobile": [
    {
      "id": "mb1",
      "title": "App sandboxing: iOS & Android's core defense",
      "concept": "\n  <p>Both major mobile platforms are built around <b>app sandboxing</b> — each app runs in its own isolated environment, unable to directly access another app's data or files, by default.</p>\n  <pre>App A's sandbox          App B's sandbox\n  /data/app-a/               /data/app-b/\n  ├── files                  ├── files\n  ├── database                ├── database\n  └── (App B cannot           └── (App A cannot\n      read this)                  read this)</pre>\n  <p>This is a huge structural improvement over traditional desktop operating systems, where any program you run typically has broad access to your whole file system by default. On mobile, apps must explicitly request specific permissions (camera, contacts, location) rather than getting broad access automatically.</p>\n  <div class=\"callout\">Sandboxing is exactly why mobile malware generally needs to find an actual OS-level vulnerability to \"escape\" its sandbox and access other apps' data — the platform's default posture is already fairly restrictive, unlike older desktop models.</div>",
      "check": {
        "type": "quiz",
        "q": "What does app sandboxing fundamentally prevent by default on mobile platforms?",
        "opts": [
          "Apps from connecting to the internet at all",
          "One app from directly accessing another app's private data and files without explicit permission",
          "Apps from being installed at all",
          "Battery drain"
        ],
        "correct": 1,
        "explain": "Sandboxing isolates each app's data from every other app by default — a structural security improvement over unrestricted desktop-style file access."
      },
      "xp": 20,
      "credits": 8
    },
    {
      "id": "mb2",
      "title": "Mobile app permissions, done right and wrong",
      "concept": "\n  <p>Since apps must request permissions explicitly, the permission model's real-world security depends heavily on how thoughtfully both developers and users treat it.</p>\n  <ul>\n    <li><b>Over-permissioned apps</b> — a flashlight app requesting access to contacts and location has no legitimate functional reason to need either; this is a major red flag worth scrutinizing before installing</li>\n    <li><b>Runtime vs. install-time permissions</b> — modern mobile OSes ask for permissions at the moment they're actually needed (runtime), rather than all upfront at install — letting users make a more informed, contextual decision</li>\n    <li><b>Permission creep over updates</b> — an app might request only minimal permissions initially, then add more invasive ones in a later update once it has an established user base who won't scrutinize the update as carefully</li>\n  </ul>\n  <div class=\"callout\">A genuinely useful practical habit: periodically reviewing your phone's app permissions list and revoking anything that doesn't make clear functional sense for what that app actually does.</div>",
      "check": {
        "type": "quiz",
        "q": "Why is a flashlight app requesting access to your contacts and location considered a red flag?",
        "opts": [
          "It isn't actually a concern, flashlight apps need broad permissions",
          "Those permissions have no legitimate functional relationship to what a flashlight app actually needs to do — the mismatch itself is suspicious",
          "All apps need contacts access to function on modern phones",
          "Flashlight apps are always malware by definition"
        ],
        "correct": 1,
        "explain": "Permission requests should map to actual app functionality — a mismatch between requested permissions and the app's stated purpose is a classic warning sign."
      },
      "xp": 20,
      "credits": 8
    },
    {
      "id": "mb3",
      "title": "Mobile malware distribution: sideloading & fake apps",
      "concept": "\n  <p>Official app stores (Apple App Store, Google Play) apply review processes that catch a meaningful share of malicious apps before they're ever published — not perfect, but a real layer of defense. Malware distributors work around this in a few common ways:</p>\n  <ul>\n    <li><b>Sideloading</b> — installing an app from outside the official store entirely, bypassing that review process completely (much more common/default on Android than iOS)</li>\n    <li><b>Fake/clone apps</b> — a convincing copy of a popular legitimate app (a fake banking app, a fake cryptocurrency wallet), sometimes even briefly appearing in official stores before being caught and removed</li>\n    <li><b>Malicious SDK/library supply chain</b> — a legitimate-seeming app unknowingly bundles a malicious third-party advertising or analytics library, which is where the actual malicious behavior originates</li>\n  </ul>\n  <div class=\"callout warn\">That third pattern (supply chain) is a genuinely hard problem — the app developer themselves might have no malicious intent at all, having simply trusted a bundled library that turned out to be compromised or intentionally malicious.</div>",
      "check": {
        "type": "quiz",
        "q": "How can a legitimate app with no malicious intent from its own developer still end up distributing malware?",
        "opts": [
          "This scenario is impossible, only intentionally malicious developers distribute malware",
          "A bundled third-party library or SDK (like an ad/analytics library) the developer trusted could itself be malicious or later compromised",
          "Legitimate apps are always malware-free by definition",
          "Only sideloaded apps can ever be compromised this way"
        ],
        "correct": 1,
        "explain": "This is a real supply-chain risk — the app developer's own code can be entirely clean while a bundled dependency introduces the actual malicious behavior."
      },
      "xp": 24,
      "credits": 10
    },
    {
      "id": "mb4",
      "title": "Insecure data storage on mobile",
      "concept": "\n  <p>A very common mobile app vulnerability class: storing sensitive data insecurely on the device itself, where anyone with physical access (or another exploit) could retrieve it.</p>\n  <ul>\n    <li>Storing passwords, tokens, or API keys in plaintext in local files or unencrypted local databases</li>\n    <li>Logging sensitive data to system logs that other apps (or a connected debugging tool) might be able to read</li>\n    <li>Caching sensitive screens/data in a way that appears in the OS's \"recent apps\" screenshot preview</li>\n  </ul>\n  <p>The fix generally involves each platform's dedicated secure storage mechanisms — iOS's Keychain, Android's Keystore — which are specifically hardware-backed, encrypted storage areas designed exactly for credentials and sensitive tokens, rather than plain files or a regular local database.</p>",
      "check": {
        "type": "quiz",
        "q": "Why do iOS Keychain and Android Keystore exist as separate mechanisms from regular app file storage?",
        "opts": [
          "They don't offer any real security advantage over regular files",
          "They provide hardware-backed, encrypted storage specifically designed for credentials and sensitive tokens, unlike plain local files or databases",
          "They're only used for storing photos",
          "They make apps launch faster"
        ],
        "correct": 1,
        "explain": "These platform-specific secure storage mechanisms exist precisely because regular file/database storage isn't sufficiently protected for genuinely sensitive data like credentials."
      },
      "xp": 24,
      "credits": 10
    },
    {
      "id": "mb5",
      "title": "Mobile app reverse engineering basics",
      "concept": "\n  <p>Mobile apps, despite being distributed as compiled packages (APK for Android, IPA for iOS), can often be at least partially reverse-engineered — an important consideration for both attackers probing for flaws and developers trying to protect their app's logic.</p>\n  <ul>\n    <li>Android APKs can often be decompiled back to fairly readable Java/Kotlin-like source using freely available tools, since Android apps commonly run on a virtual machine with recoverable bytecode</li>\n    <li>iOS apps are compiled to native machine code, generally harder to fully decompile back to readable source, but still analyzable at the assembly/binary level</li>\n    <li>Developers sometimes apply <b>code obfuscation</b> to make reverse engineering meaningfully harder — not impossible, but more time-consuming and less rewarding for an attacker</li>\n  </ul>\n  <div class=\"callout warn\">Real consequence: hardcoding an API key or secret directly in mobile app code is genuinely risky — a motivated attacker with the published app file can very plausibly extract it, unlike a secret that only ever lives server-side.</div>",
      "check": {
        "type": "quiz",
        "q": "Why is hardcoding a secret API key directly into mobile app code considered risky?",
        "opts": [
          "Mobile apps cannot store any strings at all",
          "A motivated attacker can often decompile or analyze the distributed app package and extract embedded secrets from it",
          "API keys expire automatically inside mobile apps",
          "This is only a risk for Android apps, never iOS"
        ],
        "correct": 1,
        "explain": "Since the compiled app itself is distributed to and reachable by anyone, embedded secrets are fundamentally more exposed than ones that stay entirely server-side."
      },
      "xp": 24,
      "credits": 10
    },
    {
      "id": "mb6",
      "title": "Mobile network security: certificate pinning revisited",
      "concept": "\n  <p>Recall certificate pinning from the Cryptography track — mobile apps are actually one of the most common real-world places it's deployed, and for a good specific reason: mobile devices very often connect through untrusted networks (public WiFi, unknown hotspots), significantly raising MITM risk compared to a device that mostly stays on a known, trusted home/office network.</p>\n  <p>A banking or messaging app pinning its certificate means even a MITM attacker who's somehow gotten a validly-signed (but not the expected specific) certificate accepted onto the victim's device can't successfully intercept that particular app's traffic — the app itself refuses the connection.</p>\n  <div class=\"callout\">This directly connects mobile-specific risk (frequent untrusted network usage) back to a cryptography technique you already learned — a good example of how these tracks compound rather than existing in isolation.</div>",
      "check": {
        "type": "quiz",
        "q": "Why is certificate pinning particularly valuable for mobile apps specifically?",
        "opts": [
          "Mobile devices don't support HTTPS by default",
          "Mobile devices frequently connect via untrusted public networks, raising MITM risk well beyond a device that mostly stays on a known trusted network",
          "Pinning only works on mobile operating systems",
          "Mobile apps don't use certificates at all"
        ],
        "correct": 1,
        "explain": "The elevated real-world MITM exposure from frequent public/untrusted network use is exactly the scenario pinning is designed to specifically harden against."
      },
      "xp": 22,
      "credits": 9
    },
    {
      "id": "mb7",
      "title": "Jailbreaking & rooting risks",
      "concept": "\n  <p><b>Jailbreaking</b> (iOS) and <b>rooting</b> (Android) remove the platform's built-in restrictions, granting the user (and, critically, any app the user runs) much deeper system access than the platform normally allows by design.</p>\n  <p>Security implications:</p>\n  <ul>\n    <li>The sandboxing protections covered earlier are significantly weakened or bypassed entirely</li>\n    <li>Malicious apps on a rooted/jailbroken device can potentially access data or perform actions far beyond normal app sandbox limits</li>\n    <li>Security-conscious apps (banking apps especially) often specifically detect jailbroken/rooted devices and refuse to run, or restrict sensitive functionality, precisely because they can't rely on the platform's normal protections holding on such a device</li>\n  </ul>\n  <div class=\"callout\">This isn't a judgment on why people jailbreak/root their devices (customization, control, legitimate research) — it's simply a real security tradeoff worth understanding clearly if you do.</div>",
      "check": {
        "type": "quiz",
        "q": "Why might a banking app specifically refuse to run, or limit functionality, on a rooted/jailbroken device?",
        "opts": [
          "Banking apps don't actually care about device security state",
          "Rooting/jailbreaking weakens the platform's built-in sandboxing protections the app would otherwise rely on, increasing real risk to sensitive functionality",
          "Rooted devices cannot connect to the internet",
          "This is purely a marketing decision with no real security basis"
        ],
        "correct": 1,
        "explain": "The app's risk calculation changes on a device where the normal platform-level protections it relies on can no longer be assumed to be intact."
      },
      "xp": 22,
      "credits": 9
    },
    {
      "id": "mb8",
      "title": "Mobile phishing (smishing) specifics",
      "concept": "\n  <p>Recall smishing from the Human Layer track — worth a mobile-specific deep dive since phones have unique characteristics that change the calculus:</p>\n  <ul>\n    <li><b>Smaller screens make URLs harder to fully inspect</b> — a lookalike domain is often even less noticeable on mobile than on a full desktop browser with a wide address bar</li>\n    <li><b>SMS carries an inherent trust bias</b> — many people are more conditioned to distrust suspicious emails than suspicious texts, despite texts being just as easily spoofed</li>\n    <li><b>App-based one-tap actions</b> — a malicious link can deep-link directly into an action (like opening a pre-filled payment app screen), reducing the number of steps/scrutiny opportunities compared to a desktop flow</li>\n  </ul>\n  <div class=\"callout warn\">The defense principle is identical to the general phishing lesson: verify through an independent channel before acting, regardless of platform — but the reduced screen real estate and the misplaced trust in SMS specifically make mobile phishing measurably more effective in practice.</div>",
      "check": {
        "type": "quiz",
        "q": "Why can smishing (SMS phishing) be more effective than email phishing for some users?",
        "opts": [
          "SMS messages cannot be spoofed at all, so users trust them for good reason",
          "Smaller screens make lookalike URLs harder to spot, and many people are conditioned to trust text messages more than email despite texts being just as spoofable",
          "Smishing is a completely different, non-social-engineering attack type",
          "Phones cannot display any security warnings"
        ],
        "correct": 1,
        "explain": "The combination of reduced URL visibility and a misplaced sense of SMS trustworthiness genuinely does make mobile phishing effective in ways that compound rather than replace the general phishing principles."
      },
      "xp": 22,
      "credits": 9
    },
    {
      "id": "mb9",
      "title": "Mobile Device Management (MDM)",
      "concept": "\n  <p>Organizations issuing phones to employees (or allowing personal devices to access company data — \"BYOD,\" Bring Your Own Device) need a way to enforce security policy at scale. <b>MDM</b> platforms provide exactly this:</p>\n  <ul>\n    <li>Enforcing device-level requirements (passcode complexity, encryption enabled, OS up to date)</li>\n    <li>Remotely wiping a lost or stolen device's corporate data</li>\n    <li>Restricting which apps can be installed, or pushing approved apps automatically</li>\n    <li>Separating (or \"containerizing\") corporate data from personal data on the same physical device in BYOD scenarios</li>\n  </ul>\n  <div class=\"callout\">That last point matters a lot for employee trust — a well-implemented BYOD/MDM setup should be able to wipe just the corporate container, not someone's personal photos and messages, when they leave the company or lose the device.</div>",
      "check": {
        "type": "quiz",
        "q": "In a well-implemented BYOD (Bring Your Own Device) MDM setup, what should a remote wipe typically target?",
        "opts": [
          "The entire device, including all personal data, with no distinction",
          "Just the corporate data container, leaving the employee's personal data and apps untouched",
          "Nothing, remote wipe is not possible on personal devices",
          "Only photos taken with the work camera app"
        ],
        "correct": 1,
        "explain": "Good BYOD implementations specifically separate corporate and personal data so that security actions like remote wipe can target only the organization's own container."
      },
      "xp": 22,
      "credits": 9
    },
    {
      "id": "mb10",
      "title": "MISSION: Spot the risky permission",
      "concept": "\n  <p>Head to the <b>Terminal</b> for mission <code>permission-audit</code> — review a simulated app permissions manifest and flag which requested permission doesn't match the app's stated purpose.</p>",
      "check": {
        "type": "terminal",
        "missionId": "permission-audit"
      },
      "xp": 32,
      "credits": 14
    },
    {
      "id": "mb11",
      "title": "Biometric authentication on mobile",
      "concept": "\n  <p>Fingerprint and face-based authentication (Touch ID, Face ID, and Android equivalents) are now standard mobile security features. Worth understanding what they actually protect against — and what they don't:</p>\n  <ul>\n    <li>Biometric data is generally processed and stored locally in dedicated secure hardware (a \"secure enclave\"), and typically never leaves the device or gets sent to any server</li>\n    <li>Biometrics are convenient, but not necessarily a stronger authentication factor than a genuinely strong passcode in every legal/practical sense — in some jurisdictions, legal protections around being compelled to unlock a device differ meaningfully between \"provide a password\" and \"provide a fingerprint/face\"</li>\n    <li>Biometrics can, in some cases, be spoofed with sufficiently sophisticated methods (high-quality fingerprint replicas, photos/masks for less robust face recognition systems), though modern implementations have raised this bar considerably</li>\n  </ul>",
      "check": {
        "type": "quiz",
        "q": "Where is biometric authentication data (like a fingerprint) typically stored on a modern mobile device?",
        "opts": [
          "Sent to and stored on the device manufacturer's servers",
          "Processed and stored locally in dedicated secure hardware on the device itself, typically never transmitted elsewhere",
          "Stored in the app's regular local storage",
          "Biometric data isn't stored at all, ever"
        ],
        "correct": 1,
        "explain": "Modern implementations specifically use local, dedicated secure hardware — this local-only handling is precisely why biometric data isn't typically at risk from a server-side breach elsewhere."
      },
      "xp": 22,
      "credits": 9
    },
    {
      "id": "mb12",
      "title": "Mobile app privacy labels & data collection transparency",
      "concept": "\n  <p>Both major app stores now require developers to disclose what data their app collects and how it's used, in a standardized, comparable format shown before you even install — a direct, practical response to widespread historical opacity about mobile data collection practices.</p>\n  <p>Worth being a genuinely critical reader of these labels, not just glancing past them:</p>\n  <ul>\n    <li>\"Data used to track you\" specifically means data potentially linked with third parties or other companies for advertising/tracking purposes — a meaningfully different, more concerning category than data used only within the app itself</li>\n    <li>Compare what's disclosed against what the app's actual stated functionality would reasonably require — the same permission-mismatch red flag from earlier applies here too</li>\n  </ul>\n  <div class=\"callout\">This connects directly back to the earlier \"flashlight app requesting contacts\" lesson — privacy labels give you a genuinely more structured, comparable way to actually spot that same kind of mismatch before you ever install the app, rather than only discovering it after the fact.</div>",
      "check": {
        "type": "quiz",
        "q": "What does 'data used to track you' specifically indicate in an app store privacy label?",
        "opts": [
          "The app doesn't collect any data at all",
          "The data may be linked with third parties or other companies for advertising/tracking purposes — a meaningfully different category than data used only internally within the app",
          "This label has no real practical meaning",
          "It means the app is definitely malware"
        ],
        "correct": 1,
        "explain": "This specific disclosure category is meaningfully different from general data collection — it specifically flags cross-company/third-party linkage for tracking, which is a real distinct privacy concern worth weighing."
      },
      "xp": 22,
      "credits": 9
    }

  "grc": [
    {
      "id": "g1",
      "title": "What GRC actually stands for, and why it matters",
      "concept": "\n  <p><b>GRC</b> stands for <b>Governance, Risk, and Compliance</b> — the organizational discipline of making sure security decisions align with business objectives, legal requirements, and an honest understanding of actual risk, rather than technical security operating in its own isolated bubble.</p>\n  <ul>\n    <li><b>Governance</b> — the policies, structure, and accountability defining how security decisions get made and who's responsible for them</li>\n    <li><b>Risk</b> — identifying, assessing, and deciding how to handle (accept, mitigate, transfer, avoid) potential threats</li>\n    <li><b>Compliance</b> — meeting specific external legal, regulatory, or contractual security requirements</li>\n  </ul>\n  <div class=\"callout\">A common misconception is that GRC is \"just paperwork,\" disconnected from real technical security. In practice, it's the layer that decides WHERE technical security effort and budget actually go — a security team can be technically excellent and still fail badly if it's solving the wrong priorities.</div>",
      "check": {
        "type": "quiz",
        "q": "What is the core role GRC plays relative to technical security work?",
        "opts": [
          "GRC replaces the need for technical security entirely",
          "GRC determines priorities, accountability, and requirements that guide where technical security effort and resources actually go",
          "GRC only applies to companies with no technical security team",
          "GRC is exclusively about writing employee handbooks"
        ],
        "correct": 1,
        "explain": "GRC is the decision-making and prioritization layer — it shapes what technical security actually focuses on, rather than being separate from or a replacement for it."
      },
      "xp": 22,
      "credits": 9
    },
    {
      "id": "g2",
      "title": "Risk = Likelihood × Impact, applied",
      "concept": "\n  <p>Recall the threat modeling equation from the Human Layer track — GRC formalizes this into an actual working process, usually called a <b>risk register</b>.</p>\n  <pre>Risk               Likelihood   Impact    Priority\nUnpatched server   High         High      CRITICAL\nWeak WiFi password Medium       Medium    MODERATE\nOld office lock    Low          Low       MINOR</pre>\n  <p>The point of formalizing this: with genuinely limited time/budget, an organization needs an explicit, defensible, and consistent way to decide what gets addressed first — rather than everyone in the room simply advocating loudest for their own pet concern.</p>\n  <div class=\"callout\">A subtlety worth noting: \"impact\" isn't only financial — it can include reputational damage, regulatory penalties, safety consequences, or loss of customer trust, all of which are genuinely harder to quantify precisely but still very real and worth weighing.</div>",
      "check": {
        "type": "quiz",
        "q": "Why do organizations formalize risk assessment into something like a risk register rather than relying on informal discussion?",
        "opts": [
          "It's required purely for legal paperwork with no practical value",
          "It provides an explicit, defensible, consistent way to prioritize limited security resources rather than whoever argues loudest winning the argument",
          "Risk registers replace the need for any actual security controls",
          "It only matters for very large organizations"
        ],

      "id": "g3",
      "title": "NIST Cybersecurity Framework, the five functions",
      "concept": "\n  <p>The <b>NIST Cybersecurity Framework (CSF)</b> is one of the most widely referenced security frameworks, organizing security activity into five core functions:</p>\n  <ul>\n    <li><b>Identify</b> — understand your assets, risks, and environment</li>\n    <li><b>Protect</b> — implement safeguards (access control, training, encryption)</li>\n    <li><b>Detect</b> — implement monitoring to notice security events as they happen</li>\n    <li><b>Respond</b> — take action when an incident is detected (recall the 6 incident response phases)</li>\n    <li><b>Recover</b> — restore normal operations and capabilities after an incident</li>\n  </ul>\n  <p>NIST CSF is deliberately a framework, not a checklist of specific technical requirements — it tells you WHAT categories of activity matter, letting each organization decide HOW to actually implement them based on their own specific context and risk.</p>",

      "id": "g4",
      "title": "ISO 27001, in plain terms",
      "concept": "\n  <p><b>ISO/IEC 27001</b> is an international standard for an <b>Information Security Management System (ISMS)</b> — essentially, a systematic, ongoing process for managing an organization's information security, rather than a one-time technical checklist.</p>\n  <p>Organizations can be formally <b>certified</b> against ISO 27001 by an accredited auditor — this certification is often required by enterprise customers/partners as a condition of doing business, since it provides external, independently verified assurance about security practices without the customer needing to audit the vendor themselves in full technical depth.</p>\n  <div class=\"callout\">Key idea underlying ISO 27001: security isn't a project with an end date, it's a continuous management cycle — plan, implement, monitor, review, improve, repeat indefinitely. The certification itself requires periodic re-audits precisely because a point-in-time snapshot of \"secure\" doesn't stay true forever.</div>",

      "id": "g5",
      "title": "GDPR essentials",
      "concept": "\n  <p>The <b>GDPR (General Data Protection Regulation)</b> is EU legislation governing how organizations handle personal data of EU residents — and it applies globally to any organization handling that data, regardless of where the organization itself is based.</p>\n  <p>Core principles worth knowing:</p>\n  <ul>\n    <li><b>Lawful basis</b> — organizations need a legitimate legal reason to process personal data (consent, contract necessity, legal obligation, etc.), not just \"because we wanted to\"</li>\n    <li><b>Data minimization</b> — collect only what's actually necessary for the stated purpose, not everything that might someday be useful</li>\n    <li><b>Right to erasure (\"right to be forgotten\")</b> — individuals can request deletion of their personal data under certain conditions</li>\n    <li><b>Breach notification</b> — organizations must report qualifying data breaches to regulators within 72 hours of becoming aware</li>\n  </ul>\n  <div class=\"callout warn\">GDPR penalties can be severe — up to 4% of global annual revenue for the most serious violations — which is exactly why \"data protection by design\" became a mainstream engineering practice rather than a legal afterthought bolted on later.</div>",

      "id": "g6",
      "title": "HIPAA & healthcare data",
      "concept": "\n  <p><b>HIPAA (Health Insurance Portability and Accountability Act)</b> is US legislation governing protected health information (PHI) — patient records, treatment details, insurance information, and similar healthcare data.</p>\n  <p>Key HIPAA security concepts:</p>\n  <ul>\n    <li><b>Covered entities</b> — healthcare providers, insurers, and related organizations directly bound by HIPAA</li>\n    <li><b>Business associates</b> — vendors/contractors handling PHI on a covered entity's behalf are also bound by HIPAA obligations through a formal agreement, not exempt just because they're a third party</li>\n    <li><b>Minimum necessary standard</b> — similar to GDPR's data minimization — only access/share the minimum PHI actually needed for a given purpose</li>\n    <li><b>Administrative, physical, and technical safeguards</b> — HIPAA explicitly requires controls across all three categories, not just technical ones</li>\n  </ul>\n  <div class=\"callout\">This \"business associate\" concept is a broader compliance pattern worth internalizing: regulations increasingly hold an entire vendor/supply chain accountable, not just the primary organization — you can't simply outsource your compliance obligations away by handing data to a third party.</div>",

      "id": "g7",
      "title": "PCI DSS: protecting payment card data",
      "concept": "\n  <p><b>PCI DSS (Payment Card Industry Data Security Standard)</b> is an industry standard (not government law, but effectively mandatory for anyone processing card payments) defining security requirements for handling credit/debit card data.</p>\n  <p>Core requirements include things like:</p>\n  <ul>\n    <li>Never storing certain sensitive card data (like the CVV) after transaction authorization, under any circumstances</li>\n    <li>Encrypting cardholder data both in transit and at rest</li>\n    <li>Restricting access to cardholder data on a strict need-to-know basis</li>\n    <li>Regular vulnerability scanning and penetration testing</li>\n  </ul>\n  <div class=\"callout\">A common, genuinely smart strategy many organizations use: minimizing their own PCI DSS compliance burden entirely by never directly handling raw card numbers at all — instead using a payment processor's hosted checkout/tokenization service, so the sensitive data never even touches their own systems in the first place.</div>",

    {
      "id": "g8",
      "title": "Security policies vs. standards vs. procedures",
      "concept": "\n  <p>Organizational documentation follows a hierarchy worth distinguishing clearly:</p>\n  <ul>\n    <li><b>Policy</b> — a high-level statement of intent and requirement (\"All laptops must be encrypted\"). Rarely changes.</li>\n    <li><b>Standard</b> — specific, measurable requirements supporting a policy (\"Laptops must use AES-256 full-disk encryption\"). Changes occasionally as technology evolves.</li>\n    <li><b>Procedure</b> — step-by-step instructions for actually accomplishing something (\"To enable BitLocker on a Windows laptop, do steps 1-7...\"). Changes frequently as tools/processes evolve.</li>\n  </ul>\n  <div class=\"callout\">Getting this hierarchy right matters practically: policies should be stable and rarely need updates (reducing approval overhead), while procedures should be easy to update quickly as tools change — mixing these levels together (e.g., putting exact software version numbers in a policy document) creates unnecessary bureaucratic friction every time something minor changes.</div>",

      "id": "g9",
      "title": "Third-party & vendor risk management",
      "concept": "\n  <p>An organization's security posture isn't just about its own systems — it also depends on every vendor/partner with access to its data or systems. <b>Third-party risk management</b> is the discipline of assessing and monitoring that external risk.</p>\n  <ul>\n    <li><b>Security questionnaires</b> — vendors fill out standardized assessments describing their own security practices before onboarding</li>\n    <li><b>Certifications as evidence</b> — accepting a vendor's SOC 2 or ISO 27001 certification as external validation rather than conducting a full independent audit yourself for every single vendor</li>\n    <li><b>Ongoing monitoring</b> — vendor risk isn't a one-time check at onboarding; a vendor's security posture (and the sensitivity of what they access) can change over time</li>\n  </ul>\n  <div class=\"callout warn\">This matters enormously in practice — a significant share of real-world breaches originate not from an organization's own systems being directly compromised, but through a trusted vendor or supply-chain partner with legitimate access being compromised first.</div>",

      "concept": "\n  <p>Compliance frameworks routinely require periodic independent validation — someone other than the organization itself confirming security controls actually work as claimed. Two common forms:</p>\n  <ul>\n    <li><b>Audits</b> — a systematic review of whether documented controls/policies are actually being followed in practice, often producing a formal report (like a SOC 2 report) used as evidence for customers/regulators</li>\n    <li><b>Penetration tests</b> — recall the pentest workflow from Web Security — an authorized attempt to actually exploit weaknesses, producing concrete evidence of what's genuinely exploitable rather than just checking whether a policy document exists on paper</li>\n  </ul>\n  <p>These serve different but complementary purposes: an audit checks \"are you doing what you say you do,\" while a pentest checks \"does what you're doing actually hold up against real attack techniques\" — an organization can pass an audit perfectly while still having exploitable technical vulnerabilities a pentest would catch.</p>",

      "id": "g12",
      "title": "SOC 2 reports explained",
      "concept": "\n  <p>Recall SOC 2 mentioned in the vendor risk management lesson — worth understanding its actual structure since it comes up constantly in B2B vendor conversations.</p>\n  <p>SOC 2 evaluates an organization against five possible \"Trust Services Criteria,\" though most reports focus at minimum on the first:</p>\n  <ul>\n    <li><b>Security</b> (always included) — protection against unauthorized access</li>\n    <li><b>Availability</b> — systems are operational and accessible as agreed/committed</li>\n    <li><b>Processing Integrity</b> — system processing is complete, accurate, and authorized</li>\n    <li><b>Confidentiality</b> — information designated confidential is genuinely protected as such</li>\n    <li><b>Privacy</b> — personal information is handled according to stated commitments</li>\n  </ul>\n  <p>A <b>Type I</b> report assesses controls at one specific point in time; a <b>Type II</b> report (generally considered stronger evidence) assesses whether those controls actually operated effectively over an extended period, typically 6-12 months.</p>",

      "id": "g13",

      "concept": "\n  <p><b>Change management</b> — a formal process for reviewing, approving, and documenting changes to production systems — might not sound like \"security\" at first glance, but it genuinely is one of the more effective, if unglamorous, controls in practice.</p>\n  <p>Why it matters for security specifically:</p>\n  <ul>\n    <li>Unreviewed, undocumented changes are a common source of accidental security misconfigurations (recall the public S3 bucket lesson — often the direct result of an unreviewed change)</li>\n    <li>A clear change log/history makes incident investigation dramatically faster — \"what changed right before things went wrong\" is often the very first, most productive investigative question</li>\n    <li>Requiring approval before production changes creates a natural checkpoint where a second, independent set of eyes might catch a risky change before it ships, rather than after</li>\n  </ul>",

      "id": "k1",
      "title": "The major cybersecurity career paths",
      "concept": "\n  <p>\"Cybersecurity\" isn't one job — it's a whole field of quite different roles, drawing on genuinely different skills and interests:</p>\n  <ul>\n    <li><b>Security Analyst / SOC Analyst</b> — monitors alerts and logs, investigates suspicious activity, often the common entry point role</li>\n    <li><b>Penetration Tester / Red Teamer</b> — authorized attacker, finds vulnerabilities before real attackers do</li>\n    <li><b>Security Engineer</b> — builds and maintains security tools/infrastructure (firewalls, IAM systems, secure pipelines)</li>\n    <li><b>Incident Responder</b> — the team that handles active breaches, from containment through recovery</li>\n    <li><b>Security Architect</b> — designs secure systems from the ground up, often a more senior/strategic role</li>\n    <li><b>GRC Analyst</b> — the compliance/risk side you just covered in the GRC track</li>\n    <li><b>Malware Analyst / Threat Researcher</b> — deep technical analysis of malicious code and threat actor behavior</li>\n  </ul>\n  <div class=\"callout\">Notice how directly this maps onto the tracks in this very academy — each track here roughly corresponds to a real specialization someone could build a career around.</div>",

      "concept": "\n  <p>A common way the field organizes offense/defense work:</p>\n  <ul>\n    <li><b>Red team</b> — plays the attacker, simulating real adversary techniques to test an organization's defenses</li>\n    <li><b>Blue team</b> — plays the defender, monitoring, detecting, and responding to those (simulated or real) attacks</li>\n    <li><b>Purple team</b> — not a separate team so much as a collaborative exercise philosophy: red and blue actively work together, sharing findings in real time, specifically to improve detection and response rather than red simply \"winning\" against an unaware blue team</li>\n  </ul>\n  <div class=\"callout\">Purple teaming reflects a broader shift in the field's thinking: a red team \"winning\" by exploiting something undetected is only valuable if that finding actually improves blue team detection afterward — otherwise it's just a one-time demonstration with no lasting defensive benefit.</div>",

      "concept": "\n  <p>Certifications aren't strictly required to break into the field, but they're a common, recognized way to demonstrate baseline knowledge, especially without prior professional experience:</p>\n  <ul>\n    <li><b>CompTIA Security+</b> — broad foundational certification, often considered the standard entry point, covering many of the concepts across this entire academy</li>\n    <li><b>CompTIA Network+</b> — networking fundamentals, complements Security+ well if networking concepts (like in this academy's Foundations/Network Security tracks) feel like the weaker area</li>\n    <li><b>(ISC)² SSCP</b> — another solid entry-to-mid-level option, slightly more operationally focused</li>\n  </ul>\n  <p>More advanced/specialized certifications (CISSP for broad senior expertise, OSCP for hands-on offensive skill, CISM for management-track GRC roles) generally come later, often requiring years of experience as a prerequisite.</p>\n  <div class=\"callout\">A genuinely useful framing: certifications tend to validate what you already know rather than teach it from scratch — pairing hands-on practice (like this academy's terminal missions) with certification study tends to work much better than certification study alone.</div>",

/* ---------- Profiles (local, device-only accounts) ---------- */
// A "profile" is just a named save slot. Optional passcode is a light deterrent
// against someone else on the same shared device casually opening your profile --
// it is hashed client-side, but this is NOT real security (no server, no encryption
// of the actual save data). Good for "siblings sharing a laptop," not for secrets.

let CURRENT_PROFILE = null; // {id, name, hasPasscode}
let STATE = null; // populated once a profile is chosen, via loadState()

function loadProfiles(){
  try{
    const raw = localStorage.getItem(PROFILES_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    console.warn("Profile list corrupted, resetting.", e);
    return [];
  }
}

function saveProfiles(list){
  localStorage.setItem(PROFILES_KEY, JSON.stringify(list));
}

// Simple, fast, non-cryptographic string hash (djb2). This is NOT secure hashing --
// it exists only to avoid storing a shared-device passcode in plain text, matching
// the "light deterrent" threat model stated above.
function simpleHash(str){
  let hash = 5381;
  for(let i=0;i<str.length;i++){
    hash = ((hash << 5) + hash) + str.charCodeAt(i);
    hash = hash & hash; // force 32-bit
  }
  return (hash >>> 0).toString(36);
}

function createProfile(name, passcode){
  const profiles = loadProfiles();
  const trimmed = name.trim();
  if(!trimmed) return { ok:false, error:"Enter a name." };
  if(profiles.some(p=>p.name.toLowerCase()===trimmed.toLowerCase())){
    return { ok:false, error:"That name is already in use on this device." };
  }
  const id = "p_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7);
  const profile = {
    id, name: trimmed,
    passcodeHash: passcode ? simpleHash(passcode) : null,
    createdAt: Date.now()
  };
  profiles.push(profile);
  saveProfiles(profiles);
  // seed an empty save for this profile immediately
  localStorage.setItem(SAVE_KEY_PREFIX + id, JSON.stringify(defaultState()));
  return { ok:true, profile };
}

function verifyProfilePasscode(profileId, passcode){
  const profiles = loadProfiles();
  const p = profiles.find(x=>x.id===profileId);
  if(!p) return false;
  if(!p.passcodeHash) return true; // no passcode set
  return simpleHash(passcode||"") === p.passcodeHash;
}

function deleteProfile(profileId){
  const profiles = loadProfiles().filter(p=>p.id!==profileId);
  saveProfiles(profiles);
  localStorage.removeItem(SAVE_KEY_PREFIX + profileId);
}

function selectProfile(profileId){
  const profiles = loadProfiles();
  const p = profiles.find(x=>x.id===profileId);
  if(!p) return false;
  CURRENT_PROFILE = { id:p.id, name:p.name, hasPasscode: !!p.passcodeHash };
  sessionStorage.setItem(SESSION_KEY, profileId);
  STATE = loadState();
  return true;
}

function signOutProfile(){
  CURRENT_PROFILE = null;
  STATE = null;
  sessionStorage.removeItem(SESSION_KEY);
}

function loadState(){
  if(!CURRENT_PROFILE) return defaultState();
  try{
    const raw = localStorage.getItem(SAVE_KEY_PREFIX + CURRENT_PROFILE.id);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){
    console.warn("Save corrupted, starting fresh.", e);
    return defaultState();
  }
}

function saveState(){
  if(!CURRENT_PROFILE) return;
  localStorage.setItem(SAVE_KEY_PREFIX + CURRENT_PROFILE.id, JSON.stringify(STATE));
}

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

function touchStreak(){
  const today = todayStr();
  if(STATE.lastPlayedDay === today) return;
  if(!STATE.lastPlayedDay){
    STATE.streak = 1;
  } else {
    const last = new Date(STATE.lastPlayedDay);
    const diff = Math.round((new Date(today) - last) / 86400000);
    if(diff === 1){
      STATE.streak += 1;
    } else if(diff > 1){
      if(STATE.consumables["perk-streakshield"] > 0 && diff === 2){
        STATE.consumables["perk-streakshield"] -= 1;
        toast(`🛡 Streak Shield used — streak preserved at ${STATE.streak} days.`);
      } else {
        STATE.streak = 1;
      }
    }
  }
  STATE.lastPlayedDay = today;
  saveState();
}

function hasPerk(id){ return STATE.purchasedPerks.includes(id); }
function hasTool(id){ return STATE.unlockedTools.includes(id); }

function xpMultiplier(){ return hasPerk("perk-xpboost") ? 1.15 : 1; }
function creditMultiplier(){ return hasPerk("perk-doublecredit") ? 1.15 : 1; }

function grantRewards(xp, credits, label){
  const gXp = Math.round(xp * xpMultiplier());
  const gCr = Math.round(credits * creditMultiplier());
  STATE.xp += gXp;
  STATE.credits += gCr;
  let leveled = false;
  while(STATE.xp >= xpForLevel(STATE.level)){
    STATE.xp -= xpForLevel(STATE.level);
    STATE.level += 1;
    leveled = true;
  }
  saveState();
  toast(`+${gXp} XP  +${gCr}₵  ${label||""}${leveled ? `  ·  LEVEL UP → ${STATE.level}` : ""}`);
  renderTopStats();
}

function toast(msg){
  const el = document.getElementById("rewardToast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> el.classList.remove("show"), 2600);
}

function levelTitle(level){
  const idx = Math.min(level-1, LEVEL_TITLES.length-1);
  return LEVEL_TITLES[Math.max(idx,0)];
}

/* =========================================================

   ========================================================= */
let ROUTE = { view:"dashboard", trackId:null, lessonId:null, shopTab:"tool" };

function goTo(route){

/* =========================================================

   ========================================================= */
function renderTopStats(){
  const el = document.getElementById("topStats");
  const need = xpForLevel(STATE.level);
  const pct = Math.min(100, Math.round((STATE.xp/need)*100));
  el.innerHTML = `
    <div class="stat-chip level">LV<b>&nbsp;${STATE.level}</b>&nbsp;<span class="mono-label">${levelTitle(STATE.level)}</span></div>
    <div class="stat-chip"><span class="mono-label">XP</span><div class="xp-track"><div class="xp-fill" style="width:${pct}%"></div></div><span class="mono-label">${STATE.xp}/${need}</span></div>
    <div class="stat-chip credits">₵<b>&nbsp;${STATE.credits}</b></div>
    <div class="stat-chip"><span class="streak-flame">🔥</span><b>${STATE.streak}</b><span class="mono-label">day streak</span></div>

  if(label && CURRENT_PROFILE) label.textContent = CURRENT_PROFILE.name;

function trackProgress(trackId){
  const lessons = LESSONS[trackId];
  const done = lessons.filter(l=>STATE.completedLessons[l.id]).length;
  return { done, total: lessons.length, pct: Math.round((done/lessons.length)*100) };
}

function trackUnlocked(track){
  return STATE.level >= track.unlockLevel;
}

function renderSideNav(){
  const el = document.getElementById("sideNav");
  let html = `<div class="nav-section-label">~/menu</div>`;
  html += navItem("dashboard","◇","Dashboard", ROUTE.view==="dashboard");
  html += navItem("terminal","▣","Terminal", ROUTE.view==="terminal");
  html += navItem("arcade","🎮","Arcade", ROUTE.view==="arcade");
  html += navItem("shop","$","Shop", ROUTE.view==="shop");
  html += navItem("character","☺","Character", ROUTE.view==="character");
  html += `<div class="nav-divider"></div><div class="nav-section-label">~/tracks</div>`;
  TRACKS.forEach(t=>{
    const unlocked = trackUnlocked(t);
    const prog = trackProgress(t.id);
    const active = ROUTE.view==="track" && ROUTE.trackId===t.id;
    html += `<div class="nav-item ${active?'active':''} ${unlocked?'':'locked'}"
                onclick="${unlocked ? `goTo({view:'track',trackId:'${t.id}'})` : ''}">
      <span class="glyph" style="color:${t.color}">${t.icon}</span>
      <span>${t.title}</span>
      <span class="badge-count">${unlocked ? prog.done+'/'+prog.total : '🔒'+t.unlockLevel}</span>
    </div>`;
  });
  el.innerHTML = html;
}

function navItem(view, glyph, label, active){
  return `<div class="nav-item ${active?'active':''}" onclick="goTo({view:'${view}'})">
    <span class="glyph">${glyph}</span><span>${label}</span>
  </div>`;
}

function updateCrumb(){
  const el = document.getElementById("pathCrumb");
  let path = "~/"+ROUTE.view;
  if(ROUTE.view==="track" && ROUTE.trackId) path += "/"+ROUTE.trackId;
  if(ROUTE.view==="lesson" && ROUTE.lessonId) path = `~/tracks/${ROUTE.trackId}/${ROUTE.lessonId}`;
  el.textContent = path;
}

/* =========================================================
   MAIN RENDER DISPATCH
   ========================================================= */
function renderAll(){
  renderTopStats();
  renderSideNav();
  updateCrumb();
  const pane = document.getElementById("mainPane");
  switch(ROUTE.view){
    case "dashboard": pane.innerHTML = renderDashboard(); break;
    case "track": pane.innerHTML = renderTrackView(ROUTE.trackId); break;
    case "lesson": pane.innerHTML = renderLessonView(ROUTE.trackId, ROUTE.lessonId); afterLessonRender(); break;
    case "shop": pane.innerHTML = renderShop(); break;
    case "character": pane.innerHTML = renderCharacter(); break;
    case "terminal": pane.innerHTML = renderTerminalView(); afterTerminalRender(); break;
    case "arcade": pane.innerHTML = renderArcade(); break;
    default: pane.innerHTML = renderDashboard();
  }
}

        </div>

        ` : `

          <button class="btn amber" onclick="goTo({view:'shop',shopTab:'tool'})">$ Go to shop</button>
        `}
      </div>
    </div>`;
  }

  return `
  <div class="win">
    <div class="win-title"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>${trackId}/${lessonId}.md</div>
    <div class="win-body">

      <div class="concept-block">${lesson.concept}</div>
    </div>
  </div>
  ${checkHtml}
  `;
}

function afterLessonRender(){ /* hook if needed later */ }

function shuffleIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function answerQuiz(displayPos){
  if(LESSON_UI_STATE.answered) return;
  LESSON_UI_STATE.answered = true;
  const lesson = LESSONS[ROUTE.trackId].find(l=>l.id===ROUTE.lessonId);
  const order = LESSON_UI_STATE.quizOrder; // order[displayPosition] = originalIndex
  const correctOrigIdx = lesson.check.correct;
  const correctDisplayPos = order.indexOf(correctOrigIdx);
  const btns = document.querySelectorAll("#quizOpts .quiz-opt");
  btns.forEach((b,i)=>{
    b.disabled = true;
    if(i===correctDisplayPos) b.classList.add("correct");
    else if(i===displayPos) b.classList.add("wrong");
  });
  const fb = document.getElementById("quizFeedback");
  const wasCorrect = displayPos===correctDisplayPos;
  fb.innerHTML = `<div class="feedback ${wasCorrect?'good':'bad'}">${wasCorrect?'✓ Correct.':'✗ Not quite.'} ${lesson.check.explain}</div>
    ${!STATE.completedLessons[lesson.id] ? `<button class="btn primary" onclick="completeLesson('${ROUTE.trackId}','${lesson.id}')">Claim reward →</button>`
      : `<button class="btn" onclick="goTo({view:'track',trackId:'${ROUTE.trackId}'})">Back to track</button>`}`;
}

function completeLesson(trackId, lessonId){
  const lesson = LESSONS[trackId].find(l=>l.id===lessonId);
  const already = !!STATE.completedLessons[lessonId];
  STATE.completedLessons[lessonId] = true;
  saveState();
  if(!already) grantRewards(lesson.xp, lesson.credits, `· ${lesson.title}`);
  touchStreak();
  goTo({view:'track', trackId});
}

function startMissionFromLesson(trackId, lessonId, missionId){
  STATE.activeMission = { missionId, trackId, lessonId };
  saveState();
  goTo({view:'terminal'});
}

function renderShopItem(it){
  let owned = false, ownedLabel = "";
  if(it.cat==="tool"){ owned = hasTool(it.id); }
  if(it.cat==="perk" && it.id!=="perk-streakshield"){ owned = hasPerk(it.id); }
  if(it.cat==="cosmetic"){ owned = STATE.theme === it.id.replace("cos-",""); }
  if(it.cat==="lore"){ owned = STATE.lore.includes(it.id); }
  const isConsumable = it.id==="hint-token" || it.id==="perk-streakshield";
  const count = isConsumable ? (STATE.consumables[it.id]||0) : 0;

  let actionHtml = "";
  if(owned && !isConsumable){
    actionHtml = it.cat==="cosmetic"
      ? `<button class="btn small primary" disabled>✓ Equipped</button>`
      : `<button class="btn small" disabled>✓ Owned</button>`;
  } else {
    const afford = STATE.credits >= it.price;
    actionHtml = `<button class="btn small ${afford?'amber':''}" ${afford?'':'disabled'} onclick="buyItem('${it.id}')">Buy</button>`;
  }
  if(it.cat==="cosmetic" && owned){
    // already equipped, nothing more
  } else if(it.cat==="cosmetic" && STATE.purchasedThemesIncludes){
    // not used, themes are simple one-time buys handled in buyItem
  }

  return `<div class="shop-item">
    <div class="si-top">
      <h3>${it.icon} ${it.name}</h3>
      ${isConsumable && count>0 ? `<span class="pill">x${count}</span>` : ""}
    </div>
    <p>${it.desc}</p>
    <div class="si-footer">
      <span class="si-price">₵ ${it.price}</span>
      ${actionHtml}
    </div>
  </div>`;
}

function buyItem(id){
  const it = SHOP_ITEMS.find(s=>s.id===id);
  if(STATE.credits < it.price){ toast("Not enough credits."); return; }

  if(it.cat==="hint-token" || id==="hint-token" || id==="perk-streakshield"){
    STATE.credits -= it.price;
    STATE.consumables[id] = (STATE.consumables[id]||0) + 1;
    toast(`Purchased ${it.name}. You now have ${STATE.consumables[id]}.`);
  } else if(it.cat==="tool"){
    if(hasTool(id)){ toast("Already owned."); return; }
    STATE.credits -= it.price;
    STATE.unlockedTools.push(id);
    toast(`Unlocked ${it.name}! New command available in Terminal.`);
  } else if(it.cat==="perk"){
    if(hasPerk(id)){ toast("Already owned."); return; }
    STATE.credits -= it.price;
    STATE.purchasedPerks.push(id);
    toast(`${it.name} equipped.`);
  } else if(it.cat==="cosmetic"){
    STATE.credits -= it.price;
    STATE.theme = id.replace("cos-","");
    toast(`Terminal theme set to ${it.name}.`);
  } else if(it.cat==="lore"){
    if(STATE.lore.includes(id)){ toast("Already unlocked."); return; }
    STATE.credits -= it.price;
    STATE.lore.push(id);
    toast(`${it.name} unlocked — read it in the Terminal archive.`);
  }
  saveState();
  renderTopStats();
  goTo({view:'shop', shopTab: ROUTE.shopTab});
}

function exportSave(){
  const blob = new Blob([JSON.stringify(STATE,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "cybertrainer_save.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importSave(evt){
  const f = evt.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      STATE = Object.assign(defaultState(), parsed);
      saveState();
      toast("Save imported successfully.");
      renderAll();
    }catch(e){
      toast("Import failed — invalid save file.");
    }
  };
  reader.readAsText(f);
}

function resetSave(){
  if(!confirm("This will permanently erase all progress. Are you sure?")) return;
  STATE = defaultState();
  saveState();
  renderAll();
  toast("Progress reset.");
}


/* ===== terminal.js ===== */
/* =========================================================
   TERMINAL ENGINE
   ========================================================= */

let TERM = {
  cwd: ["home","trainee"],
  history: [],
  histIdx: -1,
  vfs: null, // deep copy of VFS_ROOT, built on init
  missionState: {} // per-mission runtime flags, e.g. { nmapRun:true, sqlmapRun:true }
};

function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }

function initVFS(){
  TERM.vfs = deepCopy(VFS_ROOT);
  // inject archive lore files based on what's unlocked
  const archiveDir = resolvePath(["archive"], TERM.vfs);
  STATE.lore.forEach(loreId=>{
    const item = SHOP_ITEMS.find(s=>s.id===loreId);
    const fname = loreId.replace("lore-","") + ".txt";
    if(LORE_ARCHIVE[fname] && archiveDir && !archiveDir[fname]){
      archiveDir[fname] = file(LORE_ARCHIVE[fname]);
    }
  });
  // inject mission-specific files if a mission is active
  // (supports multiple files per mission via "missionId" and "missionId-2", "missionId-3" etc keys)
  if(STATE.activeMission){
    const mid = STATE.activeMission.missionId;
    Object.keys(MISSION_FILES).forEach(key=>{
      if(key === mid || key.startsWith(mid + "-")){
        const mf = MISSION_FILES[key];
        const d = resolvePath(mf.path, TERM.vfs);
        if(d && !d[mf.name]) d[mf.name] = file(mf.content);
      }
    });
  }
}

function resolvePath(pathArr, root){
  let node = root || TERM.vfs;
  for(const seg of pathArr){
    if(!node || !node.__dir) return null;
    node = node[seg];
  }
  return node;
}

function normalizePath(inputPath){
  // returns absolute path array from cwd + input (supports ., .., /, ~)
  let parts;
  if(inputPath.startsWith("/")){
    parts = inputPath.split("/").filter(Boolean);
  } else if(inputPath.startsWith("~")){
    parts = ["home","trainee", ...inputPath.slice(1).split("/").filter(Boolean)];
  } else {
    parts = [...TERM.cwd, ...inputPath.split("/").filter(Boolean)];
  }
  const out = [];
  for(const p of parts){
    if(p === "." ) continue;
    if(p === ".."){ out.pop(); continue; }
    out.push(p);
  }
  return out;
}

function pathString(pathArr){
  if(pathArr.length===0) return "/";
  if(pathArr[0]==="home" && pathArr[1]==="trainee"){
    const rest = pathArr.slice(2).join("/");
    return "~" + (rest ? "/"+rest : "");
  }
  return "/" + pathArr.join("/");
}

function termPrint(text, cls){
  const screen = document.getElementById("termScreen");
  if(!screen) return;
  const line = document.createElement("div");
  line.className = "term-line " + (cls||"out");
  line.textContent = text;
  screen.appendChild(line);
  screen.scrollTop = screen.scrollHeight;
}

function termPrintHtml(html, cls){
  const screen = document.getElementById("termScreen");
  if(!screen) return;
  const line = document.createElement("div");
  line.className = "term-line " + (cls||"out");
  line.innerHTML = html;
  screen.appendChild(line);
  screen.scrollTop = screen.scrollHeight;
}

function termPromptHtml(){
  return `<span class="tprompt">trainee@academy</span>:<span class="tpath">${pathString(TERM.cwd)}</span>$ `;
}

/* ---------- command execution ---------- */
function execCommand(raw){
  const cmdLine = raw.trim();
  const screen = document.getElementById("termScreen");
  // echo the command line
  termPrintHtml(termPromptHtml() + escapeHtml(cmdLine), "cmd");
  if(cmdLine === ""){ return; }

  TERM.history.push(cmdLine);
  TERM.histIdx = TERM.history.length;

  const [cmd, ...args] = cmdLine.split(/\s+/);

  switch(cmd){
    case "help": cmdHelp(); break;
    case "clear": document.getElementById("termScreen").innerHTML = ""; break;
    case "pwd": termPrint(pathString(TERM.cwd)); break;
    case "whoami": termPrint("trainee"); break;
    case "ls": cmdLs(args); break;
    case "cd": cmdCd(args); break;
    case "cat": cmdCat(args); break;
    case "grep": cmdGrep(args); break;
    case "find": cmdFind(args); break;
    case "history": TERM.history.forEach((h,i)=>termPrint(`${i+1}  ${h}`)); break;
    case "man": cmdMan(args); break;
    case "mission": cmdMission(); break;
    case "nmap": cmdNmap(args); break;
    case "connect": cmdConnect(args); break;
    case "sqlmap": cmdSqlmap(args); break;
    case "submit": cmdSubmit(args); break;
    case "hashcrack": cmdHashcrack(args); break;
    case "nc": cmdNc(args); break;
    case "hint": cmdHint(); break;
    default:
      termPrint(`command not found: ${cmd}  (try 'help')`, "err");
  }
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ---------- individual commands ---------- */
function cmdHelp(){
  const base = [
    "Available commands:",
    "  ls [path]        list directory contents",
    "  cd <path>        change directory",
    "  cat <file>       print file contents",
    "  grep <term> <f>  search for a term inside a file",
    "  find <name>      search filesystem for a filename",
    "  pwd              print working directory",
    "  whoami           print current user",
    "  history          show command history",
    "  man <cmd>        show manual page for a command",
    "  mission          show current mission objective",
    "  hint             spend a Decrypt Token for a hint (if you have one)",
    "  clear            clear the screen"
  ];
  const unlocked = [];
  if(hasTool("tool-nmap")) unlocked.push("  nmap <ip>        scan a host for open ports");
  if(hasTool("tool-sqlmap")) unlocked.push("  sqlmap <file>    probe a login script for injectable fields");
  if(hasTool("tool-hashcrack")) unlocked.push("  hashcrack <hash> dictionary-attack a captured hash");
  if(hasTool("tool-netcat")) unlocked.push("  nc <ip> <port>   open a raw connection to a host/port");
  if(STATE.activeMission){
    unlocked.push("  connect <port>   connect to a service on the current nmap target");
    unlocked.push("  submit <text>    submit a payload/answer for the active mission");
  }
  base.forEach(l=>termPrint(l));
  if(unlocked.length){ termPrint(""); termPrint("Unlocked tools:"); unlocked.forEach(l=>termPrint(l,"sys")); }
}

function cmdLs(args){
  const target = args[0] ? normalizePath(args[0]) : TERM.cwd;
  const node = resolvePath(target);
  if(!node || !node.__dir){ termPrint(`ls: cannot access '${args[0]||''}': No such directory`, "err"); return; }
  const keys = Object.keys(node).filter(k=>k!=="__dir");
  if(keys.length===0){ termPrint("(empty)"); return; }
  const line = keys.map(k=> node[k].__dir ? k+"/" : k).join("   ");
  termPrint(line);
}

function cmdCd(args){
  if(!args[0]){ TERM.cwd = ["home","trainee"]; renderTermPromptPath(); return; }
  const target = normalizePath(args[0]);
  const node = resolvePath(target);
  if(!node || !node.__dir){ termPrint(`cd: no such directory: ${args[0]}`, "err"); return; }
  TERM.cwd = target;
  renderTermPromptPath();
}

function cmdCat(args){
  if(!args[0]){ termPrint("cat: missing file operand", "err"); return; }
  const target = normalizePath(args[0]);
  const node = resolvePath(target);
  if(!node){ termPrint(`cat: ${args[0]}: No such file`, "err"); return; }
  if(node.__dir){ termPrint(`cat: ${args[0]}: Is a directory`, "err"); return; }
  node.content.split("\n").forEach(l=>termPrint(l));
  checkFlagFound(node.content);
  checkMissionSpecificRead(target);
}

function cmdGrep(args){
  if(args.length < 2){ termPrint("usage: grep <term> <file>", "err"); return; }
  const term = args[0];
  const target = normalizePath(args[1]);
  const node = resolvePath(target);
  if(!node || node.__dir){ termPrint(`grep: ${args[1]}: No such file`, "err"); return; }
  const matches = node.content.split("\n").filter(l=>l.toLowerCase().includes(term.toLowerCase()));
  if(matches.length===0){ termPrint("(no matches)"); return; }
  matches.forEach(m=>termPrint(m, "sys"));
  checkMissionSpecificRead(target, term);
}

function cmdFind(args){
  if(!args[0]){ termPrint("usage: find <name>", "err"); return; }
  const results = [];
  (function walk(node, path){
    for(const k of Object.keys(node)){
      if(k==="__dir") continue;
      const child = node[k];
      const p = [...path, k];
      if(k.toLowerCase().includes(args[0].toLowerCase())) results.push(pathString(p) + (child.__dir?"/":""));
      if(child.__dir) walk(child, p);
    }
  })(TERM.vfs, []);
  if(results.length===0){ termPrint("(no matches found)"); return; }
  results.forEach(r=>termPrint(r));
}

function cmdMan(args){
  const pages = {
    ls:"ls - list directory contents\n  usage: ls [path]\n  Lists files/directories. Directories are shown with a trailing /.",
    cd:"cd - change directory\n  usage: cd <path>\n  Supports absolute (/etc), relative (logs/), home (~), and .. for parent.",
    cat:"cat - print file contents\n  usage: cat <file>\n  Prints the full contents of a text file to the screen.",
    grep:"grep - search text\n  usage: grep <term> <file>\n  Prints every line in <file> containing <term> (case-insensitive).",
    nmap:"nmap - network scanner (simulated)\n  usage: nmap <ip>\n  Reports open/closed/filtered ports and the service on each.",
    sqlmap:"sqlmap - SQL injection prober (simulated)\n  usage: sqlmap <file>\n  Analyzes a server-side script for injectable input fields.",
    hashcrack:"hashcrack - dictionary attack tool (simulated)\n  usage: hashcrack <hash>\n  Attempts to match a hash against a small training dictionary."
  };
  const p = args[0];
  if(!p || !pages[p]){ termPrint(`No manual entry for ${p||'(none given)'}`, "err"); return; }
  pages[p].split("\n").forEach(l=>termPrint(l));
}

/* ---------- nmap / connect (netsec mission) ---------- */
function cmdNmap(args){
  if(!hasTool("tool-nmap")){ termPrint("nmap: command not found (unlock 'nmap-sim' in the Shop)", "err"); return; }
  const ip = args[0];
  const target = NMAP_TARGETS[ip];
  if(!target){ termPrint(`nmap: no route to host ${ip||''}`, "err"); return; }
  termPrint(`Starting Nmap scan against ${ip} (${target.hostname})`, "sys");
  termPrint("PORT      STATE      SERVICE");
  target.ports.forEach(p=>termPrint(`${(p.port+"/tcp").padEnd(10)}${p.state.padEnd(11)}${p.service}`));
  TERM.missionState.nmapRun = true;
  TERM.missionState.nmapTarget = ip;
}

function cmdConnect(args){
  if(!STATE.activeMission || STATE.activeMission.missionId !== "nmap-read"){
    termPrint("connect: no applicable mission active", "err"); return;
  }
  if(!TERM.missionState.nmapRun){ termPrint("connect: run nmap against the target first", "err"); return; }
  const port = parseInt(args[0],10);
  const target = NMAP_TARGETS[TERM.missionState.nmapTarget];
  const portInfo = target.ports.find(p=>p.port===port);
  if(!portInfo){ termPrint(`connect: no response from port ${args[0]}`, "err"); return; }
  if(portInfo.service==="http" || portInfo.service==="https"){
    termPrint(`Connected to ${TERM.missionState.nmapTarget}:${port} (${portInfo.service}) — web service confirmed.`, "sys");
    completeMission("nmap-read");
  } else {
    termPrint(`Connected to port ${port} (${portInfo.service}) — not the web service. Try again.`, "err");
  }
}

/* ---------- sqlmap / submit (websec mission) ---------- */
function cmdSqlmap(args){
  if(!hasTool("tool-sqlmap")){ termPrint("sqlmap: command not found (unlock 'sqlmap-sim' in the Shop)", "err"); return; }
  if(!args[0]){ termPrint("usage: sqlmap <file>", "err"); return; }
  const target = normalizePath(args[0]);
  const node = resolvePath(target);
  if(!node || node.__dir){ termPrint(`sqlmap: ${args[0]}: No such file`, "err"); return; }
  termPrint(`sqlmap-sim v1 -- analyzing ${args[0]}`, "sys");
  termPrint("[*] testing parameter 'username' ... appears injectable (string context, unescaped)");
  termPrint("[*] testing parameter 'password' ... appears injectable (string context, unescaped)");
  termPrint("[+] Vulnerability confirmed: classic auth bypass via OR-based tautology likely works.");
  termPrint("Use `submit <payload>` with your bypass string once ready.", "sys");
  TERM.missionState.sqlmapRun = true;
}

function cmdSubmit(args){
  if(!STATE.activeMission){ termPrint("submit: no active mission", "err"); return; }
  const payload = args.join(" ");
  const mid = STATE.activeMission.missionId;

  if(mid === "sqlmap-lite"){
    if(!TERM.missionState.sqlmapRun){ termPrint("submit: run sqlmap on the login script first", "err"); return; }
    const looksLikeBypass = /or/i.test(payload) && /=/.test(payload);
    if(looksLikeBypass){
      termPrint(`Payload accepted: ${payload}`, "sys");
      termPrint("Login bypassed — the query's WHERE clause was always true. Nice work.", "sys");
      completeMission("sqlmap-lite");
    } else {
      termPrint("Login rejected. Hint: you need a tautology like ' OR '1'='1", "err");
    }
    return;
  }

  // generalized answer-checking missions (NEW_MISSIONS with answerType)
  const missionDef = MISSIONS[mid];
  if(missionDef && missionDef.answerType){
    const ok = checkMissionAnswer(missionDef, payload);
    if(ok){
      termPrint(`Answer accepted: ${payload}`, "sys");
      completeMission(mid);
    } else {
      termPrint(`Not quite. Try again, or type 'hint' if you have a Decrypt Token.`, "err");
    }
    return;
  }

  termPrint("submit: nothing to submit for this mission", "err");
}

function checkMissionAnswer(missionDef, payload){
  const norm = s => s.trim().toLowerCase().replace(/\s+/g," ");
  switch(missionDef.answerType){
    case "text":
      return norm(payload) === norm(missionDef.answer);
    case "text_loose":
      // allow the answer to appear anywhere in the submission, case-insensitive
      return norm(payload).includes(norm(missionDef.answer));
    case "contains":
      return missionDef.answer.every(part => payload.toLowerCase().includes(part.toLowerCase()));
    case "regex":
      return new RegExp(missionDef.answer, "i").test(payload);
    default:
      return false;
  }
}

/* ---------- hashcrack (crypto mission) ---------- */
function cmdHashcrack(args){
  if(!hasTool("tool-hashcrack")){ termPrint("hashcrack: command not found (unlock 'hashcrack-sim' in the Shop)", "err"); return; }
  const hash = args[0];
  if(!hash){ termPrint("usage: hashcrack <hash>", "err"); return; }
  termPrint(`hashcrack-sim v1 -- loading dictionary (4,000 common passwords)...`, "sys");
  const plain = HASH_DICTIONARY[hash.toLowerCase()];
  if(plain){
    termPrint(`[+] MATCH FOUND: ${hash} => "${plain}"`, "sys");
    if(STATE.activeMission && STATE.activeMission.missionId === "hash-crack") completeMission("hash-crack");
  } else {
    termPrint("[-] No match in training dictionary. Double-check the hash value.", "err");
  }
}

/* ---------- nc (generic recon flavor command) ---------- */
function cmdNc(args){
  if(!hasTool("tool-netcat")){ termPrint("nc: command not found (unlock 'netcat-sim' in the Shop)", "err"); return; }
  const [ip, port] = args;
  if(!ip || !port){ termPrint("usage: nc <ip> <port>", "err"); return; }
  const target = NMAP_TARGETS[ip];
  if(!target){ termPrint(`nc: no route to host ${ip}`, "err"); return; }
  const p = target.ports.find(x=>x.port===parseInt(port,10));
  if(p && p.state==="open"){
    termPrint(`Connection to ${ip} ${port} port [tcp/${p.service}] succeeded!`, "sys");
  } else {
    termPrint(`nc: connect to ${ip} port ${port} failed: Connection refused`, "err");
