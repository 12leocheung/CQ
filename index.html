}

/* ---------- mission completion / flags ---------- */
function checkFlagFound(content){
  const m = content.match(/FLAG\{[^}]+\}/);
  if(m && STATE.activeMission && STATE.activeMission.missionId === "fs-recon"){
    termPrint(`\n[FLAG CAPTURED]: ${m[0]}`, "sys");
    completeMission("fs-recon");
  }
}

function checkMissionSpecificRead(pathArr, grepTerm){
  if(!STATE.activeMission) return;
  const mid = STATE.activeMission.missionId;
  const pstr = pathString(pathArr);
  if(mid === "phish-hunt" && pstr.includes("email.eml")){
    if(grepTerm && /from|return-path/i.test(grepTerm)){
      termPrint("Notice the sender domain 'paypa1-security.com' — a '1' replacing an 'l'. Classic lookalike domain phishing.", "sys");
      completeMission("phish-hunt");
    }
  }
  if(mid === "hash-crack" && pstr.includes("hash.txt")){
    termPrint("(Tip: copy the hash value above and run `hashcrack <hash>`)", "sys");
  }
}

function completeMission(missionId){
  if(STATE.missionProgress[missionId] && STATE.missionProgress[missionId].done) return; // already done
  STATE.missionProgress[missionId] = { done:true };
  const mission = STATE.activeMission;
  saveState();
  termPrint("");
  termPrint(`✓ MISSION COMPLETE: ${MISSIONS[missionId].title}`, "sys");
  if(mission && mission.lessonId){
    const lesson = LESSONS[mission.trackId].find(l=>l.id===mission.lessonId);
    const already = !!STATE.completedLessons[lesson.id];
    STATE.completedLessons[lesson.id] = true;
    STATE.activeMission = null;
    saveState();
    if(!already) grantRewards(lesson.xp, lesson.credits, `· ${lesson.title}`);
    touchStreak();
    termPrint(`Returning to ${mission.trackId} track shortly...`, "sys");
    setTimeout(()=>{ goTo({view:'track', trackId: mission.trackId}); }, 1400);
  }
}

    termPrint(`Active mission: ${mission.title}`, "sys");
    termPrint(mission.brief);
  }
  renderTermPromptPath();

  const input = document.getElementById("term-input");
  input.focus();
  input.addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){
      const val = input.value;
      input.value = "";
      execCommand(val);
      renderTermPromptPath();
    } else if(e.key === "ArrowUp"){
      e.preventDefault();
      if(TERM.histIdx > 0){ TERM.histIdx--; input.value = TERM.history[TERM.histIdx] || ""; }
    } else if(e.key === "ArrowDown"){
      e.preventDefault();
      if(TERM.histIdx < TERM.history.length-1){ TERM.histIdx++; input.value = TERM.history[TERM.histIdx] || ""; }
      else { TERM.histIdx = TERM.history.length; input.value = ""; }
    }
  });
  document.getElementById("termScreen").addEventListener("click", ()=> input.focus());
}

function caesarShift(str, shift){
  return str.split("").map(c=>{
    if(c >= "A" && c <= "Z"){
      return String.fromCharCode(((c.charCodeAt(0)-65+shift)%26+26)%26+65);
    }
    return c;
  }).join("");
}

function launchGame(gameId){
  GAME = {
    active:gameId, score:0, streak:0, timeLeft:60,
    timerHandle:null, currentQ:null, answered:false,
    qIndex:0, pool: buildPool(gameId), totalAnswered:0, correctAnswered:0
  };
  renderGameScreen();
  nextQuestion();
  GAME.timerHandle = setInterval(gameTick, 1000);
}

function buildPool(gameId){
  function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  switch(gameId){
    case "portmatch": return shuffle(PORT_MATCH_DATA);
    case "logtriage": return shuffle(LOG_TRIAGE_DATA);
    case "phishhunt": return shuffle(PHISH_DATA);
    case "cipherrun": return shuffle(CIPHER_WORDS);
    case "statuscode": return shuffle(STATUS_CODE_DATA);
    case "vulnspot": return shuffle(VULN_SPOTTER_DATA);
    default: return [];
  }
}

function gameTick(){
  GAME.timeLeft -= 1;
  const timerEl = document.getElementById("gameTimer");
  if(timerEl) timerEl.textContent = GAME.timeLeft + "s";
  if(GAME.timeLeft <= 0){
    clearInterval(GAME.timerHandle);
    endGame();
  }
}

function nextQuestion(){
  if(GAME.pool.length === 0){ GAME.pool = buildPool(GAME.active); }
  GAME.currentQ = GAME.pool[GAME.qIndex % GAME.pool.length];
  GAME.qIndex++;
  GAME.answered = false;
  renderQuestion();
}

function renderQuestion(){
  const area = document.getElementById("gameQuestionArea");
  if(!area) return;
  const q = GAME.currentQ;
  let html = "";

  if(GAME.active === "portmatch"){
    const askService = Math.random() < 0.5;
    GAME._askService = askService;
    const wrongPool = PORT_MATCH_DATA.filter(x=>x.port!==q.port);
    const distractors = shuffleN(wrongPool, 3);
    if(askService){
      const opts = shuffleN([q, ...distractors]);
      html = `<div class="quiz-q">What service typically runs on port <b style="color:var(--cyan)">${q.port}</b>?</div>
        <div class="quiz-opts">${opts.map((o,i)=>`<button class="quiz-opt" onclick="answerGame('${escapeHtml(o.service)}')">${i+1}) ${o.service}</button>`).join("")}</div>`;
    } else {
      const opts = shuffleN([q, ...distractors]);
      html = `<div class="quiz-q">Which port does <b style="color:var(--cyan)">${q.service}</b> typically use?</div>
        <div class="quiz-opts">${opts.map((o,i)=>`<button class="quiz-opt" onclick="answerGame('${o.port}')">${i+1}) ${o.port}</button>`).join("")}</div>`;
    }
  }

  else if(GAME.active === "logtriage"){
    html = `<div class="quiz-q">Classify this log line:</div>
      <pre style="background:var(--panel-2);border:1px solid var(--line-soft);border-radius:4px;padding:12px;font-size:12.5px;color:var(--text-dim);margin-bottom:14px;">${escapeHtml(q.line)}</pre>
      <div class="quiz-opts">
        <button class="quiz-opt" onclick="answerGame('normal')">1) ✓ NORMAL</button>
        <button class="quiz-opt" onclick="answerGame('suspicious')">2) ⚠ SUSPICIOUS</button>
      </div>`;
  }

  else if(GAME.active === "phishhunt"){
    html = `<div class="quiz-q">Phishing or legitimate?</div>
      <div style="background:var(--panel-2);border:1px solid var(--line-soft);border-radius:4px;padding:12px;margin-bottom:14px;font-size:13px;">
        <div><span class="mono-label">From:</span> ${escapeHtml(q.from)}</div>
        <div><span class="mono-label">Subject:</span> ${escapeHtml(q.subject)}</div>
        <div style="margin-top:6px;color:var(--text-dim);">${escapeHtml(q.snippet)}</div>
      </div>
      <div class="quiz-opts">
        <button class="quiz-opt" onclick="answerGame('phish')">1) 🎣 PHISHING</button>
        <button class="quiz-opt" onclick="answerGame('legit')">2) ✓ LEGITIMATE</button>
      </div>`;
  }

  else if(GAME.active === "cipherrun"){
    const shift = 1 + Math.floor(Math.random()*12);
    GAME._shift = shift;
    const encoded = caesarShift(q, shift);
    html = `<div class="quiz-q">Decode this Caesar cipher (shift = ${shift}):</div>
      <div style="font-size:24px;letter-spacing:3px;color:var(--cyan);margin:16px 0;text-align:center;">${encoded}</div>
      <div style="display:flex;gap:8px;">
        <input id="cipherInput" autocomplete="off" spellcheck="false" placeholder="type the decoded word..."
          style="flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:4px;font-family:var(--mono);font-size:14px;"
          onkeydown="if(event.key==='Enter'){ answerGame(document.getElementById('cipherInput').value); }">
        <button class="btn primary" onclick="answerGame(document.getElementById('cipherInput').value)">Submit</button>
      </div>`;
  }

  else if(GAME.active === "statuscode"){
    const askMeaning = Math.random() < 0.5;
    const wrongPool = STATUS_CODE_DATA.filter(x=>x.code!==q.code);
    const distractors = shuffleN(wrongPool, 3);
    if(askMeaning){
      const opts = shuffleN([q, ...distractors]);
      html = `<div class="quiz-q">What does HTTP status <b style="color:var(--amber)">${q.code}</b> mean?</div>
        <div class="quiz-opts">${opts.map((o,i)=>`<button class="quiz-opt" onclick="answerGame('${escapeHtml(o.meaning)}')">${i+1}) ${o.meaning}</button>`).join("")}</div>`;
    } else {
      const opts = shuffleN([q, ...distractors]);
      html = `<div class="quiz-q">Which status code means: <b style="color:var(--amber)">"${q.meaning}"</b>?</div>
        <div class="quiz-opts">${opts.map((o,i)=>`<button class="quiz-opt" onclick="answerGame('${o.code}')">${i+1}) ${o.code}</button>`).join("")}</div>`;
    }
  }

  else if(GAME.active === "vulnspot"){
    const opts = shuffleN(q.options);
    html = `<div class="quiz-q">Identify the vulnerability class:</div>
      <pre style="background:var(--panel-2);border:1px solid var(--line-soft);border-radius:4px;padding:12px;font-size:12.5px;color:var(--cyan);margin-bottom:14px;">${escapeHtml(q.snippet)}</pre>
      <div class="quiz-opts">${opts.map((o,i)=>`<button class="quiz-opt" onclick="answerGame('${escapeHtml(o)}')">${i+1}) ${o}</button>`).join("")}</div>`;

  area.innerHTML = html;
  const cInput = document.getElementById("cipherInput");

function shuffleN(arr, n){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return n ? a.slice(0,n) : a;
}

function answerGame(givenAnswer){
  if(GAME.answered || GAME.timeLeft <= 0) return;
  GAME.answered = true;
  GAME.totalAnswered++;

  let correct = false;
  const q = GAME.currentQ;
  const norm = s => String(s).trim().toLowerCase();

  if(GAME.active === "portmatch"){
    correct = GAME._askService ? norm(givenAnswer)===norm(q.service) : norm(givenAnswer)===norm(q.port);
  } else if(GAME.active === "logtriage"){
    correct = norm(givenAnswer) === norm(q.verdict);
  } else if(GAME.active === "phishhunt"){
    correct = norm(givenAnswer) === norm(q.verdict);
  } else if(GAME.active === "cipherrun"){
    correct = norm(givenAnswer) === norm(q);
  } else if(GAME.active === "statuscode"){
    correct = norm(givenAnswer) === norm(q.code) || norm(givenAnswer) === norm(q.meaning);
  } else if(GAME.active === "vulnspot"){
    correct = norm(givenAnswer) === norm(q.answer);
  }

  if(correct){
    GAME.streak++;
    GAME.correctAnswered++;
    const bonus = Math.min(GAME.streak, 5);
    GAME.score += 10 + bonus;
    flashFeedback(true);
  } else {
    GAME.streak = 0;
    flashFeedback(false);
  }
  updateGameHud();
  setTimeout(()=>{ if(GAME.timeLeft > 0) nextQuestion(); }, 450);
}

function flashFeedback(good){
  const flash = document.createElement("div");
  flash.style.cssText = `position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:150;
    background:${good ? 'rgba(79,240,138,0.06)' : 'rgba(255,107,107,0.06)'};transition:opacity .4s;`;
  document.body.appendChild(flash);
  setTimeout(()=>{ flash.style.opacity="0"; setTimeout(()=>flash.remove(),400); }, 80);
}

function endGame(){
  const gameId = GAME.active;
  const meta = GAMES_META.find(g=>g.id===gameId);
  const isNewBest = setHighScore(gameId, GAME.score);
  const accuracy = GAME.totalAnswered > 0 ? Math.round((GAME.correctAnswered/GAME.totalAnswered)*100) : 0;

  let xp = 10, credits = 4;
  if(GAME.score >= 50){ xp = 40; credits = 18; }
  else if(GAME.score >= 30){ xp = 28; credits = 12; }
  else if(GAME.score >= 15){ xp = 18; credits = 8; }

  grantRewards(xp, credits, `· ${meta.title} round`);
  touchStreak();

  const pane = document.getElementById("mainPane");
  pane.innerHTML = `
  <div class="win">
    <div class="win-title"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>arcade/${gameId} — RESULTS</div>
    <div class="win-body">
      <h1 style="color:${meta.color}">${meta.icon} Round Complete</h1>
      <div class="char-grid">
        <div class="stat-block">
          <div class="stat-row"><span>Final score</span><span class="v" style="color:var(--green)">${GAME.score}</span></div>
          <div class="stat-row"><span>Correct answers</span><span class="v">${GAME.correctAnswered} / ${GAME.totalAnswered}</span></div>
          <div class="stat-row"><span>Accuracy</span><span class="v">${accuracy}%</span></div>
          <div class="stat-row"><span>High score</span><span class="v" style="color:var(--amber)">${getHighScore(gameId)} ${isNewBest ? '🏆 NEW BEST!' : ''}</span></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">
        <button class="btn primary" onclick="launchGame('${gameId}')">↻ Play again</button>
        <button class="btn" onclick="goTo({view:'arcade'})">← Back to Arcade</button>
      </div>
    </div>
  </div>`;
}


/* ===== login.js ===== */
/* =========================================================
   LOGIN / PROFILE SELECTION SCREEN
   Local, device-only profiles -- no server, no real auth.
   ========================================================= */

let LOGIN_UI = { mode:"list", pendingProfileId:null, error:null };

function renderLoginScreen(){
  const el = document.getElementById("login");
  el.style.display = "flex";
  const profiles = loadProfiles();

  if(LOGIN_UI.mode === "create"){
    el.innerHTML = loginCreateHtml();
  } else if(LOGIN_UI.mode === "passcode"){
    const p = profiles.find(x=>x.id===LOGIN_UI.pendingProfileId);
    el.innerHTML = loginPasscodeHtml(p);
  } else {
    el.innerHTML = loginListHtml(profiles);
  }

  const firstInput = el.querySelector("input");
  if(firstInput) firstInput.focus();
}

function loginListHtml(profiles){
  return `
  <div class="login-card">
    <div class="login-brand">academy<span class="dim">@</span>root<span class="dim">:</span> <span style="color:var(--text-dim)">~/login</span></div>
    <h1 class="login-title">Select a profile</h1>
    <p class="login-sub">Profiles are saved locally on this device/browser only — nothing syncs elsewhere.</p>
    ${profiles.length === 0 ? `
      <div class="callout" style="margin:14px 0;">No profiles yet on this device. Create one to start training.</div>
    ` : `
      <div class="profile-list">
        ${profiles.map(p=>`
          <div class="profile-row" onclick="chooseProfile('${p.id}')">
            <span class="profile-glyph">${p.passcodeHash ? '🔒' : '◇'}</span>
            <span class="profile-name">${escapeHtml(p.name)}</span>
            <button class="btn small profile-del" title="Delete profile" onclick="event.stopPropagation(); confirmDeleteProfile('${p.id}','${escapeHtml(p.name)}')">✕</button>
          </div>
        `).join("")}
      </div>
    `}
    <button class="btn primary" style="width:100%;margin-top:14px;" onclick="LOGIN_UI={mode:'create',pendingProfileId:null,error:null}; renderLoginScreen();">+ New profile</button>
  </div>`;
}

function loginCreateHtml(){
  return `
  <div class="login-card">
    <div class="login-brand">academy<span class="dim">@</span>root<span class="dim">:</span> <span style="color:var(--text-dim)">~/login/new</span></div>
    <h1 class="login-title">Create a profile</h1>
    <p class="login-sub">A passcode is optional — it just keeps others on this device out of your save, it isn't real security.</p>
    ${LOGIN_UI.error ? `<div class="feedback bad">${escapeHtml(LOGIN_UI.error)}</div>` : ""}
    <label class="login-label">Name</label>
    <input id="newProfileName" class="login-input" autocomplete="off" spellcheck="false" maxlength="24" placeholder="e.g. Leo"
      onkeydown="if(event.key==='Enter'){document.getElementById('newProfilePass').focus();}">
    <label class="login-label">Passcode (optional)</label>
    <input id="newProfilePass" class="login-input" type="password" autocomplete="off" maxlength="24" placeholder="leave blank for none"
      onkeydown="if(event.key==='Enter'){submitCreateProfile();}">
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="btn primary" style="flex:1;" onclick="submitCreateProfile()">Create &amp; enter</button>
      <button class="btn" onclick="LOGIN_UI={mode:'list',pendingProfileId:null,error:null}; renderLoginScreen();">Cancel</button>
    </div>
  </div>`;
}

function loginPasscodeHtml(profile){
  return `
  <div class="login-card">
    <div class="login-brand">academy<span class="dim">@</span>root<span class="dim">:</span> <span style="color:var(--text-dim)">~/login/${escapeHtml(profile.name)}</span></div>
    <h1 class="login-title">🔒 ${escapeHtml(profile.name)}</h1>
    <p class="login-sub">Enter this profile's passcode.</p>
    ${LOGIN_UI.error ? `<div class="feedback bad">${escapeHtml(LOGIN_UI.error)}</div>` : ""}
    <input id="passcodeInput" class="login-input" type="password" autocomplete="off" maxlength="24" placeholder="passcode"
      onkeydown="if(event.key==='Enter'){submitPasscode();}">
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="btn primary" style="flex:1;" onclick="submitPasscode()">Enter</button>
      <button class="btn" onclick="LOGIN_UI={mode:'list',pendingProfileId:null,error:null}; renderLoginScreen();">Back</button>
    </div>
  </div>`;
}

function chooseProfile(profileId){
  const profiles = loadProfiles();
  const p = profiles.find(x=>x.id===profileId);
  if(!p) return;
  if(p.passcodeHash){
    LOGIN_UI = { mode:"passcode", pendingProfileId:profileId, error:null };
    renderLoginScreen();
  } else {
    enterProfile(profileId);
  }
}

function submitPasscode(){
  const val = document.getElementById("passcodeInput").value;
  const id = LOGIN_UI.pendingProfileId;
  if(verifyProfilePasscode(id, val)){
    enterProfile(id);
  } else {
    LOGIN_UI.error = "Incorrect passcode.";
    renderLoginScreen();
  }
}

function submitCreateProfile(){
  const name = document.getElementById("newProfileName").value;
  const pass = document.getElementById("newProfilePass").value;
  const result = createProfile(name, pass);
  if(!result.ok){
    LOGIN_UI.error = result.error;
    renderLoginScreen();
    return;
  }
  enterProfile(result.profile.id);
}

function enterProfile(profileId){
  selectProfile(profileId);
  LOGIN_UI = { mode:"list", pendingProfileId:null, error:null };
  if(window._startBootSequence) window._startBootSequence();
}

function confirmDeleteProfile(profileId, name){
  if(!confirm(`Delete profile "${name}" and all its progress on this device? This cannot be undone.`)) return;
  deleteProfile(profileId);
  renderLoginScreen();
}

function switchProfile(){
  if(GAME && GAME.timerHandle){ clearInterval(GAME.timerHandle); GAME.timerHandle = null; GAME.active = null; }
  signOutProfile();
  document.getElementById("app").classList.remove("ready");
  document.getElementById("boot").style.display = "none";
  LOGIN_UI = { mode:"list", pendingProfileId:null, error:null };
  renderLoginScreen();
}


/* ===== init.js ===== */
/* =========================================================
   BOOT SEQUENCE + APP INIT
   ========================================================= */

const BOOT_LINES = [
  { t: "[  0.0012 ] initializing academy kernel...", cls:"" },
  { t: "[  0.0341 ] mounting /home/trainee ...", cls:"" },
  { t: "[  0.0512 ] loading curriculum modules (foundations, netsec, websec, crypto, social)...", cls:"" },
  { t: "[  0.0980 ] checking local save state...", cls:"" },
  { t: "[  0.1203 ] save found — restoring session", cls:"ok" },
  { t: "[  0.1440 ] starting terminal subsystem...", cls:"" },
  { t: "[  0.1811 ] all systems nominal.", cls:"ok" },
  { t: "", cls:"" },
  { t: "welcome back, trainee.", cls:"tag" },
];

function runBoot(cb){
  const logEl = document.getElementById("boot-log");
  logEl.innerHTML = "";
  let i = 0;
  function next(){
    if(i >= BOOT_LINES.length){ cb(); return; }
    const line = BOOT_LINES[i];
    const span = document.createElement("div");
    if(line.cls) span.className = line.cls;
    span.textContent = line.t;
    logEl.appendChild(span);
    i++;
    setTimeout(next, line.t === "" ? 80 : 90 + Math.random()*70);
  }
  next();
}

function finishBoot(){
  document.getElementById("boot").style.display = "none";
  document.getElementById("app").classList.add("ready");
  applyThemeVars();
  renderAll();
  touchStreak();
}

function applyThemeVars(){
  const root = document.documentElement;
  const themeMap = {
    green: "#4ff08a",
    amber: "#ffb454",
    cyan: "#5ad7ff",
    matrix: "#39ff6a"
  };
  root.style.setProperty("--green", themeMap[STATE.theme] || themeMap.green);
}

/* ---------- mobile nav ---------- */
function wireMobileNav(){
  const hb = document.getElementById("hamburgerBtn");
  const nav = document.getElementById("sideNav");
  const scrim = document.getElementById("navScrim");
  hb.addEventListener("click", ()=>{
    nav.classList.toggle("open");
    scrim.classList.toggle("show");
  });
  scrim.addEventListener("click", closeMobileNav);
}

/* ---------- boot skip + login gate ---------- */
function wireBootSkip(){
  const skipBtn = document.getElementById("boot-skip");
  let skipped = false;
  let bootStarted = false;
  function doSkip(){
    if(skipped) return;
    skipped = true;
    finishBoot();
  }
  function startBootSequence(){
    if(bootStarted) return;
    bootStarted = true;
    document.getElementById("login").style.display = "none";
    document.getElementById("boot").style.display = "flex";
    skipBtn.addEventListener("click", doSkip);
    document.addEventListener("keydown", function onKey(e){
      if(e.key === "Enter" && document.getElementById("boot").style.display !== "none"){
        doSkip();
        document.removeEventListener("keydown", onKey);
      }
    });
    runBoot(()=>{ if(!skipped){ setTimeout(doSkip, 500); } });
  }
  window._startBootSequence = startBootSequence;

  // If this browser tab already has an active profile selected this session, skip straight to boot.
  const lastId = sessionStorage.getItem(SESSION_KEY);
  if(lastId && selectProfile(lastId)){
    startBootSequence();
  } else {
    renderLoginScreen();
  }
}

document.addEventListener("DOMContentLoaded", ()=>{
  wireBootSkip();
  wireMobileNav();
});


</script>
