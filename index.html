          "Only the header is encrypted",
          "Only for tokens issued by banks"
        ],
        "correct": 1,
        "explain": "Base64 encoding is not encryption — it's just a reversible encoding format. Anyone can decode a JWT payload; the signature only protects against undetected tampering, not disclosure."
      },

    {
      "id": "w15",
      "title": "CORS, and why it exists",
      "concept": "\n  <p><b>CORS (Cross-Origin Resource Sharing)</b> is a browser security mechanism controlling whether a webpage running on one origin can make requests to a different origin.</p>\n  <p>By default, the \"Same-Origin Policy\" blocks a script on <code>evil.com</code> from reading responses from <code>bank.com</code> — even if your browser is logged into <code>bank.com</code> in another tab. CORS is how a server can deliberately relax this, saying \"actually, I'll allow requests from these specific origins.\"</p>\n  <pre>Access-Control-Allow-Origin: https://trusted-partner.com</pre>\n  <div class=\"callout warn\">A dangerous misconfiguration: setting <code>Access-Control-Allow-Origin: *</code> combined with allowing credentials — this effectively tells browsers \"any website anywhere can read this data while impersonating a logged-in user,\" defeating the entire purpose of the same-origin protection.</div>",

        "correct": 1,
        "explain": "A wildcard CORS policy combined with credentialed requests essentially opens the API to any origin, which is exactly what same-origin policy exists to prevent."

    {
      "id": "w16",
      "title": "Business logic vulnerabilities",
      "concept": "\n  <p>Not every vulnerability is a technical bug like SQL injection — some come from flawed <i>logic</i> in how an application is designed, even if the code has no traditional \"bug\" at all.</p>\n  <p>Examples:</p>\n  <ul>\n    <li>An e-commerce checkout that lets you apply a discount code multiple times by resubmitting the same request</li>\n    <li>A password reset flow that emails a reset link, but the link's token is guessable/sequential</li>\n    <li>A multi-step form that lets you skip the payment step by directly navigating to the \"confirmation\" URL</li>\n  </ul>\n  <p>These are notoriously hard to catch with automated scanners because nothing is \"broken\" in a technical sense — the code runs exactly as written. It requires actually understanding the intended business process and thinking like an attacker about how each step could be abused or reordered.</p>",

    {
      "id": "w17",
      "title": "Server-Side Request Forgery (SSRF)",
      "concept": "\n  <p><b>SSRF</b> tricks a server into making requests on the attacker's behalf — often to internal resources the attacker couldn't otherwise reach directly from the outside internet.</p>\n  <p>Example: an app that lets users submit a URL to \"fetch a preview image\" from.</p>\n  <pre>POST /fetch-preview\n{\"url\": \"http://169.254.169.254/latest/meta-data/iam/security-credentials/\"}</pre>\n  <p>That IP is a special cloud metadata endpoint, accessible only from inside the cloud instance itself — normally unreachable from the public internet. But the server, fetching URLs on the user's behalf, will happily reach it and might return cloud credentials directly to the attacker.</p>\n  <div class=\"callout warn\">SSRF became a much bigger deal once cloud metadata endpoints became common — several major real-world breaches have used exactly this exact technique to steal cloud credentials.</div>",

        "explain": "SSRF lets an attacker use the trusted server itself as a proxy to reach internal-only resources — sidestepping network boundaries that would otherwise block direct external access."

    {
      "id": "w18",
      "title": "XML External Entity (XXE) injection",
      "concept": "\n  <p>Some applications parse XML input, and many XML parsers support a feature called \"external entities\" — references that can pull in content from a file path or URL when the XML is parsed.</p>\n  <pre>&lt;?xml version=\"1.0\"?&gt;\n&lt;!DOCTYPE foo [ &lt;!ENTITY xxe SYSTEM \"file:///etc/passwd\"&gt; ]&gt;\n&lt;foo&gt;&amp;xxe;&lt;/foo&gt;</pre>\n  <p>If the parser isn't configured to disable this feature, submitting XML like this can make the server read and return the contents of arbitrary local files, or even make outbound network requests (overlapping with SSRF).</p>\n  <div class=\"callout\">Defense: disable external entity processing in your XML parser's configuration — nearly every major XML library has a setting for this, and it should be off by default for any parser handling untrusted input.</div>",

    {
      "id": "w19",
      "title": "Web Application Firewalls (WAF)",
      "concept": "\n  <p>A <b>WAF (Web Application Firewall)</b> sits in front of a web application and inspects HTTP traffic for known attack patterns — SQL injection attempts, XSS payloads, suspicious request shapes — blocking or flagging them before they reach the application.</p>\n  <p>Important nuance: a WAF is a valuable additional layer (defense in depth again), but it is not a substitute for fixing the actual underlying vulnerability. WAFs can be bypassed with cleverly obfuscated payloads, and they can produce false positives that block legitimate traffic.</p>\n  <div class=\"callout warn\">Common mistake: treating a WAF as \"solving\" a known vulnerability instead of patching the actual code. It's a mitigating control, not a fix — think of it as a bandage that buys time, not a cure.</div>",

      "id": "w21",
      "title": "API security specifics",
      "concept": "\n  <p>Beyond general web vulnerabilities, APIs have their own common failure patterns, often summarized in the \"OWASP API Security Top 10\":</p>\n  <ul>\n    <li><b>Broken Object Level Authorization</b> — the API version of IDOR: can you access <code>/api/orders/1002</code> that isn't yours?</li>\n    <li><b>Excessive data exposure</b> — an API returning a full internal object (including fields like password hashes or internal notes) and relying on the frontend to just \"not display\" the sensitive parts — but the raw data was still sent</li>\n    <li><b>Lack of rate limiting</b> — no cap on requests, enabling brute-force or scraping at scale</li>\n    <li><b>Improper inventory management</b> — old, undocumented, or \"internal only\" API versions left running and forgotten, often with weaker security than the current version</li>\n  </ul>\n  <div class=\"callout warn\">\"Excessive data exposure\" is sneaky — developers assume the frontend hiding a field is enough, forgetting that anyone can just inspect the raw network response directly.</div>",

      "id": "w22",
      "title": "Same-Origin Policy, precisely",
      "concept": "\n  <p>We touched on this with CORS, but it's worth understanding precisely what an \"origin\" is. An origin is the combination of:</p>\n  <pre>scheme + host + port\nhttps://example.com:443</pre>\n  <p>Change ANY of the three, and it's a different origin:</p>\n  <ul>\n    <li><code>http://example.com</code> vs <code>https://example.com</code> — different (scheme)</li>\n    <li><code>https://example.com</code> vs <code>https://api.example.com</code> — different (host)</li>\n    <li><code>https://example.com:443</code> vs <code>https://example.com:8443</code> — different (port)</li>\n  </ul>\n  <p>The Same-Origin Policy is the browser's default rule that scripts from one origin can't read data from a different origin — it's the baseline protection that CORS, carefully, lets servers selectively relax.</p>",

        "q": "Are https://shop.example.com and https://example.com considered the same origin?",

    {
      "id": "w23",
      "title": "Secure session management",
      "concept": "\n  <p>Beyond just setting cookie flags (covered earlier), robust session management includes several other practices:</p>\n  <ul>\n    <li><b>Session expiration</b> — sessions should time out after inactivity, limiting the window a stolen session token remains useful</li>\n    <li><b>Session invalidation on logout</b> — logging out should actually destroy the session server-side, not just delete the cookie client-side</li>\n    <li><b>Session regeneration on privilege change</b> — issue a brand new session ID immediately after login, preventing \"session fixation\" attacks where an attacker tricks a victim into using a pre-known session ID</li>\n    <li><b>Binding sessions loosely to context</b> — flagging or invalidating a session if its usage pattern suddenly looks very different (e.g. sudden new country)</li>\n  </ul>\n  <div class=\"callout\">Session fixation specifically: if an app doesn't rotate the session ID after login, an attacker can set a victim's session ID to a known value beforehand (e.g. via a crafted link), then simply use that same known ID after the victim logs in.</div>",

      "id": "w24",
      "title": "Web application penetration testing, the workflow",
      "concept": "\n  <p>Bringing many earlier lessons together — a typical (simplified) web app pentest workflow looks like:</p>\n  <ol>\n    <li><b>Reconnaissance</b> — map out the application: pages, forms, API endpoints, technologies in use</li>\n    <li><b>Scanning</b> — automated tools check for known vulnerability patterns</li>\n    <li><b>Manual testing</b> — a human tester probes business logic, chained vulnerabilities, and things scanners miss</li>\n    <li><b>Exploitation</b> — confirming a vulnerability is real and assessing actual impact, not just theoretical</li>\n    <li><b>Reporting</b> — clearly documenting findings, severity, and remediation guidance for the development team</li>\n  </ol>\n  <div class=\"callout\">The reporting step is chronically underrated by newcomers — a vulnerability nobody can understand or reproduce from the writeup effectively doesn't get fixed. Clear communication is a genuine, valuable skill in this field, not an afterthought.</div>",

      "id": "w26",
      "title": "Content Security Policy, in depth",
      "concept": "\n  <p>We introduced CSP briefly as a security header — worth a deeper look since it's genuinely one of the strongest available XSS mitigations when configured well.</p>\n  <pre>Content-Security-Policy:\n  default-src 'self';\n  script-src 'self' https://trusted-cdn.com;\n  img-src 'self' data:;</pre>\n  <p>This policy says: by default, only load resources from the site's own origin; scripts specifically can also load from one trusted CDN; images can also be inline data URIs. Anything else — including an injected inline <code>&lt;script&gt;</code> tag from an XSS attempt — gets blocked by the browser itself before it can execute, regardless of whether the injection succeeded at the HTML level.</p>\n  <div class=\"callout warn\">A common mistake that defeats CSP's value: allowing <code>'unsafe-inline'</code> in the script-src directive \"just to make development easier\" — this specifically re-enables exactly the inline script execution CSP exists to block, undermining its core XSS protection.</div>",
      "check": {
        "type": "quiz",
        "q": "Why does adding 'unsafe-inline' to a CSP's script-src directive significantly weaken its XSS protection?",
        "opts": [

          "It only affects image loading, not scripts",
          "'unsafe-inline' makes the page load faster with no tradeoff"
        ],
        "correct": 1,
        "explain": "CSP's XSS protection largely comes from blocking inline scripts by default — explicitly re-allowing them removes exactly the protection an injected script tag would otherwise be blocked by."
      },

    {
      "id": "w27",
      "title": "Subresource Integrity (SRI)",
      "concept": "\n  <p>Websites commonly load JavaScript/CSS from third-party CDNs for convenience and performance. But this means trusting that CDN completely — if it's ever compromised, every site loading from it could silently receive malicious code.</p>\n  <p><b>Subresource Integrity</b> lets a site specify the exact expected hash of a resource it's loading:</p>\n  <pre>&lt;script src=\"https://cdn.example.com/library.js\"\n        integrity=\"sha384-oqVuAf...\"\n        crossorigin=\"anonymous\"&gt;&lt;/script&gt;</pre>\n  <p>If the CDN ever serves content that doesn't match that hash — whether from a compromise, a misconfiguration, or a MITM — the browser simply refuses to execute it, rather than blindly trusting whatever the CDN happens to currently be serving.</p>",
      "check": {
        "type": "quiz",
        "q": "What problem does Subresource Integrity specifically protect against?",

          "Weak passwords",
          "DDoS attacks"
        ],
        "correct": 1,
        "explain": "SRI is specifically about verifying that externally-loaded resources match an expected hash, protecting against a compromised or tampered third-party source."
      },
      "xp": 24,
      "credits": 10
    },
    {
      "id": "w28",
      "title": "GraphQL security considerations",
      "concept": "\n  <p><b>GraphQL</b> is an increasingly common alternative to traditional REST APIs, letting clients request exactly the specific data fields they need in a single flexible query. This flexibility introduces its own distinct security considerations:</p>\n  <ul>\n    <li><b>Query complexity attacks</b> — a maliciously deeply-nested query can force the server to do an enormous, disproportionate amount of work relative to the request's apparent simplicity, a denial-of-service risk fairly unique to GraphQL's flexible query model</li>\n    <li><b>Introspection exposure</b> — GraphQL APIs can optionally expose their entire schema (every available field/type) to anyone who asks; leaving this enabled in production hands an attacker a complete map of the API's full capabilities and data model</li>\n    <li><b>Field-level authorization gaps</b> — REST endpoints are naturally scoped per-resource; GraphQL's single flexible endpoint means authorization checks must be applied consistently to every individual field, which is easier to accidentally miss somewhere</li>\n  </ul>",

        "explain": "GraphQL's core flexibility — letting clients shape complex nested queries — is exactly what creates this distinct resource-exhaustion risk that a more rigid REST endpoint structure doesn't share to the same degree."

      "id": "w29",
      "title": "Web caching vulnerabilities",
      "concept": "\n  <p>Caching improves performance by storing and reusing responses — but caching the wrong thing, or caching it incorrectly, creates real vulnerabilities:</p>\n  <ul>\n    <li><b>Web cache poisoning</b> — tricking a shared cache into storing a malicious response, which then gets served to every subsequent user who requests that same cached resource, turning a single successful attack into one affecting many victims</li>\n    <li><b>Caching sensitive/personalized content</b> — if a page containing one user's private data gets cached and then served to a different user requesting the same URL, that's a serious data leak, entirely from a caching misconfiguration rather than any traditional vulnerability</li>\n  </ul>\n  <div class=\"callout warn\">Cache poisoning is a great example of amplification — a single successful attack against the cache layer can affect every subsequent visitor until the poisoned entry expires or is cleared, turning what might be a minor individual-request issue into a much larger-scale problem.</div>",

      "id": "c1",
      "title": "Hashing vs. encryption",
      "concept": "\n  <p>These two are constantly confused but do opposite jobs:</p>\n  <ul>\n    <li><b>Encryption</b> is reversible — you encrypt data, and with the right key, you decrypt it back to the original. Used when you need the data back.</li>\n    <li><b>Hashing</b> is one-way — you can't \"un-hash\" a hash back into the original input. Used to verify data without storing the original.</li>\n  </ul>\n  <p>This is exactly why passwords should be <b>hashed</b>, not encrypted. The site never needs your actual password back — it just needs to check \"does hashing what you typed match the stored hash?\"</p>\n  <pre>hash(\"password123\")  →  ef92b778bafe771e...\nhash(\"password124\")  →  a totally different string</pre>\n  <div class=\"callout\">Even a 1-character change completely scrambles the output — this is called the \"avalanche effect,\" and it's a key property of good hash functions.</div>",
      "check": {
        "type": "quiz",
        "q": "Why should passwords be hashed rather than encrypted in a database?",
        "opts": [
          "Hashing is faster to compute",
          "The site never needs to recover the original password — it only needs to verify a match, and hashing can't be reversed",
          "Encryption doesn't work on text data",
          "Hashing takes up less storage space"
        ],
        "correct": 1,
        "explain": "Since verification just needs a match check, a one-way hash is both sufficient and safer — there's no key to steal that would reveal the original passwords."
      },
      "xp": 24,
      "credits": 10
    },
    {
      "id": "c2",
      "title": "Salting passwords",
      "concept": "\n  <p>Hashing alone has a weakness: if two users pick the same password, they get the same hash. Attackers exploit this with <b>rainbow tables</b> — massive precomputed lists of common passwords and their hashes.</p>\n  <p>A <b>salt</b> is random data added to a password before hashing, unique per user:</p>\n  <pre>hash(\"password123\" + \"x7Qz\")  →  one result\nhash(\"password123\" + \"pL9k\")  →  a completely different result</pre>\n  <p>Now even identical passwords produce different stored hashes, and precomputed rainbow tables become useless — the attacker would need a new table for every possible salt.</p>\n  <div class=\"callout\">Modern password hashing also uses deliberately <b>slow</b> algorithms (like bcrypt, scrypt, Argon2) — slow on purpose, so brute-forcing millions of guesses becomes impractically expensive.</div>",
      "check": {
        "type": "quiz",
        "q": "What problem does salting specifically solve?",
        "opts": [

          "It prevents attackers from using precomputed hash tables against multiple accounts at once",

          "It speeds up the login process"
        ],

        "explain": "Salting defeats rainbow tables by making every user's hash unique even for identical passwords, forcing attackers to brute-force each one individually."
      },

    {
      "id": "c3",
      "title": "Symmetric vs. asymmetric encryption",
      "concept": "\n  <p><b>Symmetric encryption</b> uses one key for both encrypting and decrypting. Fast, but you have a problem: how do two people who've never met safely share that key in the first place?</p>\n  <p><b>Asymmetric encryption</b> (public-key cryptography) solves this with a key pair:</p>\n  <ul>\n    <li><b>Public key</b> — share it with anyone, it only encrypts</li>\n    <li><b>Private key</b> — keep it secret, it's the only thing that can decrypt what the public key encrypted</li>\n  </ul>\n  <p>Anyone can encrypt a message to you using your public key, but only you (holding the private key) can read it. This solves the \"how do we agree on a secret without meeting\" problem — at the cost of being much slower than symmetric encryption.</p>\n  <div class=\"callout\">In practice, TLS uses asymmetric encryption briefly to safely exchange a symmetric key, then switches to fast symmetric encryption for the actual data. Best of both worlds.</div>",
      "check": {
        "type": "quiz",
        "q": "What key can decrypt a message encrypted with someone's public key?",
        "opts": [
          "Any public key",
          "That same public key",
          "Only the matching private key",
          "No key — it can never be decrypted"
        ],
        "correct": 2,
        "explain": "That's the whole point of asymmetric crypto — the public key can only encrypt; only the paired private key can decrypt it."
      },
      "xp": 26,
      "credits": 11
    },
    {
      "id": "c4",
      "title": "Digital signatures",
      "concept": "\n  <p>Public-key crypto also works in reverse to prove <b>authenticity</b>. A <b>digital signature</b> is created by encrypting a hash of a message with your <b>private</b> key.</p>\n  <p>Anyone can then decrypt that signature using your <b>public</b> key and check it matches the message's hash. If it matches, two things are proven at once:</p>\n  <ul>\n    <li><b>Authenticity</b> — only you could have created that signature, since only you hold the private key</li>\n    <li><b>Integrity</b> — if even one byte of the message changed, the hash wouldn't match anymore</li>\n  </ul>\n  <p>This is exactly how software updates, HTTPS certificates, and cryptocurrency transactions all prove they haven't been tampered with.</p>",
      "check": {
        "type": "quiz",
        "q": "A digital signature primarily proves what two things?",

    {
      "id": "c5",
      "title": "Two-factor authentication",
      "concept": "\n  <p>Passwords alone rely on \"something you know.\" <b>2FA (Two-Factor Authentication)</b> adds a second, different category:</p>\n  <ul>\n    <li><b>Something you know</b> — password, PIN</li>\n    <li><b>Something you have</b> — phone, authenticator app, hardware key</li>\n    <li><b>Something you are</b> — fingerprint, face</li>\n  </ul>\n  <p>Even if a password leaks, an attacker still needs the second factor. Not all 2FA is equally strong though:</p>\n  <ul>\n    <li><b>SMS codes</b> — better than nothing, but vulnerable to SIM-swapping attacks</li>\n    <li><b>Authenticator apps (TOTP)</b> — codes generated locally, much harder to intercept</li>\n    <li><b>Hardware keys (like a YubiKey)</b> — currently the strongest common option, resistant to phishing</li>\n  </ul>",

    {
      "id": "c7",
      "title": "Classic ciphers: Caesar & substitution",
      "concept": "\n  <p>Before understanding modern cryptography, it helps to see the simplest possible version. A <b>Caesar cipher</b> shifts every letter by a fixed amount:</p>\n  <pre>Plaintext:  ATTACK AT DAWN\nShift +3:   DWWDFN DW GDZQ</pre>\n  <p>Trivially breakable today — only 25 possible shifts, so you can just try them all (\"brute force\" by hand). A <b>substitution cipher</b> is more general: any letter can map to any other letter, consistently. Better, but still breakable via <b>frequency analysis</b> — in English, 'E' is the most common letter, so the most frequent symbol in ciphertext is a strong guess for 'E,' and so on.</p>\n  <div class=\"callout\">This history matters: it's exactly why modern cryptography design principles emphasize resistance to statistical analysis, not just \"a large number of possible keys.\" A cipher can have billions of possible keys and still be breakable if its output isn't sufficiently random-looking.</div>",
      "check": {

        "q": "Why can substitution ciphers be broken using frequency analysis?",
        "opts": [
          "Because computers are too slow to try every key",
          "Because letter frequencies in natural language are consistent and predictable, and a 1-to-1 substitution preserves that statistical pattern in the ciphertext",
          "Because substitution ciphers use encryption keys",
          "Because they only work on numbers"
        ],
        "correct": 1,
        "explain": "A simple substitution preserves the underlying frequency pattern of the language — the most common ciphertext symbol is very likely the most common real letter."
      },
      "xp": 20,

    {
      "id": "c8",
      "title": "XOR: the building block",
      "concept": "\n  <p><b>XOR (exclusive OR)</b> is a simple bitwise operation that shows up constantly in cryptography's building blocks. Its key property: XOR-ing something twice with the same value returns the original.</p>\n  <pre>plaintext  XOR  key  =  ciphertext\nciphertext XOR  key  =  plaintext (back again!)</pre>\n  <p>This is the basis of the theoretically unbreakable <b>one-time pad</b>: if your key is truly random, exactly as long as the message, and never reused, XOR-ing plaintext with it produces ciphertext that's mathematically proven to reveal zero information about the plaintext.</p>\n  <div class=\"callout warn\">The catch is brutal in practice: the key must be as long as the message, truly random, and used only once ever. Reuse the same key twice, and XOR-ing the two ciphertexts together cancels the key out entirely — a catastrophic, well-known break. This impracticality is exactly why modern ciphers use different (but related) approaches instead.</div>",
      "check": {
        "type": "quiz",
        "q": "What happens if the same one-time pad key is accidentally reused for two different messages?",

          "The messages become unreadable forever",
          "It only affects the second message, not the first"
        ],
        "correct": 1,
        "explain": "Key reuse is the one-time pad's fatal flaw — the 'one-time' in the name is a hard security requirement, not a suggestion, precisely because of this XOR cancellation property."
      },
      "xp": 24,
      "credits": 10
    },
    {
      "id": "c9",
      "title": "Block ciphers & modes of operation",
      "concept": "\n  <p>Modern symmetric encryption (like <b>AES</b>) is a <b>block cipher</b> — it encrypts fixed-size chunks (blocks) of data at a time, typically 128 bits. But real messages are rarely exactly one block long, so a <b>mode of operation</b> defines how to chain many blocks together.</p>\n  <ul>\n    <li><b>ECB (Electronic Codebook)</b> — encrypts each block completely independently. Simple, but dangerously reveals patterns: identical plaintext blocks produce identical ciphertext blocks, which can literally leak the shape of an image or repeated structure. Should basically never be used.</li>\n    <li><b>CBC (Cipher Block Chaining)</b> — each block is XORed with the previous ciphertext block before encrypting, breaking that pattern-repetition problem.</li>\n    <li><b>GCM (Galois/Counter Mode)</b> — modern, widely recommended; provides both encryption AND built-in integrity verification (detecting tampering) in one mode.</li>\n  </ul>\n  <div class=\"callout warn\">The classic demonstration: encrypt an image using ECB mode — you can often still make out the original image's outline in the \"encrypted\" result, because identical colored regions produce identical ciphertext blocks.</div>",
      "check": {
        "type": "quiz",
        "q": "Why is ECB mode considered dangerous even though it uses a strong underlying cipher like AES?",

          "It doesn't use a key at all",
          "It only works on text, not images"
        ],
        "correct": 1,
        "explain": "ECB's block independence is exactly its flaw — real-world data often has repeated patterns, and ECB faithfully preserves and reveals them in the ciphertext."
      },
      "xp": 26,
      "credits": 11

    {
      "id": "c10",
      "title": "Key exchange: the Diffie-Hellman idea",
      "concept": "\n  <p>How do two parties agree on a shared secret key over a public channel that an eavesdropper is watching, without ever transmitting the key itself? <b>Diffie-Hellman key exchange</b> was the breakthrough answer.</p>\n  <p>A classic paint-mixing analogy: imagine mixing paint colors is easy, but \"un-mixing\" them back into components is essentially impossible.</p>\n  <ol>\n    <li>Alice and Bob publicly agree on a shared \"base\" paint color</li>\n    <li>Alice privately mixes in her own secret color; Bob does the same with his own secret color</li>\n    <li>They swap their resulting mixed colors publicly (an eavesdropper sees only these mixtures)</li>\n    <li>Each adds their own secret color again to the color they received — both arrive at the exact same final shared color, but an eavesdropper who only saw the exchanged mixtures can't feasibly reverse-engineer either original secret</li>\n  </ol>\n  <p>Mathematically this uses modular exponentiation instead of paint, but the intuition — easy to combine, computationally infeasible to reverse — is exactly right.</p>",
      "check": {
        "type": "quiz",
        "q": "What property does the paint-mixing analogy for Diffie-Hellman rely on?",
        "opts": [
          "Mixing paint is reversible",
          "Combining is easy, but reversing the combination back into original components is computationally infeasible",
          "Paint colors are secret by default",
          "Both parties must meet in person beforehand"
        ],
        "correct": 1,
        "explain": "That asymmetry — easy forward, infeasible backward — is the essential property that lets two parties agree on a secret while an observer, seeing only the exchanged public values, can't derive it."
      },

    {
      "id": "c11",
      "title": "Common hash algorithms & why some are 'broken'",
      "concept": "\n  <p>Not all hash functions have aged equally well:</p>\n  <ul>\n    <li><b>MD5</b> — considered cryptographically broken; researchers can deliberately construct two different inputs producing the same hash (a \"collision\") relatively easily. Still fine for non-security uses like checksums, never for security purposes.</li>\n    <li><b>SHA-1</b> — also broken for security purposes; a practical collision was publicly demonstrated in 2017 (\"SHAttered\").</li>\n    <li><b>SHA-256 / SHA-3</b> — currently considered secure and are the modern standard for general-purpose hashing.</li>\n    <li><b>bcrypt / scrypt / Argon2</b> — specifically designed for password hashing (deliberately slow, tunable), distinct from general-purpose hashes like SHA-256 which are designed to be fast.</li>\n  </ul>\n  <div class=\"callout warn\">A common mistake: using fast general-purpose hashes like plain SHA-256 directly for password storage. Fast is exactly the wrong property for password hashing — it's a gift to attackers running billions of guesses per second on stolen hash dumps. Use a purpose-built slow algorithm like bcrypt or Argon2 instead.</div>",

        "correct": 1,
        "explain": "General-purpose hashes are optimized for speed, which is exactly the wrong property when the goal is resisting brute-force guessing — purpose-built slow algorithms like bcrypt exist for this reason."

    {
      "id": "c12",
      "title": "Certificate pinning",
      "concept": "\n  <p>Normally, an app or browser trusts any certificate signed by any CA in its trust store — dozens of organizations, globally. <b>Certificate pinning</b> narrows this: an app hardcodes (\"pins\") the exact certificate or public key it expects for a specific service, rejecting connections even if the presented certificate is technically validly signed by some trusted CA, if it isn't the specific expected one.</p>\n  <p>Why bother, if the CA system already works? It defends against a compromised or coerced CA — if any trusted CA anywhere is compromised (or, in some threat models, a government forces a CA to issue a fraudulent cert), pinning still rejects the connection because it's checking for one very specific expected certificate.</p>\n  <div class=\"callout warn\">Tradeoff: pinning is brittle. If the pinned certificate legitimately expires or rotates and the app isn't updated in time, the app breaks entirely — connecting to its own legitimate server. This operational fragility is why pinning is used selectively, mostly in high-security mobile apps (banking, messaging).</div>",
      "check": {
        "type": "quiz",
        "q": "What specific threat does certificate pinning defend against that normal CA trust does not?",
        "opts": [

          "A compromised or coerced Certificate Authority issuing a fraudulent-but-validly-signed certificate for the target domain",
          "Slow network connections",
          "SQL injection"
        ],
        "correct": 1,
        "explain": "Pinning assumes the CA system itself could fail and checks for one specific expected certificate/key regardless of what any CA has signed — a stronger, narrower guarantee."
      },

    {
      "id": "c13",
      "title": "Steganography vs. cryptography",
      "concept": "\n  <p>These are often confused but solve different problems:</p>\n  <ul>\n    <li><b>Cryptography</b> — makes a message unreadable without the key. Anyone can see that an encrypted message exists, they just can't read its contents.</li>\n    <li><b>Steganography</b> — hides the very existence of a message. A secret message might be concealed in the least-significant bits of an image file's pixel data, invisible to casual inspection, with the image looking completely normal.</li>\n  </ul>\n  <p>They're complementary, not competing — a message can be encrypted AND hidden via steganography for layered protection: even if someone finds the hidden data, it's still encrypted; even if the encryption is someday broken, the message's existence was never obvious in the first place.</p>",
      "check": {

    {
      "id": "c14",
      "title": "Blockchain cryptography basics",
      "concept": "\n  <p>Blockchains combine several cryptographic concepts already covered into one system:</p>\n  <ul>\n    <li>Each block contains a <b>hash</b> of the previous block, chaining them together — changing any historical block would change its hash, breaking every subsequent block's reference and making tampering immediately evident</li>\n    <li>Transactions are authorized using <b>digital signatures</b> (asymmetric cryptography) — proving you own the private key associated with a wallet address, without revealing the key itself</li>\n    <li>Distributed consensus mechanisms (like proof-of-work) prevent any single party from simply rewriting history unilaterally</li>\n  </ul>\n  <div class=\"callout\">None of this is exotic new cryptography — blockchains are a clever combination of hashing and digital signatures you've already learned, applied to a specific distributed-trust problem.</div>",
      "check": {
        "type": "quiz",
        "q": "Why does changing data in an old blockchain block break the chain's integrity?",

        "explain": "The hash-chaining is exactly the tamper-evidence mechanism — a single changed byte anywhere in history cascades into a mismatch that's easy to detect."

    {
      "id": "c15",
      "title": "Quantum computing & cryptography's future",
      "concept": "\n  <p>Quantum computers, if built at sufficient scale, threaten some (not all) of the cryptography covered so far:</p>\n  <ul>\n    <li><b>Shor's algorithm</b> could efficiently break RSA and other asymmetric schemes based on factoring or discrete logarithms — the exact math problems that make those systems secure today against classical computers.</li>\n    <li><b>Symmetric</b> algorithms like AES are considered much less affected — <b>Grover's algorithm</b> only provides a quadratic speedup, which can generally be countered by simply doubling the key size.</li>\n  </ul>\n  <p>This has already prompted real, ongoing work: <b>post-quantum cryptography (PQC)</b> — new algorithms designed to resist quantum attacks, based on different hard mathematical problems (like lattice-based cryptography). Standards bodies (NIST notably) have already selected initial PQC algorithms for future adoption.</p>\n  <div class=\"callout\">This isn't science fiction — organizations handling long-lived sensitive data are already planning \"harvest now, decrypt later\" defenses, since an adversary could record encrypted traffic today and decrypt it years later once sufficiently powerful quantum computers exist.</div>",
      "check": {

        "q": "Why are asymmetric algorithms like RSA considered more threatened by quantum computing than symmetric algorithms like AES?",

        "correct": 1,
        "explain": "The threat is algorithm-specific: Shor's algorithm directly undermines the factoring/discrete-log problems asymmetric crypto depends on, while symmetric crypto faces a much smaller, more manageable quantum speedup."

    {
      "id": "c17",
      "title": "Key management: the hard part",
      "concept": "\n  <p>Cryptographic algorithms themselves are rarely the weak point in real systems — <b>key management</b> almost always is. All the math in the world doesn't help if the key is handled poorly.</p>\n  <p>Real-world key management concerns:</p>\n  <ul>\n    <li><b>Generation</b> — keys must come from a genuinely random source; predictable \"random\" number generation has caused real breaks</li>\n    <li><b>Storage</b> — where do keys live? Hardcoded in source code (bad) vs. a dedicated secrets manager or Hardware Security Module (HSM) (good)</li>\n    <li><b>Rotation</b> — periodically replacing keys limits how much damage a single leaked key can cause</li>\n    <li><b>Revocation</b> — the ability to invalidate a compromised key quickly, and ensure the system actually respects that revocation</li>\n  </ul>\n  <div class=\"callout warn\">A widely repeated saying in the field: \"amateurs attack algorithms, professionals attack key management.\" The math behind AES is not what typically gets broken in practice — sloppy handling of the key itself is.</div>",

    {
      "id": "c19",
      "title": "Perfect Forward Secrecy",
      "concept": "\n  <p>Imagine an attacker records encrypted traffic today, and years later somehow obtains the server's long-term private key. Could they then decrypt everything they recorded, retroactively? Without <b>Perfect Forward Secrecy (PFS)</b> — yes, potentially.</p>\n  <p>PFS-enabled key exchange generates a fresh, temporary (ephemeral) key for each session, mathematically independent of the server's long-term private key. Compromising the long-term key later doesn't help decrypt past sessions, because each session's actual encryption key was never derivable from the long-term key alone in the first place.</p>\n  <div class=\"callout\">This directly connects to the \"harvest now, decrypt later\" quantum computing risk mentioned earlier — PFS is exactly the kind of practical defense that limits how much damage a future key compromise (whether from quantum computing or simple key theft) can retroactively cause.</div>",
      "check": {
        "type": "quiz",
        "q": "What does Perfect Forward Secrecy specifically protect against?",
        "opts": [

          "It ensures that if a server's long-term private key is compromised later, previously recorded encrypted sessions still can't be decrypted, since each session used its own independent ephemeral key",
          "It makes websites load faster",
          "It only applies to email encryption"
        ],
        "correct": 1,
        "explain": "PFS specifically limits the blast radius of a future key compromise to not retroactively expose past traffic — a distinct, valuable property beyond the strength of the encryption algorithm itself."
      },
      "xp": 26,
      "credits": 11
    },
    {
      "id": "c20",
      "title": "HMAC: combining hashing and secrecy",
      "concept": "\n  <p>A plain hash proves integrity (data wasn't corrupted) but not authenticity (that it actually came from who it claims to) — anyone can compute the hash of anything. <b>HMAC (Hash-based Message Authentication Code)</b> combines a hash function with a secret key to prove both at once.</p>\n  <pre>HMAC = hash(secret_key + message)</pre>\n  <p>Only someone who knows the secret key can generate a valid HMAC for a given message — so if the HMAC checks out, the recipient knows both that the message wasn't altered AND that it genuinely came from someone possessing that shared secret, not just anyone who could compute a plain hash.</p>\n  <div class=\"callout\">This is exactly how many APIs authenticate webhook requests — the sender computes an HMAC using a shared secret, and the receiver recomputes it independently to verify the request is genuine before trusting its contents.</div>",
      "check": {
        "type": "quiz",
        "q": "What does HMAC provide that a plain hash function alone does not?",
        "opts": [
          "Faster computation speed",
          "Authenticity — proof the message came from someone who knows the shared secret key, not just that it wasn't altered",
          "Reversibility, unlike plain hashing",
          "Compatibility with older systems"
        ],
        "correct": 1,
        "explain": "A plain hash anyone can compute proves integrity alone; incorporating a secret key into the computation additionally proves the sender's authenticity to anyone sharing that same secret."
      },
      "xp": 26,
      "credits": 11
    },
    {
      "id": "c21",
      "title": "Encoding is not encryption",
      "concept": "\n  <p>Worth stating this directly and clearly, since it's one of the most common real-world confusions, and we've actually touched on it before (recall the JWT lesson): <b>encoding</b> (like Base64) is NOT encryption, and treating it as such is a genuine security mistake.</p>\n  <pre>Base64 \"encryption\":  aGVsbG8gd29ybGQ=\n                        ↓ anyone can trivially reverse this:\n                        hello world</pre>\n  <p>Encoding exists purely to represent data in a different, more transportable format (like ensuring binary data survives being sent through text-only systems) — it provides precisely zero confidentiality. No secret key is involved at all; anyone can decode it instantly using entirely public, standard tools.</p>\n  <div class=\"callout warn\">This mistake shows up surprisingly often in real, shipped code — \"obfuscating\" a password or API key with Base64 encoding and treating that as if it were meaningfully secured. It provides no real protection whatsoever against anyone who bothers to look.</div>",

    {
      "id": "s1",
      "title": "Why humans are the real target",
      "concept": "\n  <p>The strongest firewall in the world doesn't matter if an employee just... hands over their password because someone asked nicely. This is why security professionals say \"there is no patch for human nature.\"</p>\n  <p><b>Social engineering</b> is the art of manipulating people into breaking normal security procedures. It works by exploiting predictable human tendencies:</p>\n  <ul>\n    <li><b>Authority</b> — \"This is IT, we need your password to fix an issue\"</li>\n    <li><b>Urgency</b> — \"Your account will be deleted in 24 hours unless you act now\"</li>\n    <li><b>Trust / familiarity</b> — impersonating a coworker, vendor, or friend</li>\n  </ul>\n  <div class=\"callout\">Studies consistently find social engineering — not exotic technical exploits — is the entry point for the large majority of successful breaches.</div>",

      "id": "s2",
      "title": "Phishing, up close",
      "concept": "\n  <p><b>Phishing</b> is a fraudulent message designed to trick you into giving up credentials, clicking a malicious link, or opening an infected attachment.</p>\n  <p>Red flags to actually look for:</p>\n  <ul>\n    <li>Mismatched sender domain (<code>paypa1-support.com</code> instead of <code>paypal.com</code>)</li>\n    <li>Urgent, threatening language (\"act now or lose access\")</li>\n    <li>A link where the visible text doesn't match the real destination URL</li>\n    <li>Requests for credentials or payment that skip normal channels</li>\n  </ul>\n  <p>Variants worth knowing:</p>\n  <ul>\n    <li><b>Spear phishing</b> — targeted at a specific person, using personal details to seem legitimate</li>\n    <li><b>Whaling</b> — spear phishing aimed at executives specifically</li>\n    <li><b>Vishing / Smishing</b> — phishing over voice calls / SMS text</li>\n  </ul>",

      "title": "OSINT: the recon before the attack",
      "concept": "\n  <p><b>OSINT (Open-Source Intelligence)</b> is gathering information from publicly available sources — social media, company websites, public records, even metadata in photos — to build a profile of a target before an attack.</p>\n  <p>An attacker doing OSINT on a company might learn:</p>\n  <ul>\n    <li>Employee names, roles, and email format (<code>first.last@company.com</code>) from LinkedIn</li>\n    <li>Software/technology in use, from job postings (\"must know Jira, AWS, Salesforce\")</li>\n    <li>Physical security details from photos employees post (\"badge visible in selfie\")</li>\n  </ul>\n  <div class=\"callout\">This is why security awareness training often covers what NOT to overshare publicly — it's not paranoia, it's closing a real recon channel attackers actually use.</div>",

      "id": "s4",
      "title": "Password hygiene, for real",
      "concept": "\n  <p>The advice is well known but worth re-grounding in <i>why</i>:</p>\n  <ul>\n    <li><b>Length beats complexity.</b> A long passphrase like <code>correct-horse-battery-staple</code> resists brute-force far longer than a short complex one like <code>P@ss1!</code></li>\n    <li><b>Never reuse passwords across sites.</b> If one site is breached, reused passwords let attackers \"credential stuff\" — trying that same password on other services automatically.</li>\n    <li><b>Use a password manager.</b> It's the only realistic way to have a unique, long password for every single account without insanity.</li>\n  </ul>\n  <div class=\"callout warn\">Most real-world account takeovers aren't from someone \"guessing\" your password — they're from credential stuffing after a completely different site leaked it.</div>",

    {
      "id": "s5",
      "title": "Threat modeling: thinking like a defender",
      "concept": "\n  <p><b>Threat modeling</b> is the practice of systematically asking, before building anything: what could go wrong, and what would it cost us? A simple framework:</p>\n  <ol>\n    <li><b>What are we protecting?</b> (assets — data, systems, reputation)</li>\n    <li><b>Who might attack it, and why?</b> (threat actors — opportunists, competitors, nation-states...)</li>\n    <li><b>How could they get in?</b> (attack vectors)</li>\n    <li><b>What's the impact if they succeed?</b> (risk = likelihood × impact)</li>\n    <li><b>What do we do about the highest risks first?</b> (mitigation, prioritized)</li>\n  </ol>\n  <p>This is why security isn't \"add every defense possible\" — it's \"add the defenses that address your actual, prioritized risks,\" because unlimited budget and unlimited attention don't exist.</p>",

      "id": "s7",
      "title": "Pretexting: building the false story",
      "concept": "\n  <p><b>Pretexting</b> is inventing a fabricated scenario (a \"pretext\") to manipulate a target into providing information or access they normally wouldn't. It's often the connective tissue underneath phishing, vishing, and physical social engineering.</p>\n  <p>Effective pretexts share a pattern:</p>\n  <ul>\n    <li>A plausible role (IT support, a new vendor, an auditor, a delivery driver)</li>\n    <li>A believable reason for the specific request (\"I just need to verify...\")</li>\n    <li>Just enough real detail (an employee's name, a department, a project name) to seem legitimate</li>\n  </ul>\n  <p>That real detail is usually gathered through OSINT beforehand — pretexting and OSINT work together, not separately: research makes the false story convincing.</p>\n  <div class=\"callout\">The defense isn't \"be suspicious of everyone forever\" — it's process: sensitive actions (resetting a password, granting access) should require verification through a known, separate channel, regardless of how convincing or urgent the request sounds.</div>",

    {
      "id": "s8",
      "title": "Baiting & tailgating",
      "concept": "\n  <p>Two more social engineering techniques worth naming specifically:</p>\n  <ul>\n    <li><b>Baiting</b> — offering something enticing to trigger a risky action. The classic example: leaving a USB drive labeled \"Executive Salaries 2024\" in an office parking lot. Curiosity drives someone to plug it in, running whatever malware is on it.</li>\n    <li><b>Tailgating (piggybacking)</b> — following an authorized person through a secured door without their own access credential, relying on politeness (holding the door) or simply not being challenged.</li>\n  </ul>\n  <div class=\"callout warn\">Tailgating defenses are physical and cultural, not just technical: mantrap doors (only one person passes at a time), badge-in requirements enforced without exception, and a workplace culture where it's normal and expected to politely challenge someone without a visible badge.</div>",
      "check": {
        "type": "quiz",

      "title": "Business Email Compromise (BEC)",
      "concept": "\n  <p><b>BEC</b> is a targeted scam where an attacker impersonates a trusted figure (often an executive) via email, to trick an employee into an unauthorized action — usually a wire transfer.</p>\n  <p>Typical BEC pattern:</p>\n  <ol>\n    <li>Attacker researches company structure (often via OSINT) to identify a real CEO/CFO and a real employee who handles payments</li>\n    <li>A spoofed or lookalike-domain email arrives, appearing to be from the executive, creating urgency: \"I'm in a meeting, need this wire sent immediately, can't talk right now\"</li>\n    <li>The employee, trying to be helpful and responsive to who they believe is their boss, completes the transfer before anyone double-checks</li>\n  </ol>\n  <div class=\"callout warn\">BEC has caused billions of dollars in real losses — it requires no malware, no technical exploit at all, just a convincing email and a moment of misplaced trust under manufactured time pressure. The best defense: a strict policy requiring out-of-band verification (a phone call to a known number) for any wire transfer request, no exceptions, regardless of who appears to be asking.</div>",

      "id": "s10",
      "title": "Insider threats",
      "concept": "\n  <p>Not every threat comes from outside. An <b>insider threat</b> is a current or former employee, contractor, or partner who misuses their legitimate access to cause harm.</p>\n  <ul>\n    <li><b>Malicious insider</b> — deliberately steals data, sabotages systems, often around termination or after a grievance</li>\n    <li><b>Negligent insider</b> — no malicious intent, but causes harm through carelessness (clicking a phishing link, misconfiguring a system, losing a device)</li>\n    <li><b>Compromised insider</b> — the account is legitimate, but it's actually an external attacker who has stolen those legitimate credentials</li>\n  </ul>\n  <div class=\"callout\">This is exactly why least privilege and monitoring matter even for fully trusted employees — trust and access control are separate concerns. Good security design doesn't assume any individual will always act in the organization's interest, and that's not cynicism, it's just resilience against an entire category of realistic risk, including honest mistakes.</div>",

      "id": "s11",
      "title": "Security awareness training, what actually works",
      "concept": "\n  <p>Organizations spend a lot on security awareness training, but not all approaches are equally effective. Research-informed patterns that tend to work better:</p>\n  <ul>\n    <li><b>Simulated phishing campaigns</b> — sending realistic (but harmless) test phishing emails, then using clicks as a teaching moment rather than punishment</li>\n    <li><b>Frequent, short training</b> beats rare, long training — a 5-minute module quarterly tends to stick better than an annual hour-long session nobody remembers by month three</li>\n    <li><b>Blameless reporting culture</b> — employees need to feel safe reporting \"I think I clicked something bad\" immediately, without fear of punishment, since early reporting dramatically shrinks incident impact</li>\n  </ul>\n  <div class=\"callout warn\">A punitive culture backfires badly here: if employees fear consequences for reporting a mistake, they hide it instead — turning a 10-minute incident response into a multi-day breach discovered far too late.</div>",

      "id": "s12",
      "title": "The psychology of urgency & scarcity",
      "concept": "\n  <p>Two specific psychological levers show up constantly in social engineering, borrowed straight from persuasion and marketing research:</p>\n  <ul>\n    <li><b>Urgency</b> — \"act in the next 10 minutes or lose access\" short-circuits careful thinking. Time pressure measurably reduces how carefully people scrutinize a request.</li>\n    <li><b>Scarcity</b> — \"only 3 spots left,\" \"limited time offer\" — triggers fear of missing out, pushing people toward faster, less considered decisions.</li>\n  </ul>\n  <p>Legitimate organizations rarely have a genuine reason to demand instant action on security-sensitive requests. This single observation — genuine urgency is rare, manufactured urgency is common — is one of the most broadly useful red flags across all social engineering variants.</p>",

      "title": "Physical security basics",
      "concept": "\n  <p>Cybersecurity and physical security are deeply connected — a locked-down network means little if someone can just walk up to an unlocked server room.</p>\n  <ul>\n    <li><b>Badge/access control</b> — restricting who can physically enter sensitive areas</li>\n    <li><b>Clean desk policy</b> — no sensitive documents or logged-in unlocked screens left visible/accessible when unattended</li>\n    <li><b>Device lock screens</b> — an unlocked, unattended workstation is effectively an open door to whatever that user has access to</li>\n    <li><b>Shredding sensitive documents</b> — \"dumpster diving\" (literally searching through discarded trash) for sensitive documents is a real, historically effective reconnaissance technique</li>\n  </ul>\n  <div class=\"callout\">Physical security failures often enable digital compromise directly — a photographed sticky note with a password, or an unlocked screen in an open office, can undo a great deal of otherwise-solid technical security.</div>",

      "id": "s14",
      "title": "Deepfakes & synthetic media risks",
      "concept": "\n  <p>A newer twist on impersonation: AI-generated <b>deepfakes</b> — synthetic audio or video convincingly mimicking a real person's voice or appearance. This has already moved from novelty to real incident: attackers have used AI-cloned voices of executives in real BEC-style scams, convincing employees to authorize transfers over what sounded like a genuine phone call.</p>\n  <p>This adds an unsettling wrinkle to social engineering defense — \"I recognized their voice\" is no longer sufficient verification by itself.</p>\n  <div class=\"callout warn\">The defense response mirrors BEC's: sensitive requests need verification through an independent, pre-established channel (e.g. calling a known number back, or a pre-agreed verification phrase/code) — never trusting the medium of the request itself, however convincing it sounds or looks.</div>",

      "id": "s15",
      "title": "Incident response basics: the 6 phases",
      "concept": "\n  <p>When something does go wrong, a structured response matters more than heroics. The commonly taught phases:</p>\n  <ol>\n    <li><b>Preparation</b> — having a plan, tools, and trained people ready before anything happens</li>\n    <li><b>Identification</b> — detecting and confirming that an incident is actually occurring</li>\n    <li><b>Containment</b> — limiting the damage (e.g. isolating an infected machine from the network)</li>\n    <li><b>Eradication</b> — removing the actual root cause (malware, unauthorized access, the vulnerability exploited)</li>\n    <li><b>Recovery</b> — safely restoring normal operations</li>\n    <li><b>Lessons learned</b> — a blameless post-incident review: what happened, what worked, what should change</li>\n  </ol>\n  <div class=\"callout\">A very common real mistake: skipping straight to eradication/recovery without proper containment first — potentially tipping off the attacker, or restoring systems before the actual root cause is understood, only for the same incident to recur days later.</div>",

      "title": "MISTAKE: Reporting a suspected phish, the right way",

      "title": "Building a personal threat model",
      "concept": "\n  <p>The threat modeling framework from earlier applies just as well to individuals as organizations. A simplified personal version:</p>\n  <ol>\n    <li><b>What am I protecting?</b> — financial accounts, personal photos, professional reputation, private communications</li>\n    <li><b>Who might target me, and why?</b> — a random opportunistic scammer looks very different from someone specifically targeting you personally</li>\n    <li><b>What's realistic for my actual situation?</b> — a journalist or activist in a hostile environment has a genuinely different threat model than an average person, and their security practices should reasonably differ accordingly</li>\n  </ol>\n  <div class=\"callout\">This reframes \"good security practice\" away from one-size-fits-all advice (\"always do X\") toward something more genuinely useful: understanding your own specific realistic risks well enough to prioritize your actual limited time and effort sensibly, rather than either being paranoid about unlikely threats or careless about real ones.</div>",

    {
      "id": "cl1",
      "title": "IaaS, PaaS, SaaS: the service models",
      "concept": "\n  <p>Cloud computing splits into three main service models, each shifting the security responsibility line (recall the Shared Responsibility Model from Foundations):</p>\n  <ul>\n    <li><b>IaaS (Infrastructure as a Service)</b> — rented raw compute/storage/networking (e.g. AWS EC2 virtual machines). You manage the OS, patches, and everything above it.</li>\n    <li><b>PaaS (Platform as a Service)</b> — a managed runtime environment (e.g. Heroku, AWS Elastic Beanstalk). The provider manages the OS/runtime; you just deploy application code.</li>\n    <li><b>SaaS (Software as a Service)</b> — a complete application you just use (e.g. Gmail, Salesforce). The provider manages essentially everything except your account security and data you put into it.</li>\n  </ul>\n  <pre>IaaS:  You manage:  App, Data, Runtime, OS\nPaaS:  You manage:  App, Data\nSaaS:  You manage:  Data (and your own account security)</pre>\n  <div class=\"callout\">More \"as a Service\" abstraction generally means less of the stack you're responsible for securing — but never zero. Even pure SaaS still leaves you responsible for who has access and what data you put there.</div>",

      "id": "cl2",
      "title": "IAM: Identity and Access Management",
      "concept": "\n  <p><b>IAM</b> is the system controlling who (or what) can do what, within a cloud environment. It's arguably the single most important cloud security concept, because IAM misconfigurations are behind an enormous share of real-world cloud breaches.</p>\n  <p>Core IAM building blocks:</p>\n  <ul>\n    <li><b>Users</b> — individual identities (people)</li>\n    <li><b>Roles</b> — a set of permissions that can be assumed temporarily, often by a service rather than a person</li>\n    <li><b>Policies</b> — documents defining exactly what actions are allowed/denied on which resources</li>\n  </ul>\n  <pre>{\n  \"Effect\": \"Allow\",\n  \"Action\": \"s3:GetObject\",\n  \"Resource\": \"arn:aws:s3:::my-bucket/*\"\n}</pre>\n  <div class=\"callout warn\">A hugely common real mistake: attaching overly broad policies (like \"Action: *\" meaning literally everything, on \"Resource: *\" meaning literally everything) out of convenience during development, then forgetting to narrow them before going to production.</div>",

      "title": "S3 buckets & the public exposure problem",

      "title": "Cloud metadata services & SSRF risk",

      "id": "cl7",
      "title": "Kubernetes security basics",
      "concept": "\n  <p><b>Kubernetes (K8s)</b> orchestrates containers at scale — deciding where they run, scaling them, and keeping them healthy. It introduces its own security surface worth knowing:</p>\n  <ul>\n    <li><b>RBAC (Role-Based Access Control)</b> — controls who can do what within the cluster, exactly analogous to cloud IAM but scoped to Kubernetes objects</li>\n    <li><b>Network policies</b> — Kubernetes' version of network segmentation, controlling which pods (running containers) can talk to which others</li>\n    <li><b>Secrets management</b> — Kubernetes \"Secrets\" store sensitive values, but by default are only base64-encoded (not encrypted!) at rest unless additional encryption is explicitly configured</li>\n  </ul>\n  <div class=\"callout warn\">That last point trips up a lot of teams — assuming \"Secret\" in the name means \"encrypted\" by default, when out-of-the-box it's really just a mild obfuscation unless you deliberately enable encryption at rest.</div>",

      "id": "cl8",
      "title": "Serverless security considerations",
      "concept": "\n  <p><b>Serverless</b> computing (like AWS Lambda, Azure Functions) runs your code in short-lived, provider-managed execution environments — you don't manage servers at all, just deploy functions that run in response to events.</p>\n  <p>Security implications shift again:</p>\n  <ul>\n    <li>No OS patching to worry about — the provider fully manages that layer</li>\n    <li>Each function should have its own narrowly-scoped IAM role — a common mistake is reusing one broad role across many functions for convenience</li>\n    <li>Dependencies still matter — a serverless function using a vulnerable third-party library is just as exploitable as one running on a traditional server</li>\n    <li>Event injection — since functions are triggered by external events (API calls, file uploads, queue messages), untrusted event data still needs the exact same input validation as any other application input</li>\n  </ul>",

      "id": "cl9",
      "title": "Cloud logging & CloudTrail-style auditing",
      "concept": "\n  <p>Cloud providers offer centralized audit logging services (AWS CloudTrail, Azure Activity Log, GCP Cloud Audit Logs) that record essentially every API call made against your account — who did what, when, and from where.</p>\n  <p>This is foundational for cloud incident response: without it, you genuinely cannot answer \"what did the attacker actually do after they got in?\" Key practices:</p>\n  <ul>\n    <li>Enable logging in every region/account, not just the ones you actively use — attackers sometimes deliberately operate in unused regions hoping logging was skipped there</li>\n    <li>Store logs somewhere the compromised account itself can't delete them (a separate, more restricted logging account is a common pattern)</li>\n    <li>Actually monitor them — logs nobody reviews provide zero real-time protective value, only after-the-fact forensic value</li>\n  </ul>\n  <div class=\"callout warn\">A sophisticated real attacker technique: disabling audit logging as one of their very first actions after gaining sufficient access — which is exactly why logs should be stored somewhere that even a compromised admin account can't delete or disable.</div>",

      "id": "cl10",
      "title": "Cloud Security Posture Management (CSPM)",
      "concept": "\n  <p>Given how easy cloud misconfigurations are (public buckets, overly broad IAM, unencrypted resources), <b>CSPM</b> tools continuously scan a cloud environment against known-good security baselines and flag drift.</p>\n  <p>Typical CSPM findings look like:</p>\n  <pre>[HIGH]   S3 bucket 'company-backups' allows public read access\n[MEDIUM] IAM user 'svc-account-3' has unused admin privileges (90+ days)\n[LOW]    EBS volume not encrypted at rest</pre>\n  <p>The underlying idea: cloud environments change constantly (new resources, new permissions, new services), so a one-time security review goes stale almost immediately. Continuous automated checking is the only way to keep pace with that rate of change at scale.</p>",

      "id": "cl12",
      "title": "Secrets management in the cloud",
      "concept": "\n  <p>We've touched on secrets a few times now (env vars, Kubernetes Secrets) — cloud providers offer dedicated <b>secrets managers</b> (AWS Secrets Manager, Azure Key Vault, HashiCorp Vault) specifically built for this problem, offering real advantages over ad-hoc approaches:</p>\n  <ul>\n    <li>Actual encryption at rest, by default</li>\n    <li>Fine-grained access control over who/what can retrieve which specific secret</li>\n    <li>Automatic rotation — periodically generating new credentials without manual intervention</li>\n    <li>Full audit trail of every access to every secret</li>\n  </ul>\n  <div class=\"callout\">The underlying principle connects back to the key management lesson in Cryptography: the algorithm is rarely the weak point, but how secrets are generated, stored, and rotated absolutely is — dedicated secrets managers exist specifically to get that operational discipline right by default, rather than relying on every team to reinvent it correctly themselves.</div>",

      "title": "Infrastructure as Code (IaC) security",
      "concept": "\n  <p>Modern cloud infrastructure is increasingly defined declaratively in code (Terraform, CloudFormation) rather than manually clicked together in a web console. This has real security upsides and its own distinct new risks:</p>\n  <ul>\n    <li><b>Upside:</b> infrastructure changes can be code-reviewed, version-controlled, and scanned automatically before ever being applied — catching misconfigurations before they ever reach production, unlike a manual console change that ships instantly with no review step</li>\n    <li><b>Risk:</b> a misconfiguration baked into a reusable IaC template gets replicated everywhere that template is used — a single mistake can now scale across an entire infrastructure fleet automatically, rather than being an isolated one-off error</li>\n  </ul>\n  <div class=\"callout\">Dedicated IaC scanning tools exist specifically to catch security misconfigurations (like an accidentally public storage bucket) at the code-review stage — before deployment — rather than discovering the problem only after it's already live and exploitable in production.</div>",

    {
      "id": "m1",
      "title": "Types of malware, a field guide",
      "concept": "\n  <p>\"Malware\" is an umbrella term. Knowing the specific category matters because each behaves and spreads differently:</p>\n  <ul>\n    <li><b>Virus</b> — attaches itself to legitimate files/programs, spreads when the infected file is run/shared, requires some form of human action to propagate</li>\n    <li><b>Worm</b> — self-replicating, spreads automatically across networks with no human action required (recall the Morris Worm from the terminal archive)</li>\n    <li><b>Trojan</b> — disguises itself as legitimate/desirable software, doesn't self-replicate, relies on tricking the user into installing it</li>\n    <li><b>Ransomware</b> — encrypts victim's files and demands payment for the decryption key</li>\n    <li><b>Spyware</b> — covertly monitors/collects user activity or data</li>\n    <li><b>Rootkit</b> — specifically designed to hide its own presence (and often other malware's presence) deep in the system, sometimes at the OS kernel level</li>\n  </ul>\n  <div class=\"callout\">Real-world malware frequently combines categories — a trojan that installs a rootkit to hide itself, which then downloads ransomware. These labels describe primary behaviors, not mutually exclusive boxes.</div>",

      "id": "m2",
      "title": "Static vs. dynamic analysis",
      "concept": "\n  <p>When analyzing a suspected malware sample, two fundamentally different approaches exist:</p>\n  <ul>\n    <li><b>Static analysis</b> — examining the file WITHOUT running it: looking at its code, strings, file structure, and metadata. Safer (nothing executes), but sophisticated malware can obfuscate its code to resist this kind of inspection.</li>\n    <li><b>Dynamic analysis</b> — actually running the malware in a controlled, isolated environment and observing its real behavior: what files it creates, what network connections it makes, what registry keys it modifies.</li>\n  </ul>\n  <p>Neither approach alone is complete — static analysis can miss behavior that only appears at runtime (especially with obfuscated or \"packed\" malware), while dynamic analysis can miss behavior the malware deliberately withholds if it detects it's being watched (more on that shortly).</p>",

      "id": "m3",
      "title": "Sandboxing: analyzing malware safely",
      "concept": "\n  <p>You obviously don't run suspected malware on your actual laptop. A <b>sandbox</b> is an isolated environment (often a disposable virtual machine with no real network access, or only carefully monitored network access) specifically built to safely observe what a malicious file actually does.</p>\n  <p>Good sandbox practice includes:</p>\n  <ul>\n    <li>Full network isolation, or a carefully controlled/simulated internet to observe callback attempts without providing real connectivity</li>\n    <li>Snapshotting the VM before execution, so it can be instantly reset to a clean state afterward</li>\n    <li>Never sandboxing on hardware/networks connected to anything sensitive or production-related</li>\n  </ul>\n  <div class=\"callout warn\">Sophisticated malware increasingly checks whether it's running in a sandbox (looking for VM-specific hardware signatures, unusually short mouse-movement history, or known analysis tool processes) and simply behaves innocently — or doesn't run at all — if it detects an analysis environment.</div>",

      "id": "m4",
      "title": "Indicators of Compromise (IOCs)",
      "concept": "\n  <p>An <b>IOC</b> is a piece of forensic evidence suggesting a system has been compromised — the digital equivalent of a fingerprint left at a crime scene. Common IOC types:</p>\n  <ul>\n    <li><b>File hashes</b> — a known-malicious file's exact SHA-256 hash, letting defenders instantly check if that same file exists elsewhere</li>\n    <li><b>IP addresses / domains</b> — known command-and-control servers malware \"phones home\" to</li>\n    <li><b>Registry keys / file paths</b> — locations malware is known to create or modify to persist</li>\n    <li><b>Unusual process behavior</b> — e.g. a Word document process spontaneously spawning a PowerShell process, a pattern rarely legitimate</li>\n  </ul>\n  <p>Organizations share IOCs (often via formats like STIX/TAXII) so that once one organization identifies a threat, others can quickly check their own environment for the same indicators — turning one investigation into protection for many.</p>",

      "id": "m5",
      "title": "Ransomware, mechanics and response",
      "concept": "\n  <p>We've mentioned ransomware a few times — worth understanding its actual mechanics in more depth. A typical modern ransomware attack chain:</p>\n  <ol>\n    <li><b>Initial access</b> — often phishing, an exposed remote-access service, or an unpatched vulnerability</li>\n    <li><b>Lateral movement</b> — spreading from the initial foothold to other systems on the network, often targeting backup systems specifically</li>\n    <li><b>Data exfiltration</b> — modern \"double extortion\" ransomware steals sensitive data BEFORE encrypting anything, so even a victim with perfect backups still faces the threat of stolen data being published</li>\n    <li><b>Encryption</b> — files across affected systems are encrypted, typically leaving a ransom note with payment instructions</li>\n  </ol>\n  <div class=\"callout warn\">The \"double extortion\" pattern significantly changed incident response calculus — good backups alone no longer fully solve the problem, since the threat has expanded beyond \"can we restore our data\" to also include \"will our stolen data get published regardless.\"</div>",

      "id": "m6",
      "title": "Command and Control (C2)",
      "concept": "\n  <p>Once malware compromises a system, it typically needs to communicate back to the attacker — receiving further instructions, exfiltrating data, or receiving additional malicious payloads. This communication channel is called <b>Command and Control (C2)</b>.</p>\n  <p>C2 techniques try to blend in or evade detection:</p>\n  <ul>\n    <li>Using common protocols/ports (HTTPS on port 443) to blend in with normal traffic</li>\n    <li><b>Domain generation algorithms (DGAs)</b> — malware algorithmically generates many possible C2 domain names, so defenders can't simply block one known static domain</li>\n    <li>Using legitimate cloud/social media services (a real Twitter account, a real cloud storage service) as a covert C2 channel, since blocking legitimate infrastructure entirely isn't practical</li>\n  </ul>\n  <div class=\"callout\">This is exactly why network monitoring (recall SIEM) matters so much beyond just blocklists — sophisticated C2 traffic is specifically designed to look like normal, legitimate activity at a surface level.</div>",

      "title": "Persistence mechanisms",
      "concept": "\n  <p>Malware wants to survive a reboot, not just run once and disappear. Common <b>persistence</b> techniques on Windows systems (one of the most attacked platforms) include:</p>\n  <ul>\n    <li>Registry \"Run\" keys — programs listed here launch automatically at every login</li>\n    <li>Scheduled tasks — creating a task that re-launches the malware on a schedule</li>\n    <li>Malicious services — installing itself as a background Windows service</li>\n    <li>Startup folder — placing a shortcut in a folder Windows automatically executes at login</li>\n  </ul>\n  <p>Defenders specifically hunt for these locations during incident response, since checking \"what auto-runs on this system\" is one of the fastest ways to find malware that's trying to survive long-term rather than just running once.</p>",

      "title": "Fileless malware",
      "concept": "\n  <p>Traditional malware exists as a file on disk — which means traditional antivirus, scanning files, has a real chance of catching it. <b>Fileless malware</b> tries to avoid ever writing a malicious file to disk at all, instead operating entirely in memory or abusing legitimate, already-trusted system tools.</p>\n  <p>A very common technique: abusing <b>PowerShell</b> (a legitimate, powerful Windows scripting tool) to download and execute malicious code directly in memory, without ever saving an executable file that traditional signature-based antivirus could scan and flag.</p>\n  <div class=\"callout warn\">This is a great example of \"living off the land\" — using tools that are already present and trusted on the system, rather than bringing in obviously suspicious custom malware files. It's much harder to distinguish malicious PowerShell usage from an administrator's legitimate script, which is exactly the point.</div>",

      "id": "m9",
      "title": "Antivirus & EDR: detection approaches",
      "concept": "\n  <p>How does defensive software actually try to catch malware?</p>\n  <ul>\n    <li><b>Signature-based detection</b> — matches files against a database of known-malicious hashes/patterns. Fast and precise, but useless against anything brand new.</li>\n    <li><b>Heuristic detection</b> — looks for suspicious characteristics/structure even without an exact known match (e.g. code that tries to hide itself, or unusual API call patterns)</li>\n    <li><b>Behavioral detection (EDR — Endpoint Detection and Response)</b> — monitors what a process actually DOES at runtime (e.g. \"this process just tried to encrypt hundreds of files rapidly\" or \"this process is trying to disable security logging\"), rather than only judging files before they run</li>\n  </ul>\n  <div class=\"callout\">Modern EDR tools are essentially a SIEM's philosophy (behavior + correlation over time) applied specifically at the individual endpoint level, and they're now considered a baseline enterprise security control, not an optional extra.</div>",

      "id": "m11",
      "title": "Advanced Persistent Threats (APTs)",
      "concept": "\n  <p>An <b>APT</b> refers to a sophisticated, well-resourced attacker (often nation-state-affiliated) conducting a prolonged, stealthy campaign — the opposite of a smash-and-grab attack. Characteristics:</p>\n  <ul>\n    <li><b>Advanced</b> — custom tooling, zero-days, significant technical sophistication</li>\n    <li><b>Persistent</b> — the goal is long-term, often undetected access, sometimes for months or years, rather than a quick one-time payoff</li>\n    <li><b>Threat</b> — a real, capable, motivated adversary, not an opportunistic script kiddie</li>\n  </ul>\n  <p>APT campaigns typically prioritize staying hidden over causing immediate visible damage — the entire value of their access comes from it remaining undetected as long as possible, which shapes every tactical choice they make (Stuxnet, from the terminal archive, is a well-documented example of this style of operation).</p>",
